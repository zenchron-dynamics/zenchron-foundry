version: 2
updates:
  # GitHub Actions — keep CI pinned + patched
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci", "security"]
    commit-message:
      prefix: "chore(ci)"

  # Docker base images — supported PHP lines
  - package-ecosystem: "docker"
    directories:
      - "/images/php-fpm/8.3"
      - "/images/php-fpm/8.4"
      - "/images/php-cli/8.3"
      - "/images/php-cli/8.4"
      - "/images/php-worker/8.3"
      - "/images/php-worker/8.4"
      - "/images/php-frankenphp/8.3"
      - "/images/php-frankenphp/8.4"
      - "/images/caddy"
      - "/images/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker", "security"]
    commit-message:
      prefix: "chore(images)"


  # Composer — only active once example manifests exist
  # NO composer entry. examples/laravel and examples/symfony are TEMPLATES —
  # their READMEs say "Reference only … No app code shipped here" — so they
  # contain no composer.json/composer.lock for Dependabot to monitor. The
  # previous entry pointed at both directories and silently updated nothing,
  # which is worse than no entry: it implied example dependencies were being
  # watched. scripts/assert-dependabot-manifests.sh now fails if any configured
  # directory lacks its ecosystem's manifest (#119).
