name: build-images

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (true/false)"
        default: "false"
      platforms:
        description: "Target platforms (multi-arch requires push=true; load can only do one arch)"
        default: "linux/amd64"
  workflow_call:
    inputs:
      push:
        type: string
        default: "false"
      platforms:
        type: string
        default: "linux/amd64"
    outputs:
      digests:
        description: "JSON map of image -> digest"
        value: ${{ jobs.build.outputs.digests }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics
  # Default linux/amd64. To build multi-arch (linux/amd64,linux/arm64) you MUST
  # also set push=true — the docker exporter (load) cannot hold a manifest list.
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    name: ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          base="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}"
          if [ "${{ matrix.ver }}" = "prod" ]; then
            suffix="prod"
          else
            suffix="${{ matrix.ver }}-prod"
          fi
          date_tag="${suffix}-$(date -u +%Y.%m.%d)"
          build_tag="${suffix}-build.${{ github.run_number }}"
          {
            echo "image=${base}"
            echo "tags=${base}:${suffix},${base}:${date_tag},${base}:${build_tag}"
            echo "primary=${base}:${suffix}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+optional push) with SBOM + provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ inputs.push == 'true' }}
          # load only when NOT pushing AND single-arch (docker exporter can't hold
          # a multi-arch manifest list).
          load: ${{ inputs.push != 'true' && env.PLATFORMS == 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Attestations (sbom/provenance) produce a manifest list, which the
          # docker exporter (load:true) cannot handle. Only enable them when
          # pushing to the registry (OCI exporter).
          sbom: ${{ inputs.push == 'true' }}
          provenance: ${{ inputs.push == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Record digest
        id: collect
        if: inputs.push == 'true'
        run: echo "digests=${{ matrix.fam }}:${{ matrix.ver }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
