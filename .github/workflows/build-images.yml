name: build-images

# Build-and-validate ONLY. This workflow can NEVER publish canonical production
# tags (*-prod / prod). It builds each image locally (load) so a developer or
# a caller can confirm every Dockerfile builds. Canonical tags are mutated
# exclusively by release.yml (stable) and publish-rc.yml (RC). See
# docs/release-process.md and the controls in scripts/assert-image-matrix.sh.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platform for the local build (single arch; load cannot hold a manifest list)"
        default: "linux/amd64"
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux/amd64"

# No packages:write — this workflow cannot push. Removing the scope makes a
# canonical-tag push impossible even if a step tried.
permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    name: ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    strategy:
      fail-fast: false
      # WF-08: serialized, matching every other heavy matrix (ci.yml build-test,
      # scan-images.yml, verify-rc.yml, publish-ghcr.yml). Single 2 vCPU / 4 GB
      # self-hosted host: concurrent builds pin each other's buildkit cache on
      # the small shared disk and contend for the two cores.
      max-parallel: 1
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build (no push — local validation tag only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: zenchron-buildtest/${{ matrix.fam }}:${{ matrix.ver }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
