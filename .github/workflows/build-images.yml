name: build-images

# Build-and-validate ONLY. This workflow can NEVER publish canonical production
# tags (*-prod / prod). It builds each image locally (load) so a developer or
# a caller can confirm every Dockerfile builds. Canonical tags are mutated
# exclusively by release.yml (stable) and publish-rc.yml (RC). See
# docs/release-process.md and the controls in scripts/assert-image-matrix.sh.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platform for the local build (single arch; load cannot hold a manifest list)"
        default: "linux/amd64"
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux/amd64"

# No packages:write — this workflow cannot push. Removing the scope makes a
# canonical-tag push impossible even if a step tried.
permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    name: ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Reset workspace ownership (self-hosted hygiene, post-checkout)
        run: bash scripts/ci/reset-workspace-ownership.sh
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build (no push — local validation tag only)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: zenchron-buildtest/${{ matrix.fam }}:${{ matrix.ver }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
      - name: Cleanup Docker (job-scoped)
        if: always()
        env:
          MATRIX_KEY: ${{ matrix.fam }}-${{ matrix.ver }}
        run: |
          docker image rm -f "zenchron-buildtest/${{ matrix.fam }}:${{ matrix.ver }}" 2>/dev/null || true
          bash scripts/ci/cleanup-docker-job.sh
