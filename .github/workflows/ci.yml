name: ci

# ---------------------------------------------------------------------------
# EVERY JOB HERE RUNS ON A GITHUB-HOSTED RUNNER. STATICALLY. NO EXCEPTIONS.
#
# A `pull_request` workflow executes the workflow file from the MERGE REF, which
# includes the pull request's own edits to `.github/workflows/`. A fork can
# therefore rewrite `runs-on`, delete any assertion script, and GitHub picks the
# runner BEFORE a single line of repository code runs.
#
# So repository code CANNOT govern runner assignment, and this file does not
# pretend otherwise. The earlier design used a conditional `runs-on` guarded by
# an in-workflow checker; that protected against maintainer drift, never against
# a fork. The real boundary is at GitHub's control plane: the self-hosted runners
# live in a dedicated runner group restricted to this repository and to an
# explicit list of trusted workflow paths on `refs/heads/master`. Nothing that a
# pull request can edit is able to reach it.
#
# Heavy validation (build, smoke, scan, reconciliation) therefore does NOT run
# here. It runs in `.github/workflows/trusted-validation.yml`, whose definition
# comes from master, which takes an explicit reviewed commit SHA, verifies that
# SHA belongs to the pull request it claims, and only then checks it out.
#
# scripts/assert-pr-workflows-github-hosted.sh is a MAINTAINER-DRIFT check, not
# a security boundary: it stops us reintroducing a self-hosted `runs-on` here by
# accident. It cannot stop a fork, and it no longer claims to.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# No secrets are referenced by this workflow and the token stays read-only, so
# an untrusted fork job on ubuntu-latest has nothing to exfiltrate.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check required layout
        run: bash scripts/check-structure.sh

      - name: Assert no Wolfi/Chainguard/apk in active code
        run: bash scripts/assert-no-wolfi.sh

      - name: Assert all GitHub Actions are SHA-pinned
        run: bash scripts/assert-pinned-actions.sh

      - name: Assert no fork PR can reach a privileged self-hosted runner
        run: bash scripts/assert-pr-workflows-github-hosted.sh

      - name: Assert required-release-checks match the real job names
        run: bash scripts/assert-required-checks.sh

      - name: Assert every Dependabot directory has its manifest
        run: bash scripts/assert-dependabot-manifests.sh
      - name: Assert no repository-wide cosign identity examples
        run: bash scripts/assert-no-identity-wildcards.sh

      - name: Assert all CI container images are digest-pinned
        run: bash scripts/assert-pinned-containers.sh

      - name: Assert the production image matrix is complete (10/10, no legacy lines)
        run: bash scripts/assert-image-matrix.sh

      - name: Assert only approved release environments are referenced
        run: bash scripts/assert-environment-names.sh

      - name: Assert every workflow reset block matches the canonical text (SC-02)
        run: bash scripts/ci/assert-canonical-reset-block.sh

  lint:
    name: lint (shell / yaml / md / dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: ./scripts

      - name: ShellCheck worker scripts (images/php-worker)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            -S warning \
            images/php-worker/*/worker-entrypoint \
            images/php-worker/*/worker-healthcheck

      - name: yamllint
        run: |
          docker run --rm -v "$PWD:/data" -w /data \
            pipelinecomponents/yamllint@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d \
            yamllint -c .yamllint.yaml --strict profiles policies .github

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !docs/audits/**
            #node_modules

      - name: Hadolint (all Dockerfiles)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work hadolint/hadolint:2.12.0-debian@sha256:27173fe25e062448490a32de410c08491c626a0bef360aa2ce5d5bdd9384b50d \
            sh -c 'find images examples -name Dockerfile -print0 | xargs -0 -I{} hadolint --config policies/hadolint.yaml {}'

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # Use the open-source gitleaks CLI image directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization repositories;
      # the CLI itself does not.
      - name: Gitleaks (CLI)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config policies/gitleaks.toml \
            --redact --no-banner --verbose

  sast:
    name: semgrep docker security
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.86.0@sha256:a9ea2d5621c29d815d90c2a3b2f9571da8972ef4ff855c9e4902681730240e35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job runs INSIDE the semgrep container (fresh bind-mounted workspace,
      # container user is root) — the host-runner ownership reset does not apply
      # here and its `_work` path assumption fails in a container. Instead mark
      # the checkout safe so semgrep's git file enumeration works.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Semgrep rules
        run: semgrep --error --config policies/semgrep/docker-security.yml .

  # build+smoke and its aggregation are NOT here any more. Building ten images
  # needs the self-hosted pool, and nothing a pull request can edit may reach
  # that pool. They run in trusted-validation.yml, whose definition comes from
  # master and which takes an explicitly reviewed commit SHA.

  compose-validate:
    name: validate compose profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate self-contained example stacks
        run: |
          set -euo pipefail
          for p in examples/*/compose.yml; do
            echo "validating $p"
            docker compose -f "$p" config --quiet
          done
      - name: Validate profile overlays merge cleanly (over CI base stub)
        run: |
          set -euo pipefail
          # Profiles are OVERLAY FRAGMENTS; layer each over the CI base stub so
          # `config` has real services to validate against. See profiles/_ci-base.yml.
          for p in profiles/compose.*.yml; do
            echo "validating overlay $p"
            docker compose -f profiles/_ci-base.yml -f "$p" config --quiet
          done
