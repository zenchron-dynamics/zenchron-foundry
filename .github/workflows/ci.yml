name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: repo structure
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Check required layout
        run: bash scripts/check-structure.sh

      - name: Assert no Wolfi/Chainguard/apk in active code
        run: bash scripts/assert-no-wolfi.sh

      - name: Assert all GitHub Actions are SHA-pinned
        run: bash scripts/assert-pinned-actions.sh

      - name: Assert all CI container images are digest-pinned
        run: bash scripts/assert-pinned-containers.sh

      - name: Assert the production image matrix is complete (10/10, no legacy lines)
        run: bash scripts/assert-image-matrix.sh

      - name: Assert only approved release environments are referenced
        run: bash scripts/assert-environment-names.sh

  lint:
    name: lint (shell / yaml / md / dockerfile)
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: ./scripts

      - name: ShellCheck worker scripts (images/php-worker)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            -S warning \
            images/php-worker/*/worker-entrypoint \
            images/php-worker/*/worker-healthcheck

      - name: yamllint
        run: |
          docker run --rm -v "$PWD:/data" -w /data \
            pipelinecomponents/yamllint@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d \
            yamllint -c .yamllint.yaml --strict profiles policies .github

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: |
            **/*.md
            !docs/audits/**
            #node_modules

      - name: Hadolint (all Dockerfiles)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work hadolint/hadolint:2.12.0-debian@sha256:27173fe25e062448490a32de410c08491c626a0bef360aa2ce5d5bdd9384b50d \
            sh -c 'find images examples -name Dockerfile -print0 | xargs -0 -I{} hadolint --config policies/hadolint.yaml {}'

  secrets:
    name: secret scan (gitleaks)
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: { fetch-depth: 0 }
      # Use the open-source gitleaks CLI image directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization repositories;
      # the CLI itself does not.
      - name: Gitleaks (CLI)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config policies/gitleaks.toml \
            --redact --no-banner --verbose

  sast:
    name: semgrep docker security
    runs-on: [self-hosted, linux, x64, zenchron]
    container: semgrep/semgrep:1.86.0@sha256:a9ea2d5621c29d815d90c2a3b2f9571da8972ef4ff855c9e4902681730240e35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # This job runs INSIDE the semgrep container (fresh bind-mounted workspace,
      # container user is root) — the host-runner ownership reset does not apply
      # here and its `_work` path assumption fails in a container. Instead mark
      # the checkout safe so semgrep's git file enumeration works.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Semgrep rules
        run: semgrep --error --config policies/semgrep/docker-security.yml .

  build-test:
    name: build+smoke ${{ matrix.target.fam }} ${{ matrix.target.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    needs: [structure, lint]
    # Trust boundary: a fork PR builds its own Dockerfiles on the self-hosted
    # runner (arbitrary code). Only run for same-repo branches; fork PRs skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      # Serialized: the self-hosted runner has a small (~38G) shared disk. Running
      # builds concurrently each pin the other's buildkit cache (prune can't
      # reclaim in-use cache), exhausting the disk. One at a time lets the
      # pre-build prune reclaim the full baseline. (Real fix: bigger runner disk.)
      max-parallel: 1
      # FULL matrix — every one of the 10 production images is built AND smoke
      # tested on every PR/push. No representative subset (see docs/release-process.md).
      matrix:
        target:
          - { fam: php-cli,        ver: "8.3" }
          - { fam: php-cli,        ver: "8.4" }
          - { fam: php-fpm,        ver: "8.3" }
          - { fam: php-fpm,        ver: "8.4" }
          - { fam: php-worker,     ver: "8.3" }
          - { fam: php-worker,     ver: "8.4" }
          - { fam: php-frankenphp, ver: "8.3" }
          - { fam: php-frankenphp, ver: "8.4" }
          - { fam: nginx,          ver: "" }
          - { fam: caddy,          ver: "" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Disk snapshot before build (job-scoped cleanup runs at job end)
        run: df -h / | tail -1
      - name: Build (no push, amd64, loaded for smoke)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ matrix.target.fam }}${{ matrix.target.ver && format('/{0}', matrix.target.ver) || '' }}
          platforms: linux/amd64
          push: false
          load: true
          # No gha cache: mode=max export is the biggest transient disk consumer
          # on the small self-hosted disk. Validation builds don't need cross-run
          # cache; correctness over speed here.
          tags: zenchron-smoke/${{ matrix.target.fam }}:citest
      - name: Smoke test the built image (runtime contract)
        run: |
          set -euo pipefail
          # Fail loudly if the image vanished (e.g. a stray prune) — otherwise the
          # negative "tool absent" checks can false-pass on a missing image.
          docker image inspect "zenchron-smoke/${{ matrix.target.fam }}:citest" >/dev/null
          bash "scripts/smoke/smoke-${{ matrix.target.fam }}.sh" \
            "zenchron-smoke/${{ matrix.target.fam }}:citest"


  compose-validate:
    name: validate compose profiles
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate self-contained example stacks
        run: |
          set -euo pipefail
          for p in examples/*/compose.yml; do
            echo "validating $p"
            docker compose -f "$p" config --quiet
          done
      - name: Validate profile overlays merge cleanly (over CI base stub)
        run: |
          set -euo pipefail
          # Profiles are OVERLAY FRAGMENTS; layer each over the CI base stub so
          # `config` has real services to validate against. See profiles/_ci-base.yml.
          for p in profiles/compose.*.yml; do
            echo "validating overlay $p"
            docker compose -f profiles/_ci-base.yml -f "$p" config --quiet
          done
