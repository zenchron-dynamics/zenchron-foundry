name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: repo structure
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check required layout
        run: bash scripts/check-structure.sh

      - name: Assert no Wolfi/Chainguard/apk in active code
        run: bash scripts/assert-no-wolfi.sh

      - name: Assert all GitHub Actions are SHA-pinned
        run: bash scripts/assert-pinned-actions.sh

      - name: Assert required-release-checks match the real job names
        run: bash scripts/assert-required-checks.sh

      - name: Assert all CI container images are digest-pinned
        run: bash scripts/assert-pinned-containers.sh

      - name: Assert the production image matrix is complete (10/10, no legacy lines)
        run: bash scripts/assert-image-matrix.sh

      - name: Assert only approved release environments are referenced
        run: bash scripts/assert-environment-names.sh

      - name: Assert every workflow reset block matches the canonical text (SC-02)
        run: bash scripts/ci/assert-canonical-reset-block.sh

  lint:
    name: lint (shell / yaml / md / dockerfile)
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: ./scripts

      - name: ShellCheck worker scripts (images/php-worker)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            -S warning \
            images/php-worker/*/worker-entrypoint \
            images/php-worker/*/worker-healthcheck

      - name: yamllint
        run: |
          docker run --rm -v "$PWD:/data" -w /data \
            pipelinecomponents/yamllint@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d \
            yamllint -c .yamllint.yaml --strict profiles policies .github

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !docs/audits/**
            #node_modules

      - name: Hadolint (all Dockerfiles)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work hadolint/hadolint:2.12.0-debian@sha256:27173fe25e062448490a32de410c08491c626a0bef360aa2ce5d5bdd9384b50d \
            sh -c 'find images examples -name Dockerfile -print0 | xargs -0 -I{} hadolint --config policies/hadolint.yaml {}'

  secrets:
    name: secret scan (gitleaks)
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # Use the open-source gitleaks CLI image directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization repositories;
      # the CLI itself does not.
      - name: Gitleaks (CLI)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config policies/gitleaks.toml \
            --redact --no-banner --verbose

  sast:
    name: semgrep docker security
    runs-on: [self-hosted, linux, x64, zenchron]
    container: semgrep/semgrep:1.86.0@sha256:a9ea2d5621c29d815d90c2a3b2f9571da8972ef4ff855c9e4902681730240e35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job runs INSIDE the semgrep container (fresh bind-mounted workspace,
      # container user is root) — the host-runner ownership reset does not apply
      # here and its `_work` path assumption fails in a container. Instead mark
      # the checkout safe so semgrep's git file enumeration works.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Semgrep rules
        run: semgrep --error --config policies/semgrep/docker-security.yml .

  build-test:
    name: build+smoke ${{ matrix.target.fam }} ${{ matrix.target.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    needs: [structure, lint]
    # Trust boundary: a fork PR builds its own Dockerfiles on the self-hosted
    # runner (arbitrary code). Only run for same-repo branches; fork PRs skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      # Serialized: the self-hosted runner has a small (~38G) shared disk. Running
      # builds concurrently each pin the other's buildkit cache (prune can't
      # reclaim in-use cache), exhausting the disk. One at a time lets the
      # pre-build prune reclaim the full baseline. (Real fix: bigger runner disk.)
      max-parallel: 1
      # FULL matrix — every one of the 10 production images is built AND smoke
      # tested on every PR/push. No representative subset (see docs/release-process.md).
      matrix:
        target:
          - { fam: php-cli,        ver: "8.3" }
          - { fam: php-cli,        ver: "8.4" }
          - { fam: php-fpm,        ver: "8.3" }
          - { fam: php-fpm,        ver: "8.4" }
          - { fam: php-worker,     ver: "8.3" }
          - { fam: php-worker,     ver: "8.4" }
          - { fam: php-frankenphp, ver: "8.3" }
          - { fam: php-frankenphp, ver: "8.4" }
          - { fam: nginx,          ver: "" }
          - { fam: caddy,          ver: "" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Disk snapshot before build (job-scoped cleanup runs at job end)
        run: df -h / | tail -1
      - name: Build (no push, amd64, loaded for smoke)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ matrix.target.fam }}${{ matrix.target.ver && format('/{0}', matrix.target.ver) || '' }}
          platforms: linux/amd64
          push: false
          load: true
          # No gha cache: mode=max export is the biggest transient disk consumer
          # on the small self-hosted disk. Validation builds don't need cross-run
          # cache; correctness over speed here.
          tags: zenchron-smoke/${{ matrix.target.fam }}:citest
      - name: Smoke test the built image (runtime contract)
        id: smoke
        run: |
          set -euo pipefail
          # Fail loudly if the image vanished (e.g. a stray prune) — otherwise the
          # negative "tool absent" checks can false-pass on a missing image.
          docker image inspect "zenchron-smoke/${{ matrix.target.fam }}:citest" >/dev/null
          bash "scripts/smoke/smoke-${{ matrix.target.fam }}.sh" \
            "zenchron-smoke/${{ matrix.target.fam }}:citest"
      # WF-04: per-image build+smoke outcome, recorded on failure too, assembled
      # into build-results.json + smoke-results.json by the aggregation job.
      - name: Record build+smoke result (real outcomes)
        if: always()
        env:
          FAM: ${{ matrix.target.fam }}
          VER: ${{ matrix.target.ver }}
          DOCKERFILE: images/${{ matrix.target.fam }}${{ matrix.target.ver && format('/{0}', matrix.target.ver) || '' }}/Dockerfile
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          name="${FAM}${VER:+-$VER}"
          mkdir -p build-results
          jq -n --arg name "$name" --arg dockerfile "$DOCKERFILE" \
            --arg build "$BUILD_OUTCOME" --arg smoke "$SMOKE_OUTCOME" \
            '{name: $name, dockerfile: $dockerfile, build: $build, smoke: $smoke}' \
            > "build-results/${name}.json"
          cat "build-results/${name}.json"
      - name: Upload build+smoke result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-result-${{ matrix.target.fam }}${{ matrix.target.ver && format('-{0}', matrix.target.ver) || '' }}
          path: build-results/
          if-no-files-found: error

  # WF-04: assemble the per-leg results into one `build-results` artifact
  # carrying build-results.json + smoke-results.json (real outcomes only), then
  # gate on the matrix result so this required check cannot green a red matrix.
  build-results:
    name: aggregate build+smoke results
    runs-on: [self-hosted, linux, x64, zenchron]
    needs: build-test
    # always(): assemble evidence even when a leg failed. Same fork-PR trust
    # boundary as build-test (its legs skip there, so there is nothing to collect).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-download)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      # No checkout in this job -> no `git clean` — scrub stale results left on
      # the persistent self-hosted workspace by earlier runs before downloading.
      - name: Scrub stale results (persistent workspace, no checkout here)
        run: rm -rf build-results build-results.json smoke-results.json
      - name: Download per-image results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: build-results
          pattern: build-result-*
          merge-multiple: true
      - name: Assemble build-results.json + smoke-results.json (real outcomes)
        run: |
          set -euo pipefail
          jq -s '{image_count: length,
                  images: (sort_by(.name) | map({name, dockerfile, result: .build}))}' \
            build-results/*.json > build-results.json
          jq -s '{image_count: length,
                  images: (sort_by(.name) | map({name, result: .smoke}))}' \
            build-results/*.json > smoke-results.json
          cat build-results.json smoke-results.json
      - name: Upload build-results artifact (both files)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-results
          path: |
            build-results.json
            smoke-results.json
          if-no-files-found: error
      - name: Build matrix must have succeeded
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          set -euo pipefail
          [ "$BUILD_TEST_RESULT" = "success" ] \
            || { echo "REFUSE: build-test matrix result is '$BUILD_TEST_RESULT', not success"; exit 1; }
          echo "OK: build+smoke matrix green; structured results uploaded"

  compose-validate:
    name: validate compose profiles
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate self-contained example stacks
        run: |
          set -euo pipefail
          for p in examples/*/compose.yml; do
            echo "validating $p"
            docker compose -f "$p" config --quiet
          done
      - name: Validate profile overlays merge cleanly (over CI base stub)
        run: |
          set -euo pipefail
          # Profiles are OVERLAY FRAGMENTS; layer each over the CI base stub so
          # `config` has real services to validate against. See profiles/_ci-base.yml.
          for p in profiles/compose.*.yml; do
            echo "validating overlay $p"
            docker compose -f profiles/_ci-base.yml -f "$p" config --quiet
          done
