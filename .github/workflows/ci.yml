name: ci

# ---------------------------------------------------------------------------
# EVERY JOB HERE RUNS ON A GITHUB-HOSTED RUNNER. STATICALLY. NO EXCEPTIONS.
#
# A `pull_request` workflow executes the workflow file from the MERGE REF, which
# includes the pull request's own edits to `.github/workflows/`. A fork can
# therefore rewrite `runs-on`, delete any assertion script, and GitHub picks the
# runner BEFORE a single line of repository code runs.
#
# So repository code CANNOT govern runner assignment, and this file does not
# pretend otherwise. The earlier design used a conditional `runs-on` guarded by
# an in-workflow checker; that protected against maintainer drift, never against
# a fork. The real boundary is at GitHub's control plane: the self-hosted runners
# live in a dedicated runner group restricted to this repository and to an
# explicit list of trusted workflow paths on `refs/heads/master`. Nothing that a
# pull request can edit is able to reach it.
#
# Heavy validation (build, smoke, scan, reconciliation) therefore does NOT run
# here. It runs in `.github/workflows/trusted-validation.yml`, whose definition
# comes from master, which takes an explicit reviewed commit SHA, verifies that
# SHA belongs to the pull request it claims, and only then checks it out.
#
# scripts/assert-pr-workflows-github-hosted.sh is a MAINTAINER-DRIFT check, not
# a security boundary: it stops us reintroducing a self-hosted `runs-on` here by
# accident. It cannot stop a fork, and it no longer claims to.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# No secrets are referenced by this workflow and the token stays read-only, so
# an untrusted fork job on ubuntu-latest has nothing to exfiltrate.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # #241 — THE RESTORE DRILL, in two jobs on two runners.
  #
  # The point is the boundary between them. A producer and a consumer sharing a
  # directory proves nothing about whether evidence survives being uploaded and
  # fetched back, which is the only durability this repository actually has. So
  # `evidence-drill-produce` writes a bundle and uploads it, and
  # `evidence-drill-restore` starts from an empty runner, downloads it, deletes
  # the downloaded working copy, restores from the archive alone and compares
  # every byte with what was handed over.
  #
  # It is CHEAP AND BUILDLESS: no image build, no pull, no scan, no acceptance
  # dispatch, no release, no external storage, no credential beyond the
  # read-only workflow token. The input is a committed acceptance record and a
  # FIXTURE authorization record. The bundle it moves is NOT production evidence
  # and every verdict it writes repeats that sentence.
  #
  # `repo structure` — a REQUIRED check — consumes the verdict, so a drill that
  # fails, or that never produced a verdict, fails a required check rather than
  # going unnoticed. That is why `structure` needs these jobs and runs with
  # `if: always()`: a skipped job reports as success to branch protection, so a
  # gate that depended on skipping would be a gate that cannot fail.
  # ---------------------------------------------------------------------------
  evidence-drill-produce:
    name: evidence restore drill (produce)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # the artifacts API, to observe what was stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the drill bundle and index every uploaded byte
        id: drill-produce
        env:
          DRILL_EVIDENCE: docs/audits/acceptance-multiarch-2026-08-20/acceptance-evidence.json
          DRILL_OUT: drill/upload
        run: |
          set -uo pipefail
          bash scripts/ci/evidence-restore-drill.sh produce \
            --evidence "$DRILL_EVIDENCE" --out "$DRILL_OUT" || exit 1

      - name: Upload the drill bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-drill-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: drill/upload
          # policies/retention.yaml, class `staged-candidate`: 90 days, may
          # expire. The drill uses the real period so the thing being exercised
          # is the real contract.
          retention-days: 90
          if-no-files-found: error

      - name: Observe what the artifact authority actually stored
        id: drill-observe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: evidence-drill-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          mkdir -p drill
          gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            > drill/artifacts.json 2> drill/artifacts.err || true
          jq --arg n "$ARTIFACT_NAME" \
            '[.artifacts[]? | select(.name == $n)] | first // {}' \
            drill/artifacts.json > drill/observation.json 2>/dev/null \
            || echo '{}' > drill/observation.json
          cat drill/observation.json

      - name: Read the uploaded bundle back
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-drill-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: drill/readback

      # Emitted from the copy that came BACK, and verified BEFORE it is uploaded.
      # A receipt nobody checked is a claim, and a receipt about bytes nobody
      # fetched is a claim about a claim.
      - name: Emit and verify the storage receipt
        id: drill-receipt
        env:
          DRILL_RECORD: drill/upload/record.json
          DRILL_READBACK: drill/readback/bundle
          DRILL_OBSERVATION: drill/observation.json
          DRILL_RECEIPT: drill/receipt/storage-receipt.json
          DRILL_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          bash scripts/ci/evidence-restore-drill.sh receipt \
            --record "$DRILL_RECORD" --readback-dir "$DRILL_READBACK" \
            --observation "$DRILL_OBSERVATION" --out "$DRILL_RECEIPT" \
            --repository "$DRILL_REPOSITORY" || exit 1

      - name: Upload the drill receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-drill-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: drill/receipt
          retention-days: 90
          if-no-files-found: error

  evidence-drill-restore:
    name: evidence restore drill (restore)
    needs: [evidence-drill-produce]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # A FRESH RUNNER. Nothing from the producing job is on this filesystem
      # except what is downloaded below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the drill bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-drill-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: restored/bundle-artifact
      - name: Download the drill receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-drill-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: restored/receipt-artifact

      - name: Restore from the archive alone and compare every byte
        id: drill-restore
        env:
          DRILL_BUNDLE_ARTIFACT: restored/bundle-artifact
          DRILL_RECEIPT_ARTIFACT: restored/receipt-artifact
          DRILL_WORK: restored/work
          DRILL_VERDICT: restored/verdict/verdict.json
          DRILL_RUN_ID: ${{ github.run_id }}
          DRILL_COMMIT: ${{ github.sha }}
        run: |
          set -uo pipefail
          bash scripts/ci/evidence-restore-drill.sh restore \
            --bundle-artifact "$DRILL_BUNDLE_ARTIFACT" \
            --receipt-artifact "$DRILL_RECEIPT_ARTIFACT" \
            --work "$DRILL_WORK" --verdict "$DRILL_VERDICT" \
            --run-id "$DRILL_RUN_ID" --commit "$DRILL_COMMIT" || exit 1

      - name: Upload the drill verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-drill-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: restored/verdict
          retention-days: 90
          if-no-files-found: error

  structure:
    name: repo structure
    # `always()` so a failed drill produces a FAILED required check rather than
    # a skipped one. GitHub reports a skipped job as success to branch
    # protection; a gate that relied on skipping could not fail.
    if: always()
    needs: [evidence-drill-restore]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # to download the drill verdict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # FULL HISTORY, and it is load-bearing rather than convenient.
        #
        # tests/license/test_image_sbom_licence_gate.sh justifies reusing the
        # accepted production run's candidate identities by proving the image
        # DEFINITIONS and the MATRIX_IMAGES/MATRIX_COUNT identity set have not
        # moved since that revision. Both are `git diff` against a commit from
        # 2026-08-20, and a depth-1 checkout does not have it — the diff then
        # fails, prints nothing, and an emptiness check reads that as agreement.
        # That is a check that is literally green and substantively absent, which
        # is the class this repository keeps removing. The history is ~6 MB.
        with: { fetch-depth: 0 }
      - name: Check required layout
        run: bash scripts/check-structure.sh

      - name: Assert no Wolfi/Chainguard/apk in active code
        run: bash scripts/assert-no-wolfi.sh

      # Reference code is a distribution channel. examples/ and
      # docs/consuming-images.md told readers to digest-pin and fail closed while
      # using moving tags, `|| true`, and a build-time `config:cache` that bakes
      # the environment into a layer (#108/#109). Same rules as images/, applied
      # to the code we hand to consumers. Static and offline — the digest values
      # are re-resolved against the registry by examples/refresh-digests.sh.
      - name: Assert examples and consumer docs are pinned and fail closed
        run: bash scripts/assert-examples-pinned.sh

      - name: Assert all GitHub Actions are immutable SHA pins
        run: bash scripts/assert-pinned-actions.sh

      # Acceptance run 31340810647 died at "Set up job" on a well-formed 40-hex
      # pin that had never existed upstream. The syntax gate above proved
      # immutability; nothing proved EXISTENCE. GitHub has to resolve these
      # references before a job can start, so this moves that resolution failure
      # into a required validation step instead of discovering it minutes into a
      # privileged run. Deliberately NOT in tests/run-all.sh, which is offline.
      - name: Assert every pinned GitHub Action exists upstream
        # gh needs a token: unauthenticated calls to the commits API are
        # rejected/rate-limited, and the resolver fails CLOSED on any failure —
        # correct, but it made every pin read as unresolved. contents:read on the
        # default token is enough to read public commits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/assert-pinned-actions.sh --verify-upstream

      - name: Assert no fork PR can reach a privileged self-hosted runner
        run: bash scripts/assert-pr-workflows-github-hosted.sh

      - name: Assert required-release-checks match the real job names
        run: bash scripts/assert-required-checks.sh

      - name: Assert every Dependabot directory has its manifest
        run: bash scripts/assert-dependabot-manifests.sh
      - name: Assert no repository-wide cosign identity examples
        run: bash scripts/assert-no-identity-wildcards.sh

      # The offline control suite runs HERE, in an already-required job, rather
      # than as a new check that would need a branch-protection change to become
      # required. Until this was wired, "five checks green" said nothing about
      # the tests that found the last three release-blocking defects — the
      # producer harness, the checksum relocation case and the aggregator's
      # refusal paths were all passing locally and never run by CI.
      #
      # tests/run-all.sh is offline by construction: it discovers every
      # tests/**/test_*.sh, touches no network and no registry, and needs only
      # the read-only permissions this job already has.
      - name: Ensure offline test tooling
        run: |
          set -euo pipefail
          # ensure-release-tools.sh already provides everything this needs: gh,
          # jq and yq by pinned checksum, and python3 + PyYAML + jsonschema from
          # the distribution, re-verifying both imports before it returns.
          #
          # An unversioned `pip install jsonschema` used to follow this line. It
          # was redundant, and it put a mutable PyPI fetch inside a REQUIRED
          # governance check — a network dependency that can change under the
          # gate between runs is the wrong shape for the job that decides whether
          # the controls hold.
          sudo bash scripts/ci/ensure-release-tools.sh
          python3 - <<'PY'
          from importlib.metadata import version
          import jsonschema  # noqa: F401
          print("jsonschema", version("jsonschema"))
          PY

      - name: Refuse to run the suite with a degraded validator
        run: |
          set -euo pipefail
          python3 -c 'import jsonschema' \
            || { echo "REFUSE: jsonschema missing; the suite would silently weaken" >&2; exit 1; }

      - name: Run the offline control suite
        run: bash tests/run-all.sh

      # ---------------------------------------------------------------------
      # THE RELEASE-GATING SUBSYSTEMS, INVOKED DIRECTLY.
      #
      # Until now every one of these was gated ONLY transitively: run-all
      # discovers tests/**/test_*.sh, one of those tests happens to exercise
      # the subsystem, and the `repo structure` check happens to run run-all.
      # That is real coverage and nothing asserted it, so moving a test out of
      # tests/, renaming it away from test_*.sh, or dropping the run-all step
      # would have made the subsystem ungated with no signal at all.
      #
      # tests/governance/test_subsystem_ci_coverage.sh binds the transitive
      # chain. These steps make the direct one exist too, so losing either is a
      # red check rather than silence. Each is offline and buildless — the same
      # invocation scripts/macro-validate.sh makes locally.
      # ---------------------------------------------------------------------
      - name: Gate — evidence bundle contract
        run: bash scripts/release/generate-evidence-bundle.sh --self-test

      - name: Gate — evidence class contract
        run: |
          bash scripts/release/assert-evidence-class.sh --self-test
          bash scripts/release/assert-evidence-class.sh legacy \
            docs/audits/acceptance-multiarch-2026-08-20/acceptance-evidence.json

      - name: Gate — licence policy
        run: bash scripts/license/assert-license-policy.sh --self-test

      # The licence gate above reads IMAGE SBOMs. Material that lives in the
      # repository and in no image is invisible to it BY CONSTRUCTION — that is
      # how 832 lines copied verbatim from Moby v27.3.1 sat unattributed with no
      # control able to see them (#120). This step is the other half, and unlike
      # the line above it is NOT only a self-test: the second invocation gates
      # the real, committed inventory over the real tree.
      - name: Gate — repository material (the licence gate's repository-side blind spot)
        run: |
          bash scripts/license/assert-repository-material.sh --self-test
          bash scripts/license/assert-repository-material.sh \
            --inventory policies/repository-material.yaml

      # THE IMAGE HALF OF THE LICENCE GATE, EXECUTED — not grepped.
      #
      # The step above is `--self-test`: the gate testing itself. It gates no
      # image, and an assertion that merely grepped .github/workflows/ for
      # `scripts/license/` matched exactly that line and reported the gate as
      # wired. That is why the image-SBOM gap survived so long.
      #
      # The candidate images live in the release path, not here — CI is
      # buildless. So this step does the strongest thing a buildless job can:
      # it PARSES stage-and-authorize.yml's licence-authorization job, extracts
      # its gate step bodies, and EXECUTES them against the accepted production
      # run's real immutable child digests. Delete that job, weaken a flag or
      # stop consuming its result and this required check goes red.
      - name: Gate — image-SBOM licence authorization (both halves required)
        run: bash tests/license/test_image_sbom_licence_gate.sh

      # THE NOTICE AND SOURCE-OBLIGATION HALF, EXECUTED — not grepped.
      #
      # A licence verdict is not a notice. #120 also asks for "third-party
      # notices and ... corresponding license texts/source-offer obligations",
      # and a candidate can satisfy the licence gate while owing every one of
      # them. This step runs the producer over the accepted production run's
      # REAL committed evidence, executes stage-and-authorize.yml's own notice
      # and validator step bodies against it, and asserts every sabotage. Delete
      # the workflow step, weaken the --require-notice-bundle flag or stop
      # consuming the verdict and this required check goes red.
      - name: Gate — distribution notices and source obligations (#120)
        run: bash tests/license/test_notice_bundle.sh

      # THE STORAGE-RECEIPT CONTRACT, exercised before any storage exists.
      #
      # #241 found that evidence retention is 90 days against a policy demanding
      # 2555 and immutable storage, that nothing gates authorization on
      # retention, and that nothing detects expiry. Phase A is the consumer half:
      # a provider-neutral receipt schema and a verifier that refuses a receipt
      # whose retention is short, whose lock is governance rather than
      # compliance, whose versioning is off, whose readback did not happen, or
      # which belongs to another candidate. It runs here so the first REAL
      # receipt is verified by code somebody has already watched fail.
      - name: Gate — evidence storage receipt contract (#241 phase A)
        run: bash tests/release/test_storage_receipt.sh

      # Phase A above is the CONTRACT, proven against fixtures. This is the
      # ACTIVE PATH: it parses stage-and-authorize.yml, executes the receipt
      # step's own body, and refuses an 89-day artifact, a missing or malformed
      # authority observation, evidence that came back changed or incomplete,
      # and a receipt nobody consumed. A GitHub Actions artifact is the only
      # mechanism in scope — no bucket, no lock, no publication.
      - name: Gate — staged evidence storage path (#241 phase D)
        run: bash tests/release/test_staged_storage_path.sh

      - name: Gate — CRA control set
        run: bash scripts/cra/assert-cra-controls.sh

      - name: Gate — continuity mirror claims and offline drill
        run: |
          bash scripts/continuity-verify.sh --assert-mirror-claims
          bash scripts/continuity-verify.sh --self-test

      - name: Gate — reproducibility guarantees
        run: bash scripts/repro-guarantees.sh

      - name: Gate — governance content binding
        run: bash scripts/governance-content-binding.sh --self-test

      - name: Assert all CI container images are digest-pinned
        run: bash scripts/assert-pinned-containers.sh

      - name: Assert the production image matrix is complete (10/10, no legacy lines)
        run: bash scripts/assert-image-matrix.sh

      # The EXPERIMENTAL cohort must stay outside production, checked from the
      # PRODUCTION side. The plan (scripts/experimental/experimental-plan.sh)
      # proves the four PHP 8.5 definitions are reachable; this proves nothing in
      # MATRIX_IMAGES, the acceptance planner, contracts/, the workflows or the
      # 8.3/8.4 ledger selectors can reach back.
      - name: Assert experimental cohorts cannot enter production
        run: bash scripts/experimental/assert-experimental-isolation.sh

      - name: Assert only approved release environments are referenced
        run: bash scripts/assert-environment-names.sh

      - name: Assert every workflow reset block matches the canonical text (SC-02)
        run: bash scripts/ci/assert-canonical-reset-block.sh

      # Kubernetes admission policies (#124). Deliberately folded into this
      # ALREADY-REQUIRED job rather than added as a new required check: a new
      # required check means editing the branch ruleset, which is a control-plane
      # change. This gets the same enforcement without one.
      #
      # Regenerate and diff first — the policies are generated from
      # cosign-identities.yaml and runtime-contract.yaml, and a hand-edited
      # admission policy makes a CONSUMER enforce something this platform does not.
      - name: Assert the admission policies match their sources
        run: python3 scripts/generate-admission-policy.py --check

      # Then EVALUATE with the real Kyverno engine. The compliant fixture must be
      # ADMITTED before any rejection counts: a policy that denies everything
      # passes every negative test and is worthless.
      - name: Evaluate the admission policies against real fixtures
        run: bash scripts/test-admission-policy.sh

      # ----------------------------------------------------------------------
      # #241 — CONSUME the restore drill's verdict. The drill runs in two other
      # jobs; this is where a REQUIRED check reads their answer. `continue-on-
      # error` on the download so that an ABSENT verdict is refused by our own
      # named diagnostic instead of by the action, and so a drill that never
      # finished cannot pass as "nothing to check".
      # ----------------------------------------------------------------------
      - name: Fetch the restore-drill verdict
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-drill-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: drill-verdict

      - name: Consume the restore-drill verdict
        id: drill-consume
        env:
          DRILL_VERDICT: drill-verdict/verdict.json
          DRILL_RUN_ID: ${{ github.run_id }}
          DRILL_COMMIT: ${{ github.sha }}
        run: |
          set -uo pipefail
          bash scripts/ci/evidence-restore-drill.sh consume \
            --verdict "$DRILL_VERDICT" --run-id "$DRILL_RUN_ID" \
            --commit "$DRILL_COMMIT" || exit 1

  lint:
    name: lint (shell / yaml / md / dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: ./scripts

      - name: ShellCheck worker scripts (images/php-worker)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            -S warning \
            images/php-worker/*/worker-entrypoint \
            images/php-worker/*/worker-healthcheck

      - name: yamllint
        run: |
          docker run --rm -v "$PWD:/data" -w /data \
            pipelinecomponents/yamllint@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d \
            yamllint -c .yamllint.yaml --strict profiles policies .github

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !docs/audits/**
            #node_modules

      - name: Hadolint (all Dockerfiles)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work hadolint/hadolint:2.12.0-debian@sha256:27173fe25e062448490a32de410c08491c626a0bef360aa2ce5d5bdd9384b50d \
            sh -c 'find images examples -name Dockerfile -print0 | xargs -0 -I{} hadolint --config policies/hadolint.yaml {}'

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # Use the open-source gitleaks CLI image directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization repositories;
      # the CLI itself does not.
      - name: Gitleaks (CLI)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config policies/gitleaks.toml \
            --redact --no-banner --verbose

  sast:
    name: semgrep docker security
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.86.0@sha256:a9ea2d5621c29d815d90c2a3b2f9571da8972ef4ff855c9e4902681730240e35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job runs INSIDE the semgrep container (fresh bind-mounted workspace,
      # container user is root) — the host-runner ownership reset does not apply
      # here and its `_work` path assumption fails in a container. Instead mark
      # the checkout safe so semgrep's git file enumeration works.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Semgrep rules
        run: semgrep --error --config policies/semgrep/docker-security.yml .

  # build+smoke and its aggregation are NOT here any more. Building ten images
  # needs the self-hosted pool, and nothing a pull request can edit may reach
  # that pool. They run in trusted-validation.yml, whose definition comes from
  # master and which takes an explicitly reviewed commit SHA.

  compose-validate:
    name: validate compose profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate self-contained example stacks
        run: |
          set -euo pipefail
          for p in examples/*/compose.yml; do
            echo "validating $p"
            docker compose -f "$p" config --quiet
          done
      - name: Validate profile overlays merge cleanly (over CI base stub)
        run: |
          set -euo pipefail
          # Profiles are OVERLAY FRAGMENTS; layer each over the CI base stub so
          # `config` has real services to validate against. See profiles/_ci-base.yml.
          for p in profiles/compose.*.yml; do
            echo "validating overlay $p"
            docker compose -f profiles/_ci-base.yml -f "$p" config --quiet
          done
