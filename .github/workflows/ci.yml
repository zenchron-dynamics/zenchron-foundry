name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required layout
        run: bash scripts/check-structure.sh

      - name: Assert no Wolfi/Chainguard/apk in active code
        run: bash scripts/assert-no-wolfi.sh

  lint:
    name: lint (shell / yaml / md / dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./scripts

      - name: ShellCheck worker scripts (images/php-worker)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning \
            images/php-worker/*/worker-entrypoint \
            images/php-worker/*/worker-healthcheck

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yaml --strict profiles policies .github

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !docs/audits/**
            #node_modules

      - name: Hadolint (all Dockerfiles)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work hadolint/hadolint:latest-debian \
            sh -c 'find images examples -name Dockerfile -print0 | xargs -0 -I{} hadolint --config policies/hadolint.yaml {}'

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Use the open-source gitleaks CLI image directly. The gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization repositories;
      # the CLI itself does not.
      - name: Gitleaks (CLI)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source /repo --config policies/gitleaks.toml \
            --redact --no-banner --verbose

  sast:
    name: semgrep docker security
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep rules
        run: semgrep --error --config policies/semgrep/docker-security.yml .

  build-test:
    name: build representative images
    runs-on: ubuntu-latest
    needs: [structure, lint]
    strategy:
      fail-fast: false
      matrix:
        target:
          - { fam: php-fpm,  ver: "8.3" }
          - { fam: php-cli,  ver: "8.3" }
          - { fam: php-worker, ver: "8.3" }
          - { fam: nginx,    ver: "" }
          - { fam: caddy,    ver: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push, amd64)
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.target.fam }}${{ matrix.target.ver && format('/{0}', matrix.target.ver) || '' }}
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: zenchron/${{ matrix.target.fam }}:citest

  compose-validate:
    name: validate compose profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate self-contained example stacks
        run: |
          set -euo pipefail
          for p in examples/*/compose.yml; do
            echo "validating $p"
            docker compose -f "$p" config --quiet
          done
      - name: Validate profile overlays merge cleanly (over CI base stub)
        run: |
          set -euo pipefail
          # Profiles are OVERLAY FRAGMENTS; layer each over the CI base stub so
          # `config` has real services to validate against. See profiles/_ci-base.yml.
          for p in profiles/compose.*.yml; do
            echo "validating overlay $p"
            docker compose -f profiles/_ci-base.yml -f "$p" config --quiet
          done
