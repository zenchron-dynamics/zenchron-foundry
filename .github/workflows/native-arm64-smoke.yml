# =============================================================================
# .github/workflows/native-arm64-smoke.yml — #111 native arm64 runtime evidence.
# -----------------------------------------------------------------------------
# This workflow CANNOT RUN until a native arm64 runner is enrolled.
#
# WHAT IT CLAIMS, ACCURATELY. It was previously described as "the executable half
# of #111", which overstated it twice over. It declared a `families` input and
# NEVER READ IT: the job proved `uname -m`, emitted an evidence record, and
# smoked NO IMAGE. An architecture assertion is not runtime evidence, so the
# workflow could not have closed #111 even on a real arm64 host. Enrolling a
# runner is a NECESSARY step toward #111, not a sufficient one.
#
# It now actually runs the runtime smoke over the selected arm64 images, and the
# evidence records which families were smoked and the verdict.
#
# It refuses loudly rather than silently degrading:
#   * if it lands on a non-aarch64 host it FAILS — it will not emulate;
#   * `uname -m` is proven and recorded;
#   * an unknown family REFUSES rather than smoking nothing and reporting green;
#   * evidence carries execution_mode=native, checked by
#     scripts/release/assert-native-arch-evidence.sh.
#
# QEMU evidence from stage-and-authorize is sufficient for #139 and can never
# satisfy this workflow's contract.
# =============================================================================
name: native arm64 smoke (#111)

on:
  workflow_dispatch:
    inputs:
      families:
        # Families, not image labels: scripts/smoke-all.sh filters by family via
        # SMOKE_FAMILIES. The input previously said "image labels" and was never
        # read at all, so it described a filter that did not exist.
        description: "Image families to smoke (space- or comma-separated), e.g. 'php-fpm nginx'; empty means the whole matrix"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: native-arm64-smoke
  cancel-in-progress: false

jobs:
  guard:
    name: refuse any ref but the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 1}
      - name: Refuse a non-default ref
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = "refs/heads/master" ] \
            || { echo "REFUSE: native smoke runs only on master, got ${GITHUB_REF}"; exit 1; }

  native-smoke:
    name: native arm64 smoke
    needs: guard
    # The label contract from policies/native-arch-requirements.yaml. With no
    # such runner enrolled this job stays queued and the run is cancelled by the
    # operator — it never falls back to an X64 host.
    runs-on: [self-hosted, Linux, ARM64, zenchron]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 1}

      # THE gate. A mislabelled X64 runner would otherwise produce "native"
      # evidence that is emulated or simply wrong.
      - name: Prove the host is really aarch64
        id: arch
        run: |
          set -euo pipefail
          m="$(uname -m)"
          echo "uname -m = ${m}"
          case "$m" in
            aarch64|arm64) : ;;
            *) echo "REFUSE: native arm64 smoke landed on a ${m} host. This job must"
               echo "        never run emulated — that is exactly the evidence #111"
               echo "        exists to distinguish."
               exit 1 ;;
          esac
          {
            echo "host_arch=arm64"
            echo "execution_mode=native"
            echo "uname_m=${m}"
          } >> "$GITHUB_OUTPUT"

      # THE INPUT, ACTUALLY READ. An unknown family REFUSES here rather than
      # reaching smoke-all.sh and quietly matching nothing. smoke-all.sh does
      # exit non-zero on zero images tested, but a typo should be named at the
      # boundary where it was made, not diagnosed from an empty matrix.
      - name: Resolve the requested families
        id: fams
        env:
          REQUESTED: ${{ inputs.families }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          known="$(matrix_families | tr '\n' ' ')"
          want="$(printf '%s' "$REQUESTED" | tr ',' ' ' | tr -s ' ' | sed 's/^ //; s/ $//')"
          if [ -z "$want" ]; then
            want="$(printf '%s' "$known" | sed 's/ $//')"
            echo "no families requested -> full matrix: $want"
          else
            for f in $want; do
              case " $known " in
                *" $f "*) : ;;
                *) echo "REFUSE: '$f' is not an image family. Known: $known"; exit 1 ;;
              esac
            done
            echo "requested families: $want"
          fi
          echo "families=$want" >> "$GITHUB_OUTPUT"

      - name: Run the native arm64 runtime smoke
        id: smoke
        env:
          SMOKE_FAMILIES: ${{ steps.fams.outputs.families }}
        run: |
          set -euo pipefail
          bash scripts/smoke-all.sh
          echo "verdict=PASS" >> "$GITHUB_OUTPUT"

      - name: Record the native runtime evidence
        env:
          HOST_ARCH: ${{ steps.arch.outputs.host_arch }}
          EXEC_MODE: ${{ steps.arch.outputs.execution_mode }}
          UNAME_M: ${{ steps.arch.outputs.uname_m }}
          SMOKED: ${{ steps.fams.outputs.families }}
          VERDICT: ${{ steps.smoke.outputs.verdict }}
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          jq -n --arg h "$HOST_ARCH" --arg e "$EXEC_MODE" --arg u "$UNAME_M" \
                --arg r "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
                --arg runner "$RUNNER_NAME" \
                --arg smoked "$SMOKED" --arg verdict "$VERDICT" '{
            record_type:"native-arch-runtime-evidence",
            platform:"linux/arm64", host_architecture:$h, execution_mode:$e,
            uname_m:$u, source_revision:$r, workflow_run_id:($run|tonumber),
            runner_name:$runner,
            smoked_families:($smoked|split(" ")),
            runtime_smoke:$verdict
          }' > native-evidence/native-arm64.json
          jq . native-evidence/native-arm64.json

      - name: The evidence must satisfy the native contract
        run: |
          set -euo pipefail
          # child_key is required by the gate's shape; add it for the standalone record.
          jq '. + {child_key:"native-smoke/linux/arm64"}' native-evidence/native-arm64.json \
            > native-evidence/tmp && mv native-evidence/tmp native-evidence/native-arm64.json
          bash scripts/release/assert-native-arch-evidence.sh native-evidence --require-native linux/arm64

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-arm64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/
          if-no-files-found: error
