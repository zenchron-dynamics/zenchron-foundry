name: promote-stable

# ---------------------------------------------------------------------------
# DISABLED ENTRY POINT — this workflow no longer promotes anything.
#
# It used to retag an exact RC digest onto the canonical stable PRODUCTION tags.
# That is a production write, and it has been DELETED from executable code for
# the same reason as the rest of the publication path: the repository token
# cannot write production packages (docs/audits/package-acl-2026-08-03/, run
# 30837370041), and a promoter left behind that denial fails with a permission
# error whose obvious "fix" reopens the bypass.
#
# Promotion also depended on a signed immutable RC manifest that does not exist
# yet. Restoring this path before that manifest exists would promote a digest no
# sealed record vouches for.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "(disabled) Release version to promote, vYYYY.MM.DD[.N]"
        required: false
      rc:
        description: "(disabled) RC identifier to promote from, e.g. rc1"
        required: false

permissions:
  contents: read

jobs:
  refuse:
    name: stable promotion is disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          REFUSE: public publication is disabled pending immutable RC manifest
          sealing and protected exposure (#139).

          Promotion retagged an RC digest onto canonical stable tags in the
          production packages. That path was removed from executable code.

          It cannot return before the immutable signed RC manifest exists: there
          would be no sealed record vouching for the digest being promoted. The
          current path stops at authorization:

            stage-and-authorize.yml -> post-build authorization record
            (authorization_scope: immutable-rc-manifest-input,
             public_exposure_authorized: false)

          Boundary evidence:
            docs/audits/package-acl-2026-08-03/  (run 30837370041, verdict PASS)
          MSG
          exit 1
