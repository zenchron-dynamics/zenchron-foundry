name: promote-stable

# Exact RC -> stable promotion (Sprint 6 / rule #14: NO rebuild during promotion).
#
# This workflow performs ZERO `docker build`. It copies the *exact*, already-
# signed RC image digests onto the canonical stable aliases via registry-side
# retag (`docker buildx imagetools create`, already pinned via setup-buildx).
# Cosign signatures/attestations are attached to the DIGEST, so they travel with
# the promotion untouched — no re-signing.
#
# Order of operations for a release (see docs/release-process.md):
#   1. publish-rc.yml   -> builds + signs immutable RC images (rc<N>)
#   2. create the stable v* tag on the EXACT revision the RC was built from
#   3. promote-stable.yml (this), dispatched FROM refs/tags/<version>
#                       -> promotes those exact digests to *-prod
#   4. release.yml, dispatched FROM the same tag -> seals the GitHub Release
#                       over the already-promoted images (also no build).
#
# This workflow MUST be dispatched from the stable tag: `foundry-production`
# admits stable tags only, and the tag ref is what binds promotion to the commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to publish, e.g. v2026.07.02 — MUST equal the tag this runs from"
        required: true
      rc:
        description: "Validated RC identifier to promote, e.g. rc1 (rc<N>)"
        required: true
      rc_manifest_run_id:
        description: "publish-rc run ID whose signed RC manifest is the promotion source of truth"
        required: true
      expected_revision:
        description: "Full 40-hex revision being promoted (must equal the RC manifest revision)"
        required: true
      confirmation:
        description: "Typed confirmation: PROMOTE-<version>-<expected_revision>"
        required: true
      risk_acceptance_confirmation:
        description: "Solo-maintainer risk acceptance (type: ACCEPT-RISK)"
        required: true

permissions:
  contents: read

concurrency:
  # Never promote two versions at once; never cancel a promotion mid-flight.
  group: promote-stable-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics

jobs:
  # Approval + input validation. The `foundry-production` GitHub Environment
  # carries the production reviewers — promotion cannot proceed without approval.
  gate:
    runs-on: [self-hosted, linux, x64, zenchron]
    environment: foundry-production
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Ensure release tooling (gh + jq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - name: Preflight — release environments must be protected + reviewed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ENV_CHECK_TOKEN || secrets.GITHUB_TOKEN }}
          # Free-tier: environment reviewers are billing-gated. Explicit acceptance
          # (see docs/audits/free-tier-governance-accepted-risk.md). Remove on Team/public.
          ALLOW_FREE_TIER_NO_REVIEWERS: "1"
        run: bash scripts/check-release-environments.sh --release-ready
      - name: Validate inputs + ref policy + typed production confirmation
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          RISK: ${{ github.event.inputs.risk_acceptance_confirmation }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          require_calver "$VERSION"
          require_rc "$RC"
          require_hex40 "$EXPECTED_REVISION"
          # Must be dispatched FROM the stable tag: `foundry-production` admits
          # stable tags only, and the tag is what binds promotion to the commit.
          bash scripts/check-promotion-ref.sh "$REF" "$VERSION"
          [ "$SHA" = "$EXPECTED_REVISION" ] \
            || die "tag commit $SHA != expected_revision $EXPECTED_REVISION"
          [ "$CONFIRMATION" = "PROMOTE-${VERSION}-${EXPECTED_REVISION}" ] \
            || die "confirmation must be PROMOTE-<version>-<expected_revision>"
          [ "$RISK" = "ACCEPT-RISK" ] || die "risk_acceptance_confirmation must be ACCEPT-RISK"
          echo "OK: promoting $RC -> $VERSION @ $EXPECTED_REVISION from $REF (confirmed)"

  promote:
    needs: gate
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      packages: write          # push the canonical stable tags (retag only)
      actions: read            # gh run download: fetch the signed RC manifest artifact
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Ensure release tooling (gh + jq + yq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch + verify the signed RC manifest (promotion source of truth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_ROLE: rc-publisher
          RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # Verifies run origin (this repo, publish-rc.yml, success, head_sha ==
          # the tag commit), artifact completeness, checksum, cosign signature,
          # schema/policy, and that the manifest names exactly this version+rc+revision.
          bash scripts/fetch-rc-manifest.sh "$RUN_ID" "$VERSION" "$RC" release-artifacts

      - name: Promote exact RC digests to canonical stable aliases (two-phase + rollback)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: bash scripts/promote-stable.sh "$VERSION" "$RC" --manifest release-artifacts/release-manifest.yaml

      # WF-20: machine-readable promotion results, DERIVED from the promotion
      # artifacts the run just wrote (promotion manifest, journal, rollback
      # manifest) — never asserted by hand.
      - name: Emit promotion-results.json (derived from the promotion artifacts)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-aliases.sh
          art=release-artifacts
          pm="$art/promotion-${VERSION}.yaml"
          rb="$art/rollback-${VERSION}.yaml"
          jr="$art/promotion-journal-${VERSION}.txt"
          aliases="$(yq '.aliases | length' "$pm")"
          verified="$(yq '[.aliases[] | select(.verified == true)] | length' "$pm")"
          # Canonical-last proof: for every matrix image the LAST journal line
          # touching that image must be its canonical prod alias — the two-phase
          # promotion mutates the human-facing alias only after the rest hold.
          order_ok=true
          for t in $MATRIX_IMAGES; do
            fam="${t%:*}"; sel="${t#*:}"
            case "$sel" in
              prod) canon="$NS/$fam:prod"; last="$(grep -E "/${fam}:prod(-|$)" "$jr" | tail -1)" ;;
              *)    canon="$NS/$fam:${sel}-prod"; last="$(grep -F "$NS/$fam:$sel-" "$jr" | tail -1)" ;;
            esac
            [ "$last" = "$canon" ] || { echo "journal order violation for $t: last='$last' want='$canon'"; order_ok=false; }
          done
          [ "$order_ok" = true ] || { echo "REFUSE: canonical-last order not proven by the journal"; exit 1; }
          rb_ck="$(sha256sum "$rb" | awk '{print $1}')"
          jq -n --arg version "$VERSION" --arg rc "$RC" \
            --argjson aliases "$aliases" --argjson verified "$verified" \
            --argjson canonical_last "$order_ok" --arg rollback_ck "$rb_ck" \
            '{version: $version, rc: $rc,
              aliases_promoted: $aliases, aliases_verified: $verified,
              canonical_last_proven: $canonical_last,
              rollback_manifest_sha256: $rollback_ck}' \
            > "$art/promotion-results.json"
          cat "$art/promotion-results.json"

      - name: Upload promotion evidence (rollback + journal + promotion manifest + results)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-evidence-${{ github.event.inputs.version }}
          path: |
            release-artifacts/rollback-*.yaml*
            release-artifacts/promotion-journal-*.txt
            release-artifacts/promotion-*.yaml*
            release-artifacts/promotion-results.json
            release-artifacts/ROLLBACK-INCIDENT.txt
          # WF-10: fail loud if the evidence set is empty — a promotion run that
          # produced no rollback/journal evidence must never look green.
          if-no-files-found: error
