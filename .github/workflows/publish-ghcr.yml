name: publish-ghcr

# Reusable publisher. NOT directly dispatchable — the only entry points are:
#   * release.yml        -> stable *-prod tags (rc == ""), gated on a v* tag
#                           reachable from master + the `release` environment.
#   * publish-rc.yml     -> immutable RC tags only (rc != ""), never *-prod.
# Removing workflow_dispatch closes the "empty rc falls through to stable"
# hole: a stable publish can only happen via release.yml's gated path.
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux/amd64"
      rc:
        description: "Release-candidate label (e.g. rc1). When set, publishes ONLY immutable RC tags — NEVER *-prod."
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write          # keyless cosign via OIDC

concurrency:
  # One publish at a time per channel; never cancel a publish mid-flight.
  group: publish-ghcr-${{ inputs.rc != '' && format('rc-{0}', inputs.rc) || 'stable' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics
  # Always pushes (OCI exporter), so multi-arch is safe here. Override via the
  # platforms input to publish linux/amd64,linux/arm64.
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  # Gate: do not publish unless CI-equivalent checks pass on this ref, and the
  # request is internally consistent (stable path requires a valid v* tag).
  preflight:
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene)
        run: |
          set -euo pipefail
          # Self-hosted hygiene: reclaim the checkout so actions/checkout can clean it.
          # Hardened (no `|| true`): refuse to chown anything outside the runner workspace,
          # and fail loud if the tree is not ours and we cannot fix it.
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          if [ "$(stat -c %u "$ws" 2>/dev/null || echo -1)" != "$(id -u)" ]; then
            if [ "$(id -u)" -eq 0 ]; then
              chown -R "$(id -u):$(id -g)" "$ws"                 # root: no sudo needed
            elif command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$(id -u):$(id -g)" "$ws"
            else
              echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1
            fi
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: bash scripts/check-structure.sh
      - run: bash scripts/assert-no-wolfi.sh
      - run: bash scripts/assert-pinned-actions.sh
      - run: bash scripts/assert-image-matrix.sh
      - name: Verify base-image digests (multi-arch resolves)
        run: bash scripts/verify-base-images.sh
      - name: Stable path requires a valid release tag
        if: ${{ inputs.rc == '' }}
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Defense in depth: release.yml already gates, but a stable publish
          # (rc == "") must be triggered by an annotated v* tag in the approved
          # format. Anything else is a misuse and must fail before any push.
          case "$REF" in
            refs/tags/*) : ;;
            *) echo "REFUSE: stable publish requires a tag ref, got '$REF'"; exit 1 ;;
          esac
          echo "$REF_NAME" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' \
            || { echo "REFUSE: tag '$REF_NAME' is not a valid release version (vYYYY.MM.DD[.N])"; exit 1; }
      - name: RC path requires a non-empty RC identifier
        if: ${{ inputs.rc != '' }}
        env:
          RC: ${{ inputs.rc }}
        run: |
          set -euo pipefail
          echo "$RC" | grep -Eq '^rc[0-9]+$' \
            || { echo "REFUSE: rc identifier '$RC' must match rc<N>"; exit 1; }

  publish:
    needs: preflight
    runs-on: [self-hosted, linux, x64, zenchron]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene)
        run: |
          set -euo pipefail
          # Self-hosted hygiene: reclaim the checkout so actions/checkout can clean it.
          # Hardened (no `|| true`): refuse to chown anything outside the runner workspace,
          # and fail loud if the tree is not ours and we cannot fix it.
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          if [ "$(stat -c %u "$ws" 2>/dev/null || echo -1)" != "$(id -u)" ]; then
            if [ "$(id -u)" -eq 0 ]; then
              chown -R "$(id -u):$(id -g)" "$ws"                 # root: no sudo needed
            elif command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$(id -u):$(id -g)" "$ws"
            else
              echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1
            fi
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        env:
          RC: ${{ inputs.rc || '' }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}"
          if [ "${{ matrix.ver }}" = "prod" ]; then suffix="prod"; else suffix="${{ matrix.ver }}-prod"; fi
          if [ -n "${RC}" ]; then
            # RC mode: publish ONLY immutable, clearly non-production RC tags.
            # PHP families -> <ver>-debian-<rc> ; edge images -> prod-<rc>.
            case "${{ matrix.fam }}" in
              php-*) primary="${base}:${{ matrix.ver }}-debian-${RC}" ;;
              *)     primary="${base}:prod-${RC}" ;;
            esac
            tags="${primary},${primary}.build.${{ github.run_number }}"
          else
            rel="${GITHUB_REF_NAME}"   # e.g. v2026.05.30
            tags="${base}:${suffix},${base}:${suffix}-${rel#v},${base}:${suffix}-build.${{ github.run_number }}"
            # Provider-explicit Debian alias for the PHP families (ADR-0001 §17),
            # e.g. php-cli:8.4-debian — lets consumers pin the Debian variant.
            case "${{ matrix.fam }}" in php-*) tags="${tags},${base}:${{ matrix.ver }}-debian" ;; esac
            primary="${base}:${suffix}"
          fi
          {
            echo "tags=${tags}"
            echo "primary=${primary}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.ver }}-prod
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"

      - name: Syft SBOM + cosign attest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          syft "${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"

      - name: Summary
        run: |
          echo "Published & signed ${{ steps.meta.outputs.primary }} @ ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
