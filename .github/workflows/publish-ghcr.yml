name: publish-ghcr

# Reusable publisher. NOT directly dispatchable — the only entry points are:
#   * release.yml        -> stable *-prod tags (rc == ""), gated on a v* tag
#                           reachable from master + the `foundry-production` environment.
#   * publish-rc.yml     -> immutable RC tags only (rc != ""), never *-prod.
# Removing workflow_dispatch closes the "empty rc falls through to stable"
# hole: a stable publish can only happen via release.yml's gated path.
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux/amd64"
      rc:
        description: "Release-candidate label (e.g. rc1). When set, publishes ONLY immutable RC tags — NEVER *-prod."
        type: string
        default: ""
      version:
        description: "Release version (vYYYY.MM.DD[.N]) this RC targets. Required in RC mode; embedded in the immutable tag."
        type: string
        default: ""
      expected_revision:
        description: "Full 40-hex source revision. In RC mode MUST equal github.sha; embedded (short) in the immutable tag."
        type: string
        default: ""

# No security-events: nothing here uploads SARIF (WF-14); scanning lives in
# scan-images.yml. The publish job inherits these; preflight narrows further.
permissions:
  contents: read
  packages: write
  id-token: write          # keyless cosign via OIDC

concurrency:
  # One publish at a time per channel; never cancel a publish mid-flight.
  group: publish-ghcr-${{ inputs.rc != '' && format('rc-{0}', inputs.rc) || 'stable' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics
  # Always pushes (OCI exporter), so multi-arch is safe here. Override via the
  # platforms input to publish linux/amd64,linux/arm64.
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  # Gate: do not publish unless CI-equivalent checks pass on this ref, and the
  # request is internally consistent (stable path requires a valid v* tag).
  preflight:
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read         # read-only gate: no publish/sign happens here (WF-15)
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-structure.sh
      - run: bash scripts/assert-no-wolfi.sh
      - run: bash scripts/assert-pinned-actions.sh
      - run: bash scripts/assert-image-matrix.sh
      - name: Verify base-image digests (multi-arch resolves)
        run: bash scripts/verify-base-images.sh
      - name: Every published platform must be reconciled
        # reconcile-vulnerabilities.sh runs per architecture and takes a
        # mandatory --arch, so every acceptance record names the architectures
        # it was actually evidenced against. Nothing connected that to
        # publication: a linux/amd64,linux/arm64 push would ship arm64 layers
        # judged against a ledger that had only ever seen amd64. This refuses
        # any platform no acceptance record covers, BEFORE the first push.
        env:
          PLAT: ${{ env.PLATFORMS }}
          # The facts THIS publish supplies. The evidence's own claims are
          # compared against them; a document that merely parses is not evidence
          # about this publish.
          EXPECTED_REVISION: ${{ inputs.expected_revision || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # THIS STEP INTENTIONALLY REFUSES EVERY PUBLISH TODAY.
          #
          # The gate requires the child manifest digests and the Trivy database
          # this publish scanned with. Preflight runs BEFORE the build, so
          # neither exists yet and neither can be supplied here.
          #
          # Making those comparisons optional when the caller omits them was the
          # earlier design, and it was fail-open: the binding disappeared exactly
          # when nobody wired it. Refusing is the correct interim state.
          #
          # The fix is to move final authorisation AFTER the builds — capture the
          # real child digests and DB metadata, then call this gate before the
          # manifest is exposed — and to consume the RC manifest on the promotion
          # path. Tracked in #139 with the arm64 evidence run.
          bash scripts/assert-publish-platforms-reconciled.sh "$PLAT"
      - name: Stable path requires a valid release tag
        if: ${{ inputs.rc == '' }}
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Defense in depth: release.yml already gates, but a stable publish
          # (rc == "") must be triggered by an annotated v* tag in the approved
          # format. Anything else is a misuse and must fail before any push.
          case "$REF" in
            refs/tags/*) : ;;
            *) echo "REFUSE: stable publish requires a tag ref, got '$REF'"; exit 1 ;;
          esac
          echo "$REF_NAME" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' \
            || { echo "REFUSE: tag '$REF_NAME' is not a valid release version (vYYYY.MM.DD[.N])"; exit 1; }
      - name: RC path requires version + rc + revision bound to this commit
        if: ${{ inputs.rc != '' }}
        env:
          RC: ${{ inputs.rc }}
          VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          require_rc "$RC"
          require_calver "$VERSION"
          require_hex40 "$EXPECTED_REVISION"
          [ "$EXPECTED_REVISION" = "$GITHUB_SHA" ] \
            || die "expected_revision ($EXPECTED_REVISION) != github.sha ($GITHUB_SHA)"

  publish:
    needs: preflight
    runs-on: [self-hosted, linux, x64, zenchron]
    strategy:
      # One image's transient infra flake (buildkit graceful_stop, cosign GHCR
      # token blip) must NOT cancel its siblings — let each publish independently
      # so `gh run rerun --failed` only re-attempts the ones that actually failed.
      fail-fast: false
      # Serialized, matching ci.yml / scan-images.yml / verify-rc.yml. The host is
      # 2 vCPU / 4 GB: two concurrent multi-arch builds split one core each under
      # QEMU arm64 emulation (no throughput gained) and risk an OOM with buildkit
      # + QEMU + Trivy resident. This was the only heavy matrix without the guard.
      # (Note: ci.yml's note blames disk; RAM/CPU is the real ceiling. Real fix is
      # a bigger runner, or a native arm64 runner to drop the emulation.)
      max-parallel: 1
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # WF-17: pin syft so SBOM output cannot drift between runs of the same
          # pinned action SHA (v1.42.3 is the version that SHA ships by default).
          syft-version: v1.42.3

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        env:
          RC: ${{ inputs.rc || '' }}
          VERSION: ${{ inputs.version || '' }}
          EXPECTED_REVISION: ${{ inputs.expected_revision || '' }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-aliases.sh
          base="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}"
          if [ "${{ matrix.ver }}" = "prod" ]; then suffix="prod"; else suffix="${{ matrix.ver }}-prod"; fi
          if [ -n "${RC}" ]; then
            # RC mode: the AUTHORITATIVE tag is immutable and SHA-bound —
            #   php: <ver>-<version>-<rc>-sha-<short>  edge: <version>-<rc>-sha-<short>
            # A convenience alias (<ver>-debian-<rc> / prod-<rc>) is published too
            # but is NEVER read by promotion.
            imm_suffix="$(immutable_rc_suffix "${{ matrix.ver }}" "$VERSION" "$RC" "$EXPECTED_REVISION")"
            conv_suffix="$(convenience_rc_suffix "${{ matrix.ver }}" "$RC")"
            immutable="${base}:${imm_suffix}"
            primary="$immutable"
            tags="${immutable},${base}:${conv_suffix}"
            echo "immutable=${immutable}" >> "$GITHUB_OUTPUT"
            version_label="${imm_suffix}"
          else
            rel="${GITHUB_REF_NAME}"   # e.g. v2026.05.30
            tags="${base}:${suffix},${base}:${suffix}-${rel#v},${base}:${suffix}-build.${{ github.run_number }}"
            # Provider-explicit Debian alias for the PHP families (ADR-0001 §17),
            # e.g. php-cli:8.4-debian — lets consumers pin the Debian variant.
            case "${{ matrix.fam }}" in php-*) tags="${tags},${base}:${{ matrix.ver }}-debian" ;; esac
            primary="${base}:${suffix}"
            version_label="${suffix}"
          fi
          {
            echo "tags=${tags}"
            echo "primary=${primary}"
            # OCI version label, derived from the SAME canonical selector the tags
            # use. It was hardcoded as "${{ matrix.ver }}-prod", which produced
            # "prod-prod" for the edge images (nginx/caddy declare ver: prod) —
            # metadata that contradicted their own Dockerfiles (#126).
            echo "version_label=${version_label}"
          } >> "$GITHUB_OUTPUT"

      - name: Immutability probe (RC only — never overwrite a bound tag)
        if: ${{ inputs.rc != '' }}
        env:
          IMMUTABLE: ${{ steps.meta.outputs.immutable }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-probe.sh
          set +e
          out="$(probe_immutable_tag "$IMMUTABLE" "$EXPECTED_REVISION")"; code=$?
          set -e
          echo "$out"
          case "$code" in
            0)  echo "immutable tag absent -> publish" ;;
            10) echo "immutable tag already present with this revision -> idempotent resume" ;;
            20) echo "REFUSE: immutable tag conflict (present with different content)"; exit 1 ;;
            *)  echo "REFUSE: registry lookup failed -> fail closed"; exit 1 ;;
          esac

      - name: Build & push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # cosign pulls the image to sign it; GHCR occasionally returns a
          # transient token 401. Retry a few times before failing the job.
          ref="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"
          for i in 1 2 3 4 5; do
            cosign sign --yes "$ref" && exit 0
            echo "cosign sign attempt $i failed; retrying in $((i*10))s" >&2; sleep "$((i*10))"
          done
          echo "cosign sign failed after retries" >&2; exit 1

      - name: Syft SBOM + cosign attest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"
          syft "$ref" -o spdx-json=sbom.spdx.json
          for i in 1 2 3 4 5; do
            cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$ref" && exit 0
            echo "cosign attest (sbom) attempt $i failed; retrying in $((i*10))s" >&2; sleep "$((i*10))"
          done
          echo "cosign attest (sbom) failed after retries" >&2; exit 1

      - name: SLSA provenance attest (source-revision binding)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # buildx provenance:mode=max attaches UNSIGNED buildkit provenance to the
          # index; the release identity verifier requires a COSIGN-signed
          # slsaprovenance attestation and reads the source repo+commit from its
          # predicate (.materials[].uri / .digest.sha1). Emit that predicate and
          # cosign-attest it, keylessly signed by this workflow's OIDC identity.
          ref="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg gref "$GITHUB_REF" --arg sha "$GITHUB_SHA" '{
            buildType: "https://github.com/\($repo)/publish-ghcr",
            builder: { id: "https://github.com/\($repo)/.github/workflows/publish-ghcr.yml@\($gref)" },
            invocation: { configSource: { uri: "git+https://github.com/\($repo)@\($gref)", digest: { sha1: $sha } } },
            materials: [ { uri: "git+https://github.com/\($repo)", digest: { sha1: $sha } } ]
          }' > provenance.json
          for i in 1 2 3 4 5; do
            cosign attest --yes --predicate provenance.json --type slsaprovenance "$ref" && exit 0
            echo "cosign attest (provenance) attempt $i failed; retrying in $((i*10))s" >&2; sleep "$((i*10))"
          done
          echo "cosign attest (provenance) failed after retries" >&2; exit 1

      # RA-08: per-image publish results. Every step in this job runs only when
      # all previous steps succeeded (nothing above uses `if: always()` or
      # `continue-on-error`), so REACHING this step proves build+push, cosign
      # sign, SBOM attest and provenance attest all succeeded — the booleans
      # below are derived from that step-success chain, not asserted by hand.
      - name: Emit publish-results.json (success-path derived)
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          is_digest "$DIGEST" || die "build digest '$DIGEST' is not sha256:<64-hex>"
          jq -n --arg image "${FAM}-${VER}" --arg digest "$DIGEST" \
            '{image: $image, digest: $digest,
              signed: true, sbom_attested: true, provenance_attested: true}' \
            > publish-results.json
          cat publish-results.json

      - name: Upload publish-results.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-results-${{ matrix.fam }}-${{ matrix.ver }}
          path: publish-results.json
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Published & signed ${{ steps.meta.outputs.primary }} @ ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

