name: publish-rc

# Release-candidate publisher. Publishes ONLY immutable, clearly non-production
# RC tags (php-*:<ver>-debian-<rc>, edges :prod-<rc>) via the reusable
# publish-ghcr workflow. It CANNOT publish canonical *-prod tags: the rc input
# is required and validated, and publish-ghcr only emits *-prod when rc == "".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version this RC targets, vYYYY.MM.DD[.N] (required)"
        required: true
      rc:
        description: "RC identifier, e.g. rc1 (required; must match rc[1-9][0-9]*)"
        required: true
      expected_revision:
        description: "Full 40-hex source revision; MUST equal the dispatched commit (required)"
        required: true
      confirmation:
        description: "Typed confirmation: PUBLISH-<version>-<rc>-<expected_revision> (required)"
        required: true
      platforms:
        description: "Target platforms"
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read

concurrency:
  # Org-wide cosign slot, shared verbatim with scheduled-rebuild.yml (and the
  # same pair in php-app-template). The self-hosted runners share one $HOME, so
  # two signing workflows at once race each other's ~/.cosign install (one job's
  # `rm` deletes the binary the other just `mv`d into place). A single literal
  # group makes them mutually exclusive. Previously keyed per version+rc+revision;
  # that allowed distinct publishes to overlap, which is exactly the collision.
  # cancel-in-progress stays false: a release always finishes, a rebuild waits.
  group: org-cosign-publish
  cancel-in-progress: false

jobs:
  # Approval + validation gate. The `foundry-rc` GitHub Environment carries the
  # required reviewers; an empty/invalid rc id can never reach the publisher.
  gate:
    runs-on: [self-hosted, linux, x64, zenchron]
    environment: foundry-rc
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # full history: the ancestry check needs origin/master
      - name: Ensure release tooling (gh + jq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - name: Preflight — release environments must be protected + reviewed
        env:
          # Needs a token that can READ environment protection rules. Owner must
          # provide RELEASE_ENV_CHECK_TOKEN (fine-grained PAT: Environments read +
          # Administration read); GITHUB_TOKEN cannot read reviewers, so without
          # the PAT this fails closed — which is the intended safety behaviour.
          GH_TOKEN: ${{ secrets.RELEASE_ENV_CHECK_TOKEN || secrets.GITHUB_TOKEN }}
          # Org is GitHub Free + repo private → environment required reviewers are
          # billing-gated (cannot be attached). Accept that gap explicitly and lean
          # on the deployment branch/tag policies + workflow guards. Remove this once
          # the org is on Team (or the repo is public) and real reviewers are set.
          ALLOW_FREE_TIER_NO_REVIEWERS: "1"
        run: bash scripts/check-release-environments.sh --release-ready
      - name: Validate RC publication (version + rc + revision + confirmation + ancestry)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/validate-release-version.sh

  images:
    needs: gate
    # Environment binding lives on the gate job; needs-chain enforced (WF-19 accepted).
    # Caps the reusable publish-ghcr workflow — grants exactly what it declares:
    # packages:write (push) + id-token:write (keyless cosign) + contents:read.
    # No security-events: nothing in the publish path uploads SARIF (WF-15).
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-ghcr.yml
    secrets: inherit
    with:
      rc: ${{ github.event.inputs.rc }}
      version: ${{ github.event.inputs.version }}
      expected_revision: ${{ github.event.inputs.expected_revision }}
      platforms: ${{ github.event.inputs.platforms }}

  # Post-publication: verify each immutable RC image's identity, then build the
  # authoritative signed RC manifest — the ONLY input stable promotion consumes.
  # Environment binding lives on the gate job; needs-chain enforced (WF-19 accepted).
  manifest:
    needs: images
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      packages: read
      id-token: write          # cosign sign-blob (keyless) for the manifest
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure release tooling (gh + jq + yq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - name: Verify each immutable RC image identity (rc-publisher)
        env:
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_ROLE: rc-publisher
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-aliases.sh
          for t in $MATRIX_IMAGES; do
            fam="${t%:*}"; sel="${t#*:}"
            imm="$(immutable_rc_suffix "$sel" "$VERSION" "$RC" "$EXPECTED_REVISION")"
            EXPECTED_REVISION="$EXPECTED_REVISION" EXPECTED_ROLE=rc-publisher \
              bash scripts/verify-image-release-identity.sh "$NS/$fam:$imm"
          done
      - name: Generate + sign the RC manifest
        env:
          RC: ${{ github.event.inputs.rc }}
          VERSION: ${{ github.event.inputs.version }}
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          bash scripts/generate-release-manifest.sh "$VERSION" --rc "$RC" --revision "$EXPECTED_REVISION"
          bash scripts/sign-release-manifest.sh release-artifacts/release-manifest.yaml
          bash scripts/verify-release-manifest.sh release-artifacts/release-manifest.yaml
      - name: Upload signed RC manifest (immutable evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-manifest-${{ github.event.inputs.version }}-${{ github.event.inputs.rc }}
          path: |
            release-artifacts/release-manifest.yaml
            release-artifacts/release-manifest.yaml.sha256
            release-artifacts/release-manifest.yaml.sig
            release-artifacts/release-manifest.yaml.pem
          if-no-files-found: error
