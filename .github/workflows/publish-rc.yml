name: publish-rc

# ---------------------------------------------------------------------------
# DISABLED ENTRY POINT — this workflow no longer publishes anything.
#
# It used to call the reusable publish-ghcr workflow, which built every image and
# pushed immutable RC tags to the PRODUCTION packages, signing them with an OIDC
# identity along the way. That implementation has been DELETED from executable
# code, not merely blocked.
#
# Why deleted rather than left sitting behind a permission denial. The
# repository's GITHUB_TOKEN can no longer write any production package — proven
# behaviourally in docs/audits/package-acl-2026-08-03/ (run 30837370041, verdict
# PASS, 6/6 `denied: permission_denied: write_package`). A publisher left in
# place would fail on a permission error, and the obvious "fix" for a permission
# error is to restore the permission, reopening exactly the bypass the boundary
# was installed to close. Misleading executable code invites that.
#
# The entry point is KEPT and refuses loudly, so an operator who dispatches it
# gets an explanation rather than a missing-workflow error.
#
# What replaces it: .github/workflows/stage-and-authorize.yml. Sealing the
# immutable signed RC manifest from its authorization record is the next change
# (#139) and will repurpose this entry point. Git history holds the previous
# implementation; that is the restoration reference, not a dormant copy.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "(disabled) Release version this RC targeted, vYYYY.MM.DD[.N]"
        required: false
      rc:
        description: "(disabled) RC identifier, e.g. rc1"
        required: false

# Read-only. No packages, no id-token, no environment: this must not be able to
# publish even if a later change tries to make it.
permissions:
  contents: read

jobs:
  refuse:
    name: RC publication is disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          REFUSE: public publication is disabled pending immutable RC manifest
          sealing and protected exposure (#139).

          This workflow no longer builds or pushes anything. The production
          publisher was removed from executable code, because the repository
          token cannot write production packages and a publisher that fails on a
          permission error invites someone to restore the permission.

          Run instead:
            stage-and-authorize.yml - builds every image, stages it privately,
            evaluates it by digest, and emits a post-build authorization record.

          That record authorizes ONE thing: those exact staged child digests are
          eligible as inputs to an immutable RC manifest. It does not authorize
          public exposure - that decision belongs to a separate protected path.

          Boundary evidence:
            docs/audits/package-acl-2026-08-03/  (run 30837370041, verdict PASS)
          MSG
          exit 1
