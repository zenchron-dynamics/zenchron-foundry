name: release

# ---------------------------------------------------------------------------
# DISABLED ENTRY POINT — this workflow no longer releases anything.
#
# It used to seal a stable GitHub release for a v* tag: gate on the exact-commit
# CI evidence, then publish stable *-prod tags through the reusable publish-ghcr
# workflow, sign them, and attach release artifacts. That implementation has been
# DELETED from executable code.
#
# See publish-rc.yml for the full reasoning. In short: the repository token
# cannot write production packages (docs/audits/package-acl-2026-08-03/, run
# 30837370041), and leaving a publisher behind that denial would present a
# permission error whose obvious "fix" is to restore the permission.
#
# Stable publication returns only with a separate publishing identity and a
# protected exposure job — not by restoring access to this path.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "(disabled) Release version, vYYYY.MM.DD[.N]"
        required: false

permissions:
  contents: read

jobs:
  refuse:
    name: stable release is disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          REFUSE: public publication is disabled pending immutable RC manifest
          sealing and protected exposure (#139).

          Stable release publication was removed from executable code. Nothing
          here builds, pushes, signs or tags.

          The current supported path stops before exposure:
            stage-and-authorize.yml -> post-build authorization record
            (authorization_scope: immutable-rc-manifest-input,
             public_exposure_authorized: false)

          Sealing the immutable RC manifest, and authorizing public exposure,
          are separate changes with their own controls.

          Boundary evidence:
            docs/audits/package-acl-2026-08-03/  (run 30837370041, verdict PASS)
          MSG
          exit 1
