name: release

on:
  push:
    tags:
      - "v*"

# Caller permissions cap the reusable publish workflow — must grant what it needs.
permissions:
  contents: write          # create GitHub Release
  packages: write          # publish-ghcr pushes images
  security-events: write   # publish-ghcr SARIF / attestations
  id-token: write          # keyless cosign

jobs:
  # Reuse the publish workflow to build, push, sign, attest.
  # Stable releases are MULTI-ARCH — publish-ghcr defaults to linux/amd64 only,
  # so the release MUST request both arches (matches the validated RC images).
  images:
    uses: ./.github/workflows/publish-ghcr.yml
    secrets: inherit
    with:
      platforms: linux/amd64,linux/arm64

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - name: Login to GHCR (packages are private)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect SBOMs + scan reports + checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          NS="ghcr.io/zenchron-dynamics"
          for ref in php-fpm:8.4-prod php-cli:8.4-prod php-worker:8.4-prod php-frankenphp:8.4-prod \
                     php-fpm:8.3-prod php-cli:8.3-prod php-worker:8.3-prod php-frankenphp:8.3-prod \
                     caddy:prod nginx:prod; do
            name="${ref//[:\/]/_}"
            syft "${NS}/${ref}" -o spdx-json="release-artifacts/${name}.spdx.json" || true
          done
          ( cd release-artifacts && (ls ./*.json >/dev/null 2>&1 && sha256sum ./*.json > checksums.txt || echo "no SBOMs collected" > checksums.txt) )

      - name: Verification notes
        run: |
          cat > release-artifacts/VERIFY.md <<'EOF'
          # Verifying this release

          All images are Cosign keyless-signed (GitHub OIDC). Verify:

              cosign verify \
                --certificate-identity-regexp 'https://github.com/zenchron-dynamics/zenchron-foundry/.*' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                ghcr.io/zenchron-dynamics/php-fpm:8.3-prod

          SBOM attestations: cosign verify-attestation --type spdxjson <image>.
          Checksums for the attached SBOMs are in checksums.txt.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.spdx.json
            release-artifacts/checksums.txt
            release-artifacts/VERIFY.md
