name: release

# SEAL ONLY — the LAST step of the release ceremony. Dispatch this from the
# stable tag ref AFTER promote-stable.yml has moved the validated RC digests
# onto the canonical *-prod aliases:
#
#   publish-rc -> create stable tag -> promote-stable (from tag) -> release (from tag)
#
# Deliberately NOT `on: push: tags`. A tag push happens before promotion, so an
# automatic seal would always race ahead of the aliases it must verify; and the
# workflow needs the publish-rc run id to fetch the signed RC manifest, which a
# push trigger cannot carry.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version being sealed, e.g. v2026.07.04 — MUST equal the tag this runs from"
        required: true
      rc:
        description: "RC identifier that was promoted, e.g. rc1 (rc<N>)"
        required: true
      rc_manifest_run_id:
        description: "publish-rc run ID whose signed RC manifest artifact is the release source of truth"
        required: true
      verify_rc_run_id:
        description: "verify-rc run ID that certified THIS commit (10/10 runtime) — RUNTIME_RESULT is derived from it"
        required: true

# Caller permissions cap the reusable publish workflow — must grant what it needs.
permissions:
  contents: read

concurrency:
  # Never run two releases of the same tag concurrently; never cancel one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# WF-21: single source for the registry namespace (matches the other
# workflows) — steps must reference these, never a hard-coded literal.
env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics

jobs:
  # P0 stable-release gate. Nothing publishes until ALL of these hold:
  #   * the ref is a tag in the approved version format (vYYYY.MM.DD[.N]);
  #   * the tagged commit is reachable from the protected default branch (master);
  #   * the `foundry-production` GitHub Environment approval is granted (reviewers).
  # The environment gate is what makes "publish stable from an arbitrary branch"
  # impossible: the tag must point at a commit already merged to master.
  guard:
    runs-on: [self-hosted, linux, x64, zenchron]
    environment: foundry-production
    outputs:
      # Derived (never hardcoded) runtime certification result, consumed by the
      # release job's evidence build (RA-02).
      runtime_result: ${{ steps.runtime.outputs.runtime_result }}
    permissions:
      contents: read
      packages: read          # verify-release-binding resolves + cosign-verifies private -prod images
      actions: read           # gh run download: fetch the signed RC manifest artifact
      checks: read            # check-exact-commit-ci.sh: GET /commits/{sha}/check-runs
      statuses: read          # check-exact-commit-ci.sh: GET /commits/{sha}/status
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0          # need full history for the ancestry check
      - name: Ensure release tooling (gh + jq + yq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - name: Preflight — release environments must be protected + reviewed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ENV_CHECK_TOKEN || secrets.GITHUB_TOKEN }}
          # Free-tier: environment reviewers are billing-gated. Explicit acceptance
          # (see docs/audits/free-tier-governance-accepted-risk.md). Remove on Team/public.
          ALLOW_FREE_TIER_NO_REVIEWERS: "1"
        run: bash scripts/check-release-environments.sh --release-ready
      - name: Sealing must run from the stable release tag (ref == version input)
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          require_rc "$RC"
          bash scripts/check-promotion-ref.sh "$REF" "$VERSION"
      - name: Tag commit must be reachable from master
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin master --quiet
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "REFUSE: $SHA is not an ancestor of origin/master — refusing to release an unmerged commit"; exit 1; }
          echo "OK: $SHA is reachable from master"
      - name: Repo invariants (pinning / matrix / supply-chain guard)
        run: |
          set -euo pipefail
          bash scripts/assert-pinned-actions.sh
          bash scripts/assert-no-wolfi.sh
          bash scripts/assert-image-matrix.sh
          # The exact-commit gate below matches check names verbatim; refuse if the
          # policy names drifted from the workflows (they once all had).
          bash scripts/assert-required-checks.sh
      - name: Exact-commit CI gate (every required check green on THIS commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/check-exact-commit-ci.sh "$SHA"
      - name: Runtime certification gate (verify-rc succeeded on THIS commit; derive RUNTIME_RESULT)
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.verify_rc_run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          # RA-02: RUNTIME_RESULT is DERIVED from the referenced verify-rc run,
          # never asserted by hand. Fail closed on every mismatch.
          meta="$(gh api "repos/$REPO/actions/runs/$RUN_ID")" \
            || { echo "REFUSE: verify-rc run $RUN_ID not readable in $REPO"; exit 1; }
          wf="$(jq -r '.name // ""' <<<"$meta")"
          concl="$(jq -r '.conclusion // ""' <<<"$meta")"
          head="$(jq -r '.head_sha // ""' <<<"$meta")"
          [ "$wf" = "verify-rc" ] || { echo "REFUSE: run $RUN_ID is workflow '$wf', not verify-rc"; exit 1; }
          [ "$concl" = "success" ] || { echo "REFUSE: verify-rc run $RUN_ID concluded '$concl', not success"; exit 1; }
          [ "$head" = "$SHA" ] || { echo "REFUSE: verify-rc run $RUN_ID certified $head, not the release commit $SHA"; exit 1; }
          # Count its successful certify matrix jobs ("certify (…)" — the
          # aggregate 'certified' gate job is deliberately excluded).
          n="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                 --jq '[.jobs[] | select(.name | startswith("certify (")) | select(.conclusion == "success")] | length')"
          [ "$n" -eq "$MATRIX_COUNT" ] \
            || { echo "REFUSE: expected $MATRIX_COUNT successful certify jobs in verify-rc run $RUN_ID, found $n"; exit 1; }
          echo "runtime_result=${n}/${n}" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_RESULT derived: ${n}/${n} (verify-rc run $RUN_ID @ $SHA)"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign
      - name: Login to GHCR (resolve + cosign-verify private promoted images)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch + verify the signed RC manifest (from the publish-rc artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_ROLE: rc-publisher
          RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # The signed RC manifest is NEVER committed: committing it would create a
          # commit after the RC was built and break tag-commit == manifest.revision.
          # It is downloaded from the successful publish-rc run that signed it, and
          # that run must have been built from THIS tag's commit. No local fallback.
          bash scripts/fetch-rc-manifest.sh "$RUN_ID" "$VERSION" "$RC" release-artifacts

      - name: Stable aliases must ALREADY hold the RC digests (promotion done)
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fails loud if promote-stable.yml has not run for this release: the
          # equality chain covers tag == manifest.release, tag commit ==
          # manifest.revision, and stable alias digest == RC digest for all 10.
          bash scripts/verify-release-binding.sh release-artifacts/release-manifest.yaml "$REF_NAME" "$SHA"

  # NO BUILD HERE (rule #14 / Sprint 6). The 10 stable images must already exist,
  # promoted from validated RC digests by promote-stable.yml BEFORE this workflow
  # is dispatched. This workflow only *seals* the release: it verifies the
  # already-promoted images from the registry, then attaches the manifest + SBOMs.
  # If the images have not been promoted, verify-release-artifacts.sh fails loud.
  release:
    needs: guard
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: write          # create GitHub Release
      packages: read
      actions: read            # gh run download: fetch the signed RC manifest artifact
      id-token: write
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Ensure release tooling (gh + jq + yq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # WF-17: pin syft so the sealed release SBOMs cannot drift between
          # runs of the same pinned action SHA (v1.42.3 is that SHA's default).
          syft-version: v1.42.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign

      - name: Login to GHCR (packages are private)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts (identity, SBOM, provenance, revision, multi-arch — all 10)
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_ROLE: rc-publisher
          # SC-09: VERSION lets the verifier enumerate ALL stable aliases
          # (canonical prod, prod-<rel>, -debian) and prove digest equality
          # across them before the once-per-digest identity checks.
          VERSION: ${{ github.ref_name }}
          # Machine-readable per-class results — the evidence step below derives
          # its verification fields from this file (RA-01/WF-02).
          RESULTS_JSON: release-verify-results.json
        run: bash scripts/verify-release-artifacts.sh

      - name: Fetch the signed RC manifest for attachment (no regeneration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_ROLE: rc-publisher
          RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # Same artifact the guard verified; re-fetched here because jobs do not
          # share a workspace. Attached as-is — never regenerated at seal time.
          bash scripts/fetch-rc-manifest.sh "$RUN_ID" "$VERSION" "$RC" release-artifacts
          cat release-artifacts/release-manifest.yaml

      - name: Collect per-image SBOMs + checksums (strict — no image may be skipped)
        run: |
          set -euo pipefail
          NS="${REGISTRY}/${NAMESPACE}"   # WF-21: from the shared workflow env, not a literal
          for ref in php-fpm:8.4-prod php-cli:8.4-prod php-worker:8.4-prod php-frankenphp:8.4-prod \
                     php-fpm:8.3-prod php-cli:8.3-prod php-worker:8.3-prod php-frankenphp:8.3-prod \
                     caddy:prod nginx:prod; do
            name="${ref//[:\/]/_}"
            # Strict: a failed SBOM fails the release (no `|| true`).
            syft "${NS}/${ref}" -o spdx-json="release-artifacts/${name}.spdx.json"
          done
          test "$(find release-artifacts -maxdepth 1 -name '*.spdx.json' | wc -l)" -eq 10 \
            || { echo "REFUSE: expected 10 SBOMs, found fewer"; exit 1; }
          ( cd release-artifacts && sha256sum ./*.json > checksums.txt )

      - name: Build + validate the release evidence package (derived results, exact identities)
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          RC_MANIFEST: release-artifacts/release-manifest.yaml
          # Derived by the guard job from the verify-rc run's certify jobs (RA-02).
          RUNTIME_RESULT: ${{ needs.guard.outputs.runtime_result }}
          VULN_RESULT: enforced
          RELEASE_RUN_ID: ${{ github.run_id }}
          ENV_CONFIG: foundry-production
        run: |
          set -euo pipefail
          # RC is recorded in the manifest; pass it through for the evidence.
          RC="$(yq -r '.candidate' release-artifacts/release-manifest.yaml)"
          # RA-01: the five verification results are READ from the results file
          # verify-release-artifacts.sh wrote in this job — never literals.
          # `jq -er` fails closed if a field is missing or null; the evidence
          # validator additionally refuses any partial (n/m, n != m) count.
          SIG_RESULT="$(jq -er '.signature' release-verify-results.json)"
          SBOM_RESULT="$(jq -er '.sbom' release-verify-results.json)"
          PROV_RESULT="$(jq -er '.provenance' release-verify-results.json)"
          OCIREV_RESULT="$(jq -er '.oci_revision' release-verify-results.json)"
          ARCH_RESULT="$(jq -er '.architecture' release-verify-results.json)"
          export RC SIG_RESULT SBOM_RESULT PROV_RESULT OCIREV_RESULT ARCH_RESULT
          bash scripts/build-release-evidence.sh release-artifacts
          bash scripts/validate-release-evidence.sh release-artifacts/evidence.json

      - name: Assemble + validate the release evidence summary (derived, never literals)
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          RC_MANIFEST_RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          VERIFY_RC_RUN_ID: ${{ github.event.inputs.verify_rc_run_id }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          # Derived by the guard job from the verify-rc run's certify jobs (RA-02).
          RUNTIME_RESULT: ${{ needs.guard.outputs.runtime_result }}
        run: |
          set -euo pipefail
          RC="$(yq -r '.candidate' release-artifacts/release-manifest.yaml)"
          # Asset list = the exact files attached to the GitHub Release below,
          # read from disk (ls fails loud if any is missing), plus this summary.
          {
            ls release-artifacts/release-manifest.yaml release-artifacts/checksums.txt \
               release-artifacts/evidence.json release-artifacts/EVIDENCE.md release-artifacts/VERIFY.md
            ls release-artifacts/*.spdx.json
            echo release-artifacts/release-evidence-summary.json
          } | sed 's#^release-artifacts/##' | sort > assets.txt
          # verification = the REAL per-class results verify-release-artifacts.sh
          # wrote in this job, plus the guard-derived runtime result — no literals.
          jq -n \
            --arg version "$VERSION" --arg rc "$RC" --arg revision "$REVISION" \
            --arg rcrun "$RC_MANIFEST_RUN_ID" --arg vrun "$VERIFY_RC_RUN_ID" --arg rrun "$RELEASE_RUN_ID" \
            --arg runtime "$RUNTIME_RESULT" \
            --slurpfile ver release-verify-results.json \
            --rawfile assets assets.txt \
            '{version: $version, rc: $rc, revision: $revision,
              run_ids: {rc_manifest_run_id: $rcrun, verify_rc_run_id: $vrun, release_run_id: $rrun},
              verification: ($ver[0] + {runtime_result: $runtime}),
              assets: ($assets | split("\n") | map(select(length > 0)))}' \
            > release-artifacts/release-evidence-summary.json
          # Re-validate the package WITH the summary: it must parse and its
          # version/rc/revision must equal evidence.json's.
          bash scripts/validate-release-evidence.sh release-artifacts/evidence.json \
            release-artifacts/release-evidence-summary.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}   # explicit: dispatched, not tag-push triggered
          generate_release_notes: true
          files: |
            release-artifacts/release-manifest.yaml
            release-artifacts/*.spdx.json
            release-artifacts/checksums.txt
            release-artifacts/evidence.json
            release-artifacts/EVIDENCE.md
            release-artifacts/VERIFY.md
            release-artifacts/release-evidence-summary.json
