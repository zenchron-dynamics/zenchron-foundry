name: rollback-exercise

# RA-04/WF-07 — automated rollback exercise (ceremony step 11).
#
# Proves, against the LIVE registry, that the rollback path recorded during
# promotion actually works: replay the promotion journal in reverse via
# scripts/rollback-stable.sh (every prior-having alias returns to its prior
# digest), then RESTORE the release by re-promoting the fetched + verified
# signed RC manifest (exact digests, no build) and re-proving the full
# release binding 10/10. Emits machine-readable rollback-results.json with
# REAL counts parsed from the run — never literals.
#
# Dispatch FROM refs/tags/<version> (the same rule as promote-stable):
# `foundry-production` admits stable tags only, and the tag commit is what the
# rollback manifest and RC manifest must both bind to.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version whose rollback is exercised, e.g. v2026.07.21 — MUST equal the tag this runs from"
        required: true
      rc:
        description: "RC identifier that was promoted, e.g. rc1 (rc<N>) — used for the restore re-promotion"
        required: true
      rc_manifest_run_id:
        description: "publish-rc run ID whose signed RC manifest is the restore source of truth"
        required: true
      promotion_run_id:
        description: "promote-stable run ID whose promotion-evidence artifact carries the rollback manifest + journal"
        required: true
      confirmation:
        description: "Typed confirmation: ROLLBACK-EXERCISE-<version>"
        required: true

permissions:
  contents: read

concurrency:
  # Never exercise two rollbacks at once; never cancel one mid-flight — an
  # interrupted exercise leaves production aliases at the PRIOR release.
  group: rollback-exercise-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics

jobs:
  # Approval + input validation, same gate pattern as promote-stable.yml: the
  # `foundry-production` GitHub Environment carries the production reviewers —
  # the exercise mutates live *-prod aliases and cannot proceed unapproved.
  gate:
    runs-on: [self-hosted, linux, x64, zenchron]
    environment: foundry-production
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ensure release tooling (gh + jq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - name: Preflight — release environments must be protected + reviewed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ENV_CHECK_TOKEN || secrets.GITHUB_TOKEN }}
          # Free-tier: environment reviewers are billing-gated. Explicit acceptance
          # (see docs/audits/free-tier-governance-accepted-risk.md). Remove on Team/public.
          ALLOW_FREE_TIER_NO_REVIEWERS: "1"
        run: bash scripts/check-release-environments.sh --release-ready
      - name: Validate inputs + ref policy + typed confirmation
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
          RC_RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          PROMOTION_RUN_ID: ${{ github.event.inputs.promotion_run_id }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          require_calver "$VERSION"
          require_rc "$RC"
          printf '%s' "$RC_RUN_ID" | grep -Eq '^[0-9]+$' || die "rc_manifest_run_id '$RC_RUN_ID' is not numeric"
          printf '%s' "$PROMOTION_RUN_ID" | grep -Eq '^[0-9]+$' || die "promotion_run_id '$PROMOTION_RUN_ID' is not numeric"
          # Must be dispatched FROM the stable tag (same policy as promote-stable).
          bash scripts/check-promotion-ref.sh "$REF" "$VERSION"
          [ "$CONFIRMATION" = "ROLLBACK-EXERCISE-${VERSION}" ] \
            || die "confirmation must be ROLLBACK-EXERCISE-<version>"
          echo "OK: exercising rollback of $VERSION ($RC) from $REF (confirmed)"

  exercise:
    needs: gate
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      packages: write          # rollback + restore retag production aliases
      actions: read            # gh run download: promotion evidence + signed RC manifest
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ensure release tooling (gh + jq + yq present on runner)
        run: bash scripts/ci/ensure-release-tools.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the promotion evidence artifact (rollback manifest + journal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PROMOTION_RUN_ID: ${{ github.event.inputs.promotion_run_id }}
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fail-closed provenance of the source run: it must be THIS repo's
          # promote-stable.yml, concluded success, on THIS tag's commit.
          meta="$(gh api "repos/$REPO/actions/runs/$PROMOTION_RUN_ID")" \
            || { echo "REFUSE: promotion run $PROMOTION_RUN_ID not readable in $REPO"; exit 1; }
          path="$(jq -r '.path // ""' <<<"$meta")"
          concl="$(jq -r '.conclusion // ""' <<<"$meta")"
          head="$(jq -r '.head_sha // ""' <<<"$meta")"
          [ "$path" = ".github/workflows/promote-stable.yml" ] \
            || { echo "REFUSE: run $PROMOTION_RUN_ID is '$path', not promote-stable.yml"; exit 1; }
          [ "$concl" = "success" ] \
            || { echo "REFUSE: promotion run $PROMOTION_RUN_ID concluded '$concl', not success"; exit 1; }
          [ "$head" = "$SHA" ] \
            || { echo "REFUSE: promotion run $PROMOTION_RUN_ID promoted $head, not the release commit $SHA"; exit 1; }
          mkdir -p rollback-exercise
          gh run download "$PROMOTION_RUN_ID" --repo "$REPO" \
            -n "promotion-evidence-${VERSION}" -D rollback-exercise
          ls -la rollback-exercise

      - name: Verify the rollback manifest matches this release (version + revision)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          rb="rollback-exercise/rollback-${VERSION}.yaml"
          jr="rollback-exercise/promotion-journal-${VERSION}.txt"
          [ -f "$rb" ] || die "rollback manifest missing from the promotion evidence: $rb"
          [ -f "$jr" ] || die "promotion journal missing from the promotion evidence: $jr"
          got="$(yq -r '.release' "$rb")";   [ "$got" = "$VERSION" ] || die "rollback manifest release '$got' != '$VERSION'"
          got="$(yq -r '.candidate' "$rb")"; [ "$got" = "$RC" ]      || die "rollback manifest candidate '$got' != '$RC'"
          got="$(yq -r '.revision' "$rb")";  [ "$got" = "$SHA" ]     || die "rollback manifest revision '$got' != tag commit '$SHA'"
          echo "OK: rollback manifest binds ${VERSION}/${RC} @ ${SHA}"

      - name: Fetch + verify the signed RC manifest (restore source of truth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_ROLE: rc-publisher
          RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # Verifies run origin (this repo, publish-rc.yml, success, head_sha ==
          # the tag commit), artifact completeness, checksum, cosign signature,
          # schema/policy, and that the manifest names exactly this version+rc+revision.
          bash scripts/fetch-rc-manifest.sh "$RUN_ID" "$VERSION" "$RC" release-artifacts

      - name: Snapshot current stable alias state (pre-exercise)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-aliases.sh
          . scripts/lib/registry-ops.sh
          rel="${VERSION#v}"
          : > rollback-exercise/alias-state-before.txt
          for t in $MATRIX_IMAGES; do
            fam="${t%:*}"; sel="${t#*:}"
            for suf in $(stable_aliases "$sel" "$rel"); do
              ref="$(full_ref "$fam" "$suf")"
              d="$(reg_digest "$ref" 2>/dev/null || echo UNRESOLVED)"
              printf '%s\t%s\n' "$ref" "$d" >> rollback-exercise/alias-state-before.txt
            done
          done
          cat rollback-exercise/alias-state-before.txt

      - name: Exercise rollback (replay the journal in reverse, restore priors)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # GITHUB_ACTIONS=true (set by the runner) satisfies the SC-01 CI-only
          # guard in lib/registry-ops.sh — alias mutation stays inside CI.
          # Exit 99 (incomplete rollback) fails this step loudly via pipefail.
          ARTDIR=rollback-exercise bash scripts/rollback-stable.sh \
            "rollback-exercise/rollback-${VERSION}.yaml" \
            "rollback-exercise/promotion-journal-${VERSION}.txt" \
            | tee rollback-exercise/rollback-run.log
          grep -q "^ROLLBACK OK" rollback-exercise/rollback-run.log

      - name: Verify every prior-having alias resolves to its prior digest
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-ops.sh
          rb="rollback-exercise/rollback-${VERSION}.yaml"
          total=0; okc=0
          while IFS="$(printf '\t')" read -r ref prior; do
            [ -n "$ref" ] || continue
            total=$((total+1))
            got="$(reg_digest "$ref" 2>/dev/null || echo '')"
            if [ "$got" = "$prior" ]; then
              okc=$((okc+1)); echo "PASS $ref back at prior $prior"
            else
              echo "FAIL $ref: $got != prior $prior"
            fi
          done < <(yq -r '.aliases[] | select(.prior_digest != "NONE" and .prior_digest != null) | [.ref, .prior_digest] | @tsv' "$rb")
          [ "$total" -gt 0 ] || { echo "REFUSE: no prior-having aliases in the rollback manifest"; exit 1; }
          [ "$okc" -eq "$total" ] || { echo "REFUSE: only ${okc}/${total} prior-having aliases restored"; exit 1; }
          printf '%s/%s\n' "$okc" "$total" > rollback-exercise/priors-verified.txt
          echo "OK: ${okc}/${total} prior-having aliases verified at their prior digests"

      - name: Restore — re-promote the verified RC manifest (exact digests, no build)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # Restore evidence goes to restore-artifacts/ so it cannot clobber the
          # downloaded promotion evidence in rollback-exercise/.
          ARTDIR=restore-artifacts bash scripts/promote-stable.sh "$VERSION" "$RC" \
            --manifest release-artifacts/release-manifest.yaml

      - name: Verify restore — release binding holds again (10/10 images, all aliases)
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-binding.sh release-artifacts/release-manifest.yaml "$REF_NAME" "$SHA" \
            | tee rollback-exercise/restore-binding.log

      - name: Emit rollback-results.json (real counts parsed from the exercise runs)
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
          SHA: ${{ github.sha }}
          RC_RUN_ID: ${{ github.event.inputs.rc_manifest_run_id }}
          PROMOTION_RUN_ID: ${{ github.event.inputs.promotion_run_id }}
          EXERCISE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every count below is PARSED from the logs the steps above produced —
          # rollback-stable.sh's own summary line, the prior-verification tally,
          # and verify-release-binding.sh's PASS lines. No literals.
          read -r restored left failed <<EOF2
          $(awk -F'[ ,]+' '/^rollback: /{print $2, $4, $8}' rollback-exercise/rollback-run.log | tail -1)
          EOF2
          for v in "$restored" "$left" "$failed"; do
            printf '%s' "$v" | grep -Eq '^[0-9]+$' || { echo "REFUSE: unparsable rollback counts '$restored/$left/$failed'"; exit 1; }
          done
          priors="$(cat rollback-exercise/priors-verified.txt)"
          binding_pass="$(grep -c '^PASS ' rollback-exercise/restore-binding.log)"
          binding_line="$(grep '^RELEASE BINDING OK' rollback-exercise/restore-binding.log | tail -1)"
          [ -n "$binding_line" ] || { echo "REFUSE: restore binding did not conclude OK"; exit 1; }
          jq -n \
            --arg version "$VERSION" --arg rc "$RC" --arg revision "$SHA" \
            --arg rcrun "$RC_RUN_ID" --arg prun "$PROMOTION_RUN_ID" --arg erun "$EXERCISE_RUN_ID" \
            --argjson restored "$restored" --argjson left_tagged "$left" --argjson failed "$failed" \
            --arg priors "$priors" --argjson binding_pass "$binding_pass" --arg binding "$binding_line" \
            '{version: $version, rc: $rc, revision: $revision,
              run_ids: {rc_manifest_run_id: $rcrun, promotion_run_id: $prun, rollback_exercise_run_id: $erun},
              rollback: {restored: $restored, left_tagged: $left_tagged, failed: $failed},
              prior_restore_verified: $priors,
              restore: {binding_pass_aliases: $binding_pass, binding_result: $binding}}' \
            > rollback-exercise/rollback-results.json
          cat rollback-exercise/rollback-results.json

      # On ANY failure this still captures whatever exists — and because the
      # downloaded rollback manifest + journal exist from the first step on,
      # if-no-files-found: error makes an evidence-free green upload impossible.
      - name: Upload rollback exercise evidence (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-exercise-${{ github.event.inputs.version }}
          path: |
            rollback-exercise/
            restore-artifacts/rollback-*.yaml*
            restore-artifacts/promotion-journal-*.txt
            restore-artifacts/promotion-*.yaml*
            restore-artifacts/ROLLBACK-INCIDENT.txt
          if-no-files-found: error

      # Success path only: the machine-readable result MUST exist by now.
      - name: Upload rollback-results.json (ceremony step 11 evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-results-${{ github.event.inputs.version }}
          path: rollback-exercise/rollback-results.json
          if-no-files-found: error
