name: rollback-exercise

# ---------------------------------------------------------------------------
# DISABLED ENTRY POINT — this workflow no longer exercises rollback.
#
# It used to retag production aliases backwards and forwards through
# scripts/rollback-stable.sh and scripts/promote-stable.sh, proving the rollback
# path worked. Both are production writes.
#
# The exercise cannot be meaningful right now for a second reason, independent
# of permissions: there are no stable production tags being published, so there
# is nothing to roll back to. Restoring the write access would let it retag
# whatever happens to be there, which proves nothing.
#
# It returns when there is a protected exposure path to exercise (#139).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    name: rollback exercise is disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          REFUSE: public publication is disabled pending immutable RC manifest
          sealing and protected exposure (#139).

          The rollback exercise retagged production aliases. That path was
          removed from executable code.

          It is also not currently meaningful: nothing is being published to
          stable tags, so there is no prior state to roll back to.

          The current path stops at authorization:
            stage-and-authorize.yml -> post-build authorization record

          Boundary evidence:
            docs/audits/package-acl-2026-08-03/  (run 30837370041, verdict PASS)
          MSG
          exit 1
