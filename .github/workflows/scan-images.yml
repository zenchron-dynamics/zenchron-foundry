name: scan-images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"        # weekly rebuild-and-rescan, Monday 03:00 UTC
  pull_request:
    branches: [master]
    paths:
      - "images/**"
      - "policies/**"

permissions:
  contents: read
  security-events: write       # upload SARIF
  packages: read

jobs:
  scan:
    name: scan ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gate=true  -> enforcing Trivy gate (fixable CRITICAL/HIGH fail the build).
        # gate=false -> scan + report only. Used for the edge images (nginx/caddy)
        #   whose binaries we do NOT rebuild: their fixable CVEs come from UPSTREAM
        #   IMAGE LAG (the official image ships a stale Debian/Alpine snapshot), so
        #   they clear only when upstream rebuilds. The weekly cron + Dependabot
        #   surface that drift; see docs/vulnerability-management.md.
        include:
          - { fam: php-fpm,    ver: "8.3", ctx: "images/php-fpm/8.3",    gate: true }
          - { fam: php-cli,    ver: "8.3", ctx: "images/php-cli/8.3",    gate: true }
          - { fam: php-worker, ver: "8.3", ctx: "images/php-worker/8.3", gate: true }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3", gate: true }
          - { fam: php-fpm,    ver: "8.4", ctx: "images/php-fpm/8.4",    gate: true }
          - { fam: php-cli,    ver: "8.4", ctx: "images/php-cli/8.4",    gate: true }
          - { fam: php-worker, ver: "8.4", ctx: "images/php-worker/8.4", gate: true }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4", gate: true }
          - { fam: nginx,      ver: "prod", ctx: "images/nginx",         gate: true }
          # caddy: report-only. It is the one Alpine image (no upstream Debian
          # Caddy exists); its fixable findings are Alpine openssl + the Go stdlib
          # the Caddy BINARY was built with — neither is patchable in our layer
          # (`apk upgrade` is forbidden by assert-no-wolfi; the Go stdlib needs an
          # upstream rebuild). Dependabot watches the caddy digest; exceptions are
          # recorded in policies/.trivyignore with review dates.
          - { fam: caddy,      ver: "prod", ctx: "images/caddy",         gate: false }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.ctx }}
          load: true
          tags: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          cache-from: type=gha

      # --- SBOM (Syft) -------------------------------------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          format: spdx-json
          artifact-name: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json
          output-file: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json

      # --- Trivy (official image; avoids action-version churn) ---------------
      - name: Save image for scanning
        run: docker save "scan-target:${{ matrix.fam }}-${{ matrix.ver }}" -o /tmp/scan-image.tar

      - name: Trivy scan (SARIF)
        run: |
          docker run --rm -e TRIVY_NO_PROGRESS=true \
            -v /tmp:/tmp -v "$PWD:/work" -w /work \
            aquasec/trivy:0.71.0 image --input /tmp/scan-image.tar \
            --scanners vuln --format sarif \
            --output "trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif" \
            --severity CRITICAL,HIGH

      # Enforcing gate: fail on FIXABLE CRITICAL/HIGH only (--ignore-unfixed).
      # Debian carries many distro CVEs with NO fix available (perl-base, zlib1g,
      # libsqlite3-0, ncurses, ...); failing on those is not actionable — we would
      # have to fork Debian. They are triaged in docs/vulnerability-management.md
      # and surfaced (non-gating) in the SARIF above. A fixable finding means a
      # fresher base digest exists: bump it (docs/security/base-image-patching.md).
      - name: Trivy gate (fixable CRITICAL/HIGH)
        if: ${{ matrix.gate == true }}
        run: |
          docker run --rm -e TRIVY_NO_PROGRESS=true \
            -v /tmp:/tmp -v "$PWD:/work" -w /work \
            aquasec/trivy:0.71.0 image --input /tmp/scan-image.tar \
            --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --ignorefile policies/.trivyignore

      # Code-scanning SARIF upload needs GitHub Advanced Security, which is not
      # available on Free-plan private repos — so this is best-effort. The SARIF
      # is always retained as a build artifact (see "Upload scan artifacts").
      - name: Upload Trivy SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif
          category: trivy-${{ matrix.fam }}-${{ matrix.ver }}

      # --- Grype (second opinion — non-gating, SARIF for visibility) ---------
      # Trivy is the enforcing gate (above). Grype runs as an independent second
      # opinion and uploads SARIF; it does not fail the build, so a finding only
      # one scanner sees surfaces in Security without blocking on tool variance.
      - name: Grype scan
        id: grype
        uses: anchore/scan-action@v4
        with:
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.fam }}-${{ matrix.ver }}

      # --- Artifacts ---------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.fam }}-${{ matrix.ver }}
          path: |
            *.sarif
            *.spdx.json
          retention-days: 30
