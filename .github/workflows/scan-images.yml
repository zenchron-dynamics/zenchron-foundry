name: scan-images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"        # weekly rebuild-and-rescan, Monday 03:00 UTC
  # NO pull_request trigger. This workflow builds and scans images on the
  # privileged self-hosted pool, and nothing a pull request can edit may reach
  # that pool — a pull_request workflow runs the PR's own copy of this file.
  # Per-PR scanning happens in trusted-validation.yml, which is defined on
  # master and takes an explicitly reviewed commit SHA (#96).

permissions:
  contents: read
  security-events: write       # upload SARIF
  packages: read

jobs:
  scan:
    name: scan ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    # Trust boundary: a fork PR builds its own Dockerfiles on the self-hosted
    # runner. Only run for same-repo branches; fork PRs skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      # Serialized — small shared self-hosted disk; see ci.yml build-test note.
      max-parallel: 1
      matrix:
        # WF-18: every image is gated unconditionally — there is no report-only
        # image, so the former per-entry `gate:` flag is gone.
        #
        # Since #102/#103 the gate is reconciliation, not suppression: the scan
        # reports EVERY CRITICAL/HIGH (nothing dropped for being unfixed), and
        # each finding must be matched by an in-scope, unexpired entry in
        # policies/vulnerability-exceptions.yaml. Upstream lag is therefore an
        # explicit, owned, expiring decision per image rather than a scanner
        # flag. See docs/vulnerability-management.md.
        include:
          - { fam: php-fpm,    ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-cli,    ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-worker, ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-fpm,    ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,    ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker, ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: nginx,      ver: "prod", ctx: "images/nginx" }
          # caddy: ENFORCING. CVE-2026-34986 was RESOLVED in the pinned
          # caddy:2-alpine base (go-jose/v3 v3.0.5) — see docs/security/cve-2026-
          # 34986-review.md. Its remaining Alpine/Go-stdlib findings are all
          # FIXABLE upstream-lag items, each carried as an explicit, non-expired,
          # caddy-scoped exception — never as report-only, and never hidden by a
          # scanner flag.
          - { fam: caddy,      ver: "prod", ctx: "images/caddy" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Disk snapshot before build (job-scoped cleanup runs at job end)
        run: |
          rm -f /tmp/scan-image.tar 2>/dev/null || true
          df -h / | tail -1

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          load: true
          tags: scan-target:${{ matrix.fam }}-${{ matrix.ver }}

      # --- SBOM (Syft) -------------------------------------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # WF-17: pin syft so SBOM output cannot drift between runs of the same
          # pinned action SHA (v1.42.3 is the version that SHA ships by default).
          syft-version: v1.42.3
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          format: spdx-json
          artifact-name: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json
          output-file: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json

      # --- Trivy (official image; avoids action-version churn) ---------------
      # Scan the image DIRECTLY from the docker daemon (socket mount) — no
      # `docker save` tar. On the small shared disk, writing a ~1GB tar per image
      # exhausted /tmp ("Save image for scanning" failed); scanning from the
      # daemon removes that write entirely.
      - name: Trivy scan (SARIF)
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-cache
          # Retry: the trivy DB download is flaky under network contention on the
          # shared runner. A persistent cache avoids re-downloading across steps/jobs.
          n=0
          until [ "$n" -ge 3 ]; do
            docker run --rm -e TRIVY_NO_PROGRESS=true \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy -v "$PWD:/work" -w /work \
              aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 image "scan-target:${{ matrix.fam }}-${{ matrix.ver }}" \
              --scanners vuln --format sarif \
              --output "trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif" \
              --severity CRITICAL,HIGH && break
            n=$((n+1)); echo "trivy scan attempt $n failed; retrying in 15s"; sleep 15
          done
          test -f "trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif"

      # Enforcing gate: EVERY CRITICAL/HIGH must be governed (#102, #103).
      #
      # This used to run `--ignore-unfixed --ignorefile policies/.trivyignore`,
      # which had two holes. `--ignore-unfixed` dropped not-yet-fixed findings
      # BEFORE the exception ledger was consulted, so a new unfixed CRITICAL
      # shipped with no owner, reachability decision, expiry or compensating
      # control. And `.trivyignore` is global — Trivy takes one ignore file per
      # scan — so a CVE accepted on caddy was suppressed on all 10 images.
      #
      # Now Trivy suppresses NOTHING: it reports the full CRITICAL/HIGH set as
      # JSON (exit 0, so the scan itself is not the gate), and
      # reconcile-vulnerabilities.sh decides per image whether each finding has
      # an in-scope, unexpired ledger entry. Ungoverned finding = failed build,
      # fixable or not.
      - name: Trivy scan (full CRITICAL/HIGH set, nothing suppressed)
        id: trivy_full
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-cache
          # Retry transient DB/network errors only. With --exit-code 0 any
          # non-zero rc is an infrastructure failure, never a finding, so this
          # cannot mask a gate hit.
          n=0
          while :; do
            set +e
            docker run --rm -e TRIVY_NO_PROGRESS=true \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy -v "$PWD:/work" -w /work \
              aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 image "scan-target:${{ matrix.fam }}-${{ matrix.ver }}" \
              --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
              --format json --output "trivy-full-${{ matrix.fam }}-${{ matrix.ver }}.json"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && break
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "trivy scan infra error (rc=$rc) after retries"; exit "$rc"; }
            echo "trivy scan infra error (rc=$rc); retry $n in 15s"; sleep 15
          done
          # Fail closed: no JSON means no evidence, not a clean image.
          test -s "trivy-full-${{ matrix.fam }}-${{ matrix.ver }}.json"

      - name: Vulnerability gate (reconcile every finding against the ledger)
        id: trivy_gate
        run: |
          set -euo pipefail
          mkdir -p vuln-reconciliation
          # --arch is load-bearing: an exception authorises only the
          # architectures it was reconciled on, so scanning an architecture with
          # no evidence leaves every finding ungoverned and fails the build.
          # That is what blocks a multi-arch release on amd64-only evidence.
          bash scripts/reconcile-vulnerabilities.sh \
            "trivy-full-${{ matrix.fam }}-${{ matrix.ver }}.json" \
            "${{ matrix.fam }}" "${{ matrix.ver }}" \
            --arch "linux/${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}" \
            --json "vuln-reconciliation/${{ matrix.fam }}-${{ matrix.ver }}.json"

      # Evidence on success AND failure: on a gate hit the JSON names every
      # ungoverned finding, which is when it is worth having.
      - name: Upload vulnerability reconciliation
        if: always() && hashFiles('vuln-reconciliation/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vuln-reconciliation-${{ matrix.fam }}-${{ matrix.ver }}
          path: vuln-reconciliation/
          if-no-files-found: error

      # Code-scanning SARIF upload needs GitHub Advanced Security, which is not
      # available on Free-plan private repos — so this is best-effort. The SARIF
      # is always retained as a build artifact (see "Upload scan artifacts").
      - name: Upload Trivy SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif
          category: trivy-${{ matrix.fam }}-${{ matrix.ver }}

      # --- Grype (second opinion — non-gating, SARIF for visibility) ---------
      # Trivy is the enforcing gate (above). Grype runs as an independent second
      # opinion and uploads SARIF; it does not fail the build, so a finding only
      # one scanner sees surfaces in Security without blocking on tool variance.
      - name: Grype scan
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.fam }}-${{ matrix.ver }}

      # RA-07: consolidated per-leg scan result — REAL step outcomes (the
      # enforcing Trivy gate and the non-gating Grype second opinion), stamped
      # with the exact commit scanned. Recorded on failure too.
      - name: Emit scan-results.json (real outcomes)
        if: always()
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          SHA: ${{ github.sha }}
          TRIVY_GATE_OUTCOME: ${{ steps.trivy_gate.outcome }}
          GRYPE_OUTCOME: ${{ steps.grype.outcome }}
        run: |
          set -euo pipefail
          jq -n --arg image "${FAM}-${VER}" --arg commit "$SHA" \
            --arg trivy_gate "$TRIVY_GATE_OUTCOME" --arg grype "$GRYPE_OUTCOME" \
            '{image: $image, commit: $commit,
              trivy_gate: $trivy_gate, trivy_gate_passed: ($trivy_gate == "success"),
              grype_completed: ($grype == "success")}' \
            > scan-results.json
          cat scan-results.json

      # Commit in the artifact name: scan evidence is only meaningful for the
      # exact commit it scanned (the release gate is exact-commit).
      - name: Upload consolidated scan result (commit-stamped)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-results-${{ matrix.fam }}-${{ matrix.ver }}-${{ github.sha }}
          path: scan-results.json
          if-no-files-found: error
          retention-days: 30

      # --- Artifacts ---------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-${{ matrix.fam }}-${{ matrix.ver }}
          path: |
            *.sarif
            *.spdx.json
          retention-days: 30

  # Matrix-wide aggregate (#102/#103). Per-image reconciliation cannot tell an
  # unused exception from one that belongs to a different image, so the stale
  # check has to run once, after every leg, over all ten reconciliation files.
  # It fails closed on a short matrix: a partial run would report live
  # exceptions as stale.
  stale-exceptions:
    name: no stale vulnerability exceptions
    # Static, like every other job here. This workflow has no pull_request
    # trigger, so the old `fromJSON(github.event_name != 'pull_request' ...)`
    # expression always resolved to the self-hosted pool while reading as if it
    # were a fork guard. Per #96 a workflow cannot gate its own runner anyway —
    # the runner group does that at GitHub's control plane — so an expression
    # that only ever has one value is removed rather than left to mislead.
    runs-on: [self-hosted, linux, x64, zenchron]
    needs: scan
    if: ${{ always() }}
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scrub stale reconciliation results (persistent workspace)
        run: rm -rf vuln-reconciliation
      - name: Download every image's reconciliation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: vuln-reconciliation
          pattern: vuln-reconciliation-*
          merge-multiple: true
      - name: Fail on exceptions that matched no shipping image
        run: bash scripts/ci/assert-no-stale-exceptions.sh vuln-reconciliation
