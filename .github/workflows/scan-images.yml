name: scan-images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"        # weekly rebuild-and-rescan, Monday 03:00 UTC
  pull_request:
    branches: [master]
    # WF-05: also trigger on changes to the scan logic itself — this workflow
    # and the scripts it (and its gates) run — not only on image/policy edits.
    paths:
      - "images/**"
      - "policies/**"
      - ".github/workflows/scan-images.yml"
      - "scripts/**"

permissions:
  contents: read
  security-events: write       # upload SARIF
  packages: read

jobs:
  scan:
    name: scan ${{ matrix.fam }} ${{ matrix.ver }}
    runs-on: [self-hosted, linux, x64, zenchron]
    # Trust boundary: a fork PR builds its own Dockerfiles on the self-hosted
    # runner. Only run for same-repo branches; fork PRs skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      # Serialized — small shared self-hosted disk; see ci.yml build-test note.
      max-parallel: 1
      matrix:
        # WF-18: every image enforces the Trivy gate unconditionally (fixable
        # CRITICAL/HIGH fail the build) — there is no report-only image, so the
        # former per-entry `gate:` flag is gone. Unfixable upstream lag is
        # excluded by `--ignore-unfixed` and tracked as explicit, non-expired
        # entries in policies/vulnerability-exceptions.yaml (validated in CI).
        # See docs/vulnerability-management.md.
        include:
          - { fam: php-fpm,    ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-cli,    ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-worker, ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-fpm,    ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,    ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker, ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: nginx,      ver: "prod", ctx: "images/nginx" }
          # caddy: ENFORCING (state A). CVE-2026-34986 was RESOLVED in the pinned
          # caddy:2-alpine base (go-jose/v3 v3.0.5) — see docs/security/cve-2026-
          # 34986-review.md. The gate runs `--ignore-unfixed`, so it fails ONLY on
          # a FIXABLE CRITICAL/HIGH; any residual unfixable Alpine/Go-stdlib lag is
          # carried as an explicit, non-expired exception in
          # policies/vulnerability-exceptions.yaml — never as report-only.
          - { fam: caddy,      ver: "prod", ctx: "images/caddy" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Disk snapshot before build (job-scoped cleanup runs at job end)
        run: |
          rm -f /tmp/scan-image.tar 2>/dev/null || true
          df -h / | tail -1

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          load: true
          tags: scan-target:${{ matrix.fam }}-${{ matrix.ver }}

      # --- SBOM (Syft) -------------------------------------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # WF-17: pin syft so SBOM output cannot drift between runs of the same
          # pinned action SHA (v1.42.3 is the version that SHA ships by default).
          syft-version: v1.42.3
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          format: spdx-json
          artifact-name: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json
          output-file: ${{ matrix.fam }}-${{ matrix.ver }}.spdx.json

      # --- Trivy (official image; avoids action-version churn) ---------------
      # Scan the image DIRECTLY from the docker daemon (socket mount) — no
      # `docker save` tar. On the small shared disk, writing a ~1GB tar per image
      # exhausted /tmp ("Save image for scanning" failed); scanning from the
      # daemon removes that write entirely.
      - name: Trivy scan (SARIF)
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-cache
          # Retry: the trivy DB download is flaky under network contention on the
          # shared runner. A persistent cache avoids re-downloading across steps/jobs.
          n=0
          until [ "$n" -ge 3 ]; do
            docker run --rm -e TRIVY_NO_PROGRESS=true \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy -v "$PWD:/work" -w /work \
              aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 image "scan-target:${{ matrix.fam }}-${{ matrix.ver }}" \
              --scanners vuln --format sarif \
              --output "trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif" \
              --severity CRITICAL,HIGH && break
            n=$((n+1)); echo "trivy scan attempt $n failed; retrying in 15s"; sleep 15
          done
          test -f "trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif"

      # Enforcing gate: fail on FIXABLE CRITICAL/HIGH only (--ignore-unfixed).
      # Debian carries many distro CVEs with NO fix available (perl-base, zlib1g,
      # libsqlite3-0, ncurses, ...); failing on those is not actionable — we would
      # have to fork Debian. They are triaged in docs/vulnerability-management.md
      # and surfaced (non-gating) in the SARIF above. A fixable finding means a
      # fresher base digest exists: bump it (docs/security/base-image-patching.md).
      - name: Trivy gate (fixable CRITICAL/HIGH)
        id: trivy_gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-cache
          # Separate retry for transient DB/network errors WITHOUT masking a real
          # gate hit: only retry on trivy's infra exit code (>1); exit 1 = findings.
          n=0
          while :; do
            set +e
            docker run --rm -e TRIVY_NO_PROGRESS=true \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy -v "$PWD:/work" -w /work \
              aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 image "scan-target:${{ matrix.fam }}-${{ matrix.ver }}" \
              --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
              --ignore-unfixed --ignorefile policies/.trivyignore
            rc=$?
            set -e
            # 0 = clean, 1 = fixable findings (real gate failure) -> stop, propagate.
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 1 ] && { echo "Trivy gate: fixable CRITICAL/HIGH found"; exit 1; }
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "trivy gate infra error (rc=$rc) after retries"; exit "$rc"; }
            echo "trivy gate infra error (rc=$rc); retry $n in 15s"; sleep 15
          done

      # Code-scanning SARIF upload needs GitHub Advanced Security, which is not
      # available on Free-plan private repos — so this is best-effort. The SARIF
      # is always retained as a build artifact (see "Upload scan artifacts").
      - name: Upload Trivy SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-${{ matrix.fam }}-${{ matrix.ver }}.sarif
          category: trivy-${{ matrix.fam }}-${{ matrix.ver }}

      # --- Grype (second opinion — non-gating, SARIF for visibility) ---------
      # Trivy is the enforcing gate (above). Grype runs as an independent second
      # opinion and uploads SARIF; it does not fail the build, so a finding only
      # one scanner sees surfaces in Security without blocking on tool variance.
      - name: Grype scan
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: scan-target:${{ matrix.fam }}-${{ matrix.ver }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF (best-effort; needs Advanced Security)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.fam }}-${{ matrix.ver }}

      # RA-07: consolidated per-leg scan result — REAL step outcomes (the
      # enforcing Trivy gate and the non-gating Grype second opinion), stamped
      # with the exact commit scanned. Recorded on failure too.
      - name: Emit scan-results.json (real outcomes)
        if: always()
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          SHA: ${{ github.sha }}
          TRIVY_GATE_OUTCOME: ${{ steps.trivy_gate.outcome }}
          GRYPE_OUTCOME: ${{ steps.grype.outcome }}
        run: |
          set -euo pipefail
          jq -n --arg image "${FAM}-${VER}" --arg commit "$SHA" \
            --arg trivy_gate "$TRIVY_GATE_OUTCOME" --arg grype "$GRYPE_OUTCOME" \
            '{image: $image, commit: $commit,
              trivy_gate: $trivy_gate, trivy_gate_passed: ($trivy_gate == "success"),
              grype_completed: ($grype == "success")}' \
            > scan-results.json
          cat scan-results.json

      # Commit in the artifact name: scan evidence is only meaningful for the
      # exact commit it scanned (the release gate is exact-commit).
      - name: Upload consolidated scan result (commit-stamped)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-results-${{ matrix.fam }}-${{ matrix.ver }}-${{ github.sha }}
          path: scan-results.json
          if-no-files-found: error
          retention-days: 30

      # --- Artifacts ---------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-${{ matrix.fam }}-${{ matrix.ver }}
          path: |
            *.sarif
            *.spdx.json
          retention-days: 30

