name: scheduled-rebuild

# ---------------------------------------------------------------------------
# DISABLED ENTRY POINT — this workflow no longer rebuilds or publishes anything.
#
# It used to rebuild every image on a schedule to pick up base-image updates,
# push the result to the PRODUCTION packages and cosign-sign it with a distinct
# OIDC identity. That is a production publication path, and it has been DELETED
# from executable code along with the rest of them.
#
# It is listed here explicitly because it is easy to miss: it composed its
# destination from ${REGISTRY}/${NAMESPACE}/${{ matrix.fam }} rather than naming
# a production package literally, so a search for production package names would
# not have found it. A grep is not an inventory.
#
# Rebuilding on a schedule is still worth having; it returns once staging and
# authorization can feed a protected exposure path (#139).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    name: scheduled rebuild is disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          REFUSE: public publication is disabled pending immutable RC manifest
          sealing and protected exposure (#139).

          The scheduled rebuild pushed and signed images in the production
          packages. That path was removed from executable code.

          The schedule trigger is removed too: a cron that fails every night is
          noise, and noise is how a disabled control stops being noticed.

          Run instead:
            stage-and-authorize.yml - builds every image, stages it privately,
            evaluates it by digest, and emits a post-build authorization record.

          Boundary evidence:
            docs/audits/package-acl-2026-08-03/  (run 30837370041, verdict PASS)
          MSG
          exit 1
