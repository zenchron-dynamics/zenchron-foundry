name: scheduled-rebuild

# Weekly rebuild of all 10 images into IMMUTABLE dated CANDIDATE tags
# (<fam>:rebuild-<date>-<run>-<attempt>-sha-<short> etc). It NEVER touches
# canonical *-prod tags — stable promotion stays manual via release.yml after a
# human compares the candidate. Candidates are signed under THIS workflow's
# identity (scheduled-rebuild.yml), which policies/cosign-identities.yaml keeps
# DISTINCT from rc-publisher — so a candidate can never satisfy production RC
# verification.
on:
  schedule:
    - cron: "0 4 * * 1"        # Monday 04:00 UTC (after scan-images at 03:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared verbatim with publish-rc.yml — see the rationale there. A rebuild must
  # never hold the cosign slot while a release is publishing.
  group: org-cosign-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: bash scripts/assert-pinned-actions.sh
      - run: bash scripts/assert-image-matrix.sh
      - run: bash scripts/verify-base-images.sh
      - name: Validate vulnerability-exception policy before building
        run: bash scripts/validate-vulnerability-exceptions.sh

  rebuild:
    needs: preflight
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      packages: write          # candidate (rebuild-*) tags only — never *-prod
      id-token: write          # keyless cosign for candidates (distinct identity)
      # NOTE: NO `issues: write` here — issue reporting is a separate least-priv job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fam: php-fpm,        ver: "8.3", ctx: "images/php-fpm/8.3" }
          - { fam: php-fpm,        ver: "8.4", ctx: "images/php-fpm/8.4" }
          - { fam: php-cli,        ver: "8.3", ctx: "images/php-cli/8.3" }
          - { fam: php-cli,        ver: "8.4", ctx: "images/php-cli/8.4" }
          - { fam: php-worker,     ver: "8.3", ctx: "images/php-worker/8.3" }
          - { fam: php-worker,     ver: "8.4", ctx: "images/php-worker/8.4" }
          - { fam: php-frankenphp, ver: "8.3", ctx: "images/php-frankenphp/8.3" }
          - { fam: php-frankenphp, ver: "8.4", ctx: "images/php-frankenphp/8.4" }
          - { fam: caddy,          ver: "prod", ctx: "images/caddy" }
          - { fam: nginx,          ver: "prod", ctx: "images/nginx" }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2   # scripts use v2 sign-blob semantics (.sig/.pem); cosign v3 defaults to the bundle format
          # Per-job install dir: the self-hosted runners share one $HOME, so the
          # default ~/.cosign lets concurrent jobs rm/mv over each other mid-install.
          install-dir: ${{ runner.temp }}/cosign

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immutable candidate tag (never canonical) + base digest
        id: meta
        run: |
          set -euo pipefail
          base="${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}"
          date_tag="$(date -u +%Y.%m.%d)"
          short="$(printf '%s' "${{ github.sha }}" | cut -c1-12)"
          stamp="${date_tag}-${{ github.run_id }}-${{ github.run_attempt }}-sha-${short}"
          if [ "${{ matrix.ver }}" = "prod" ]; then
            tag="${base}:rebuild-${stamp}"
          else
            tag="${base}:${{ matrix.ver }}-rebuild-${stamp}"
          fi
          # Pinned base image digest (dedup key for issue reporting).
          basedg="$(grep -oE 'sha256:[0-9a-f]{64}' '${{ matrix.ctx }}/Dockerfile' | head -1)"
          {
            echo "tag=${tag}"
            echo "base_digest=${basedg:-unknown}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push candidate (multi-arch, signed, attested)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          sbom: true
          provenance: mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Cosign sign candidate (scheduled-rebuild identity)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${NAMESPACE}/${{ matrix.fam }}@${DIGEST}"

      - name: Scan candidate (fixable CRITICAL/HIGH)
        id: scan
        continue-on-error: true     # a finding should REPORT, not abort the matrix
        run: |
          set -euo pipefail
          docker run --rm -e TRIVY_NO_PROGRESS=true -v "$PWD:/work" -w /work \
            aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 \
            image "${{ steps.meta.outputs.tag }}" \
            --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --ignorefile policies/.trivyignore

      - name: Record finding (for the separate reporting job)
        if: steps.scan.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p rebuild-findings
          # Dedup key = image family/ver @ pinned base digest. Same base across
          # weeks -> one issue. (ponytail: base-digest granularity; per-CVE dedup
          # if the noise ever warrants parsing the Trivy report.)
          cat > "rebuild-findings/${{ matrix.fam }}-${{ matrix.ver }}.txt" <<EOF
          fam=${{ matrix.fam }}
          ver=${{ matrix.ver }}
          tag=${{ steps.meta.outputs.tag }}
          base_digest=${{ steps.meta.outputs.base_digest }}
          key=${{ matrix.fam }}/${{ matrix.ver }}@${{ steps.meta.outputs.base_digest }}
          EOF

      - name: Upload findings
        if: steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-findings-${{ matrix.fam }}-${{ matrix.ver }}
          path: rebuild-findings/
          if-no-files-found: ignore


  # Least-privilege reporting job: the ONLY job with `issues: write`. Dedupes by
  # the family/ver@base-digest key so a persistent base does not spam issues.
  report:
    needs: rebuild
    if: always()
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download all findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: all-findings
          pattern: rebuild-findings-*
          merge-multiple: true
        continue-on-error: true
      - name: Open deduplicated issues on new fixable findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const dir = 'all-findings';
            if (!fs.existsSync(dir)) { core.info('no findings'); return; }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.txt'));
            if (!files.length) { core.info('no findings'); return; }
            // existing open issues labelled scheduled-rebuild -> dedup by key marker.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'scheduled-rebuild', per_page: 100,
            });
            const seen = new Set(existing.map(i => (i.body || '').match(/rebuild-key:\s*(\S+)/)?.[1]).filter(Boolean));
            for (const f of files) {
              const kv = Object.fromEntries(fs.readFileSync(`${dir}/${f}`, 'utf8')
                .split('\n').map(l => l.split('=')).filter(a => a.length === 2).map(([k, v]) => [k.trim(), v.trim()]));
              if (!kv.key || seen.has(kv.key)) { core.info(`skip (dup/no-key): ${kv.key||f}`); continue; }
              seen.add(kv.key);
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Scheduled rebuild: fixable CRITICAL/HIGH in ${kv.fam}/${kv.ver}`,
                labels: ['security', 'scheduled-rebuild'],
                body: `Candidate \`${kv.tag}\` reports fixable CRITICAL/HIGH the current stable may not.\n\n`
                    + `rebuild-key: ${kv.key}\n\n`
                    + `Review, then promote via the release workflow if appropriate. `
                    + `See docs/vulnerability-management.md and docs/release-process.md.`,
              });
              core.info(`opened issue for ${kv.key}`);
            }
