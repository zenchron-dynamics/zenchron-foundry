name: stage-and-authorize

# ---------------------------------------------------------------------------
# Build every image, push it to the PRIVATE quarantine package, evaluate it by
# digest, and emit a post-build authorization record. Then STOP.
#
# WHY AUTHORIZATION MOVED AFTER THE BUILD. The old gate ran in preflight, before
# anything existed, so it could not see the child digests or the vulnerability
# database the scan actually used. It refused every publish outright — honest,
# but not a control. Authorization has to happen where the facts are.
#
# WHAT THIS WORKFLOW DOES NOT DO, deliberately:
#   * no production package is ever addressed — the only destination is the
#     private foundry-staging package, and the repository token is empirically
#     unable to write production packages anyway
#     (docs/audits/package-acl-2026-08-03/, run 30837370041);
#   * no public tag, no stable tag, no convenience alias;
#   * no multi-platform index — each child is pushed as an exact platform
#     manifest, because the record is about specific child digests;
#   * NO SIGNING and no id-token. Signing belongs with the immutable RC
#     manifest, once that manifest exists. Mixing OIDC signing into the build is
#     the coupling this refactor removes.
#
# The record authorizes exactly one thing: these staged child digests are
# eligible as inputs to an immutable RC manifest. `public_exposure_authorized`
# is always false.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          One platform per run. Only architectures with reconciliation evidence
          can be AUTHORIZED, and today that is linux/amd64 only. linux/arm64 is
          accepted as input and will build, stage, scan and record all ten
          children, then be REFUSED by the authorizer for lack of evidence —
          that refusal is the point of the #139 evidence-acquisition run, not a
          malfunction. Its per-child records are what the ledger decision is
          made from.
        type: string
        default: "linux/amd64"
      native_arm64_evidence_run:
        # THE #111 BINDING, ON THE CANONICAL RELEASE PATH.
        #
        # policies/native-arch-requirements.yaml sets
        # release_gate.require_native_arm64: true. That flag used to be inert
        # here — assert-native-arch-evidence.sh was invoked by the native smoke
        # workflow and by no release-gating workflow, so an arm64 run built
        # entirely on QEMU evidence was authorized without the boundary ever
        # being consulted. This input is how the evidence reaches the gate.
        #
        # It is the run id of a `native arm64 smoke (#111)` run dispatched with
        # a candidate_evidence set covering these digests. Leaving it empty while
        # requesting linux/arm64 does NOT skip the gate: the authorizer refuses,
        # by name, for want of native evidence.
        description: >-
          Workflow run id of the native arm64 smoke that evidenced these exact
          candidate digests. Required whenever platforms includes linux/arm64.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: stage-and-authorize-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics
  STAGING_PACKAGE: ghcr.io/zenchron-dynamics/foundry-staging
  TRIVY_IMAGE: aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500

jobs:
  # -------------------------------------------------------------------------
  # Ref guard FIRST, on a GitHub-hosted runner, before any self-hosted job and
  # before anything holds packages: write. workflow_dispatch lets the operator
  # pick any ref, so without this a branch copy of this file could stage images
  # and emit a record that reads as authoritative.
  #
  # This guards against ACCIDENTAL branch dispatch. It is not proof of anything:
  # a workflow cannot vouch for its own identity. A consumer of the record must
  # independently verify the run through the GitHub API.
  # -------------------------------------------------------------------------
  guard:
    name: refuse any ref but the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      created: ${{ steps.stamp.outputs.created }}
      source_date_epoch: ${{ steps.stamp.outputs.source_date_epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_children: ${{ steps.plan.outputs.expected_children }}
      platform_count: ${{ steps.plan.outputs.platform_count }}
      started_at: ${{ steps.plan.outputs.started_at }}
    steps:
      - name: Refuse a non-default ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/master" ] \
            || { echo "REFUSE: dispatch from master only, got '${REF}'" >&2; exit 1; }
          echo "OK: running from ${REF}"

      # The stamp step below reads the commit with git, so this job needs a work
      # tree. It did not have one: the guard was a pure ref-string check, and the
      # SOURCE_DATE_EPOCH step was added to it without a checkout. Every dispatch
      # died here with `fatal: not a git repository` (run 31696927539) before any
      # image was built — fail-closed, but the workflow could never run at all.
      #
      # Nothing caught it because this workflow is workflow_dispatch-only, so no
      # push CI run ever executes this job. tests/release/test_workflow_git_needs_checkout.sh
      # is the standing check for the class.
      #
      # fetch-depth: 1 is enough — the stamp reads exactly one commit, the one
      # being built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Derive the build timestamp from the SOURCE COMMIT
        id: stamp
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH, from the commit being built (#101).
          #
          # This was a wall-clock `date -u`. github.event.repository.updated_at,
          # which build-images.yml used, is worse still: it is repository
          # metadata that drifts for reasons unrelated to any build. Both mean
          # rebuilding the SAME COMMIT produces a different
          # org.opencontainers.image.created, therefore a different image config,
          # therefore a different digest — for reasons that have nothing to do
          # with the code.
          #
          # The committer timestamp is a property OF the source: the same commit
          # yields the same value forever, on any runner, at any time.
          epoch="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          case "$epoch" in
            ''|*[!0-9]*) echo "REFUSE: could not derive SOURCE_DATE_EPOCH from ${GITHUB_SHA}" >&2; exit 1 ;;
          esac
          created="$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "created=${created}"
            echo "source_date_epoch=${epoch}"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${epoch} (${created}) from commit ${GITHUB_SHA}"

      # -----------------------------------------------------------------------
      # CHEAP PREFLIGHT, then the matrix. Both before any builder exists.
      #
      # The acceptance matrix is enumerated by
      # scripts/release/build-acceptance-matrix.sh — ONE implementation, shared
      # with the tests, deriving images from MATRIX_IMAGES. The ten hardcoded
      # entries this replaces were a second source of truth for the shipping
      # matrix with nothing asserting the two agreed, and they had no platform
      # axis at all, which is why a two-platform dispatch could not produce 20
      # children.
      #
      # A malformed platform list now costs seconds here instead of a matrix of
      # refusals. Platform AUTHORIZATION is deliberately NOT checked here: that
      # stays in the authorizer, after the children, so an unevidenced
      # architecture still builds and records evidence before being refused —
      # which is how #139's arm64 evidence was acquired. Shape early, authority
      # late, on purpose.
      # -----------------------------------------------------------------------
      - name: Validate the request and plan the matrix
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          m="$(bash scripts/release/build-acceptance-matrix.sh "$PLATFORMS")"
          n="$(printf '%s' "$m" | jq '.include|length')"
          np="$(printf '%s' "$m" | jq -r '[.include[].platform]|unique|length')"
          # Belt and braces: the authorizer computes expected_children the same
          # way from EXPECTED_PLATFORMS, and a disagreement between the plan and
          # the judge would be the kind of arithmetic drift that produces a PASS
          # over the wrong number of children.
          images="$(bash -c '. scripts/lib/common.sh; matrix_images | wc -l' | tr -d ' ')"
          [ "$n" -eq $(( images * np )) ] \
            || { echo "REFUSE: planned $n children != ${images} images x ${np} platforms" >&2; exit 1; }
          {
            echo "matrix=${m}"
            echo "expected_children=${n}"
            echo "platform_count=${np}"
            echo "started_at=$(date -u +%s)"
          } >> "$GITHUB_OUTPUT"
          echo "planned ${n} children = ${images} images x ${np} platform(s)"
          printf '%s' "$m" | jq -r '.include[]|"  \(.fam):\(.ver) \(.platform)"'

  # -------------------------------------------------------------------------
  # One database for the whole run. Ten jobs each resolving their own snapshot
  # would let a single authorization record combine findings judged against
  # different vulnerability knowledge states.
  # -------------------------------------------------------------------------
  freeze-db:
    name: freeze the vulnerability database
    needs: guard
    runs-on: [self-hosted, linux, x64, zenchron]
    # One ~107 MB download plus a tar. Observed under two minutes; 30 caps a
    # hung mirror instead of holding a trusted runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      identity: ${{ steps.freeze.outputs.identity }}
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download and freeze the database
        id: freeze
        run: |
          set -euo pipefail
          rm -rf trivy-cache && mkdir -p trivy-cache
          n=0
          until docker run --rm -v "$PWD/trivy-cache:/root/.cache/trivy" \
                  "${TRIVY_IMAGE}" image --download-db-only; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "REFUSE: cannot download the vulnerability database"; exit 1; }
            echo "db download attempt $n failed; retrying in 15s"; sleep 15
          done
          # NO JAVA DATABASE IS FETCHED, deliberately.
          #
          # Trivy initialises the java-db only when its jar analyzer finds a Java
          # artifact. No Foundry image ships one: the four gettext-base libintl
          # jars that used to sit in nginx are deleted at build time, and the
          # Dockerfile REFUSEs if any jar/war/ear/par/jmod survives.
          #
          # The previous attempt at this froze the java-db alongside the
          # vulnerability DB. That was the wrong fix. The java-db is 905 MiB
          # compressed and 1.5 GB unpacked, so freezing it means pushing a ~1 GB
          # artifact through all ten stage jobs on a 2 vCPU / 4 GB runner with a
          # history of disk exhaustion — and run 31749810234 never even got that
          # far, because mirror.gcr.io/aquasec/trivy-java-db:1 returned 404 on
          # the layer fetch three times running. Removing the four files that
          # create the requirement is cheaper than shipping a database to scan
          # them.
          #
          # This still fails CLOSED. If an image ever does ship a Java artifact,
          # the build refuses it; if one slipped past the build, the child's scan
          # would FATAL under --skip-java-db-update, produce no report, and
          # reconciliation would refuse rather than treat a missing scan as
          # clean. Neither path can silently pass.
          meta=trivy-cache/db/metadata.json
          [ -s "$meta" ] || { echo "REFUSE: no database metadata after download"; exit 1; }
          # Canonical identity: the fields that describe the SNAPSHOT. DownloadedAt
          # is deliberately excluded — it records when we fetched it, not which
          # database it is, and including it would make every job disagree.
          identity="$(jq -r '"v\(.Version)+updated:\(.UpdatedAt)+next:\(.NextUpdate)"' "$meta")"
          case "$identity" in
            *null*|"") echo "REFUSE: database metadata is incomplete: $(cat "$meta")"; exit 1 ;;
          esac
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "frozen database: ${identity}"
          tar -czf trivy-db.tar.gz -C trivy-cache .

      - name: Upload the frozen database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-db.tar.gz
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # Build the exact platform child, stage it, then evaluate THAT DIGEST.
  # -------------------------------------------------------------------------
  stage:
    name: stage ${{ matrix.fam }}/${{ matrix.ver }} (${{ matrix.platform }})
    needs: [guard, freeze-db]
    runs-on: [self-hosted, linux, x64, zenchron]
    # A hung QEMU child would otherwise sit until GitHub's 360-minute default.
    # The slowest observed emulated child (php-frankenphp on arm64) ran ~53
    # minutes in run 31941819983, so 150 leaves ample headroom while capping a
    # wedged job at a quarter of the old ceiling. Serialised, that is the
    # difference between a lost afternoon and a lost day of runner time.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write        # staging package only; production is denied by ACL
    env:
      # CI-COST-01 phase telemetry. One log per child job; the timer refuses to
      # run without it, so a missing log fails loudly rather than reporting
      # silent zero-duration work.
      PHASE_LOG: ${{ github.workspace }}/phase-timings.tsv
    strategy:
      fail-fast: false
      # Serialized: the host is 2 vCPU / 4 GB and buildkit + Trivy resident twice
      # over is an OOM, not a speedup. Raising this for the 20-child run was
      # considered and REJECTED without a resource model — see
      # docs/ci-cost-baseline.md; it is recorded as a measured optimisation
      # target rather than guessed at.
      max-parallel: 1
      # ONE enumeration, produced by the guard from
      # scripts/release/build-acceptance-matrix.sh and shared with the tests.
      # This replaces ten hardcoded entries that duplicated MATRIX_IMAGES and
      # carried no platform axis — the reason a two-platform dispatch could not
      # produce 20 children.
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      # CHILD WALL CLOCK — the job's FIRST executable step, before any measured
      # phase. Its own step on purpose: the reset block below is byte-identical
      # across 12 workflows and scripts/ci/assert-canonical-reset-block.sh fails
      # on any drift, so carrying the clock inside it would trade one guard for
      # another.
      #
      # The clock used to start in "Staging identity", which runs AFTER
      # db_acquire. Correct phase measurements then summed to more than the wall
      # time they were nested in, the timer's one-directional invariant refused,
      # and every child in run 32123758374 recorded timing_available:false. The
      # invariant was right; the clock was started too late.
      #
      # This is IN-JOB time only. Queue time and runner provisioning before this
      # step are not observable from here and remain unavailable, never zero.
      - name: Start the child wall clock
        run: |
          set -euo pipefail
          echo "CHILD_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: phase start db_acquire
        run: bash scripts/ci/phase-timer.sh start db_acquire
      - name: Download the frozen database
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: trivy-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore and re-verify the frozen database
        env:
          EXPECTED_DB: ${{ needs.freeze-db.outputs.identity }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_DB" ] || { echo "REFUSE: the run has no frozen database identity"; exit 1; }
          rm -rf trivy-cache && mkdir -p trivy-cache
          tar -xzf trivy-db.tar.gz -C trivy-cache
          got="$(jq -r '"v\(.Version)+updated:\(.UpdatedAt)+next:\(.NextUpdate)"' trivy-cache/db/metadata.json)"
          # The child records what it ACTUALLY used, and the aggregate compares
          # every child against the run's snapshot. Checking here too means a
          # mismatch fails at the point of use, with the image named.
          [ "$got" = "$EXPECTED_DB" ] \
            || { echo "REFUSE: restored database '$got' != frozen '$EXPECTED_DB'"; exit 1; }
          echo "using frozen database: $got"

      - name: phase end db_acquire
        run: bash scripts/ci/phase-timer.sh end db_acquire
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Staging identity
        id: id
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          # THE PER-CHILD PLATFORM, from the matrix — not the raw dispatch input.
          #
          # This was `inputs.platforms`, so a two-platform dispatch handed every
          # child "linux/amd64,linux/arm64" and every child refused below. The
          # guard below is unchanged and still correct; what changed is that the
          # value it guards is now a single platform by construction, because the
          # matrix has a platform axis.
          PLATFORMS: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          # Exactly one platform per child, enforced at the CHILD boundary.
          # The record is about specific child digests, so a comma-separated
          # build would produce a multi-platform INDEX and the recorded digest
          # would identify the wrong object. With the matrix supplying one
          # platform per entry this should be unreachable — it is kept precisely
          # so that a future change which reintroduces a list fails here instead
          # of silently staging an index.
          case "$PLATFORMS" in
            *,*) echo "REFUSE: one platform per child; got '$PLATFORMS'"; exit 1 ;;
            linux/*) : ;;
            *) echo "REFUSE: '$PLATFORMS' is not a linux/<arch> platform"; exit 1 ;;
          esac
          arch="${PLATFORMS#linux/}"
          # EXECUTION MODE (#139). Whether the target architecture is the
          # runner's own or reached through binfmt/QEMU is a property of the
          # evidence, not a footnote: "built for arm64" and "built ON arm64" are
          # different claims, and #111's native-arm64 runtime concern is NOT
          # satisfied by emulation. Derived from the runner rather than declared,
          # so it cannot drift from what actually happened.
          case "$(uname -m)" in
            x86_64|amd64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) host_arch="$(uname -m)" ;;
          esac
          if [ "$host_arch" = "$arch" ]; then exec_mode=native; else exec_mode=qemu; fi
          echo "target=${arch} host=${host_arch} execution=${exec_mode}"
          label="$(image_label "$FAM" "$VER")"          # e.g. php-fpm/8.3, nginx/prod
          # PLATFORM-BOUND child identity. `label` answers "which image"; it is
          # NOT a child identity, because one image yields one child per
          # platform. See child_slug() in scripts/lib/common.sh.
          slug="$(child_slug "$FAM" "$VER" "$PLATFORMS")"
          ckey="$(child_key "$FAM" "$VER" "$PLATFORMS")"
          # The staging TAG keeps using the image-derived slug and appends the
          # arch itself. Feeding it the platform-bound child slug would produce
          # php-fpm-8.3-linux-amd64-...-amd64 — the architecture twice, and a tag
          # format every downstream identity check already asserts.
          tagslug="${label//\//-}"
          tag="${tagslug}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-s${GITHUB_SHA:0:7}-${arch}"
          # The OCI version label is NOT the canonical identity (#126). Each
          # Dockerfile declares org.opencontainers.image.version itself — "prod"
          # for the edge images, "<ver>-prod" for the PHP families — and a build
          # label that disagrees with the image's own Dockerfile is exactly the
          # metadata contradiction #126 is about. `prod` must stay `prod`;
          # hardcoding "${VER}-prod" would produce "prod-prod" for nginx/caddy.
          if [ "$VER" = prod ]; then version_label="prod"; else version_label="${VER}-prod"; fi
          {
            echo "label=${label}"
            echo "slug=${slug}"
            echo "child_key=${ckey}"
            echo "arch=${arch}"
            echo "platform=${PLATFORMS}"
            echo "tag=${tag}"
            echo "ref=${STAGING_PACKAGE}:${tag}"
            echo "version_label=${version_label}"
            echo "exec_mode=${exec_mode}"
            echo "host_arch=${host_arch}"
          } >> "$GITHUB_OUTPUT"

      - name: phase start build_and_push
        run: bash scripts/ci/phase-timer.sh start build_and_push
      - name: Build the exact platform child and stage it
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.ctx }}
          platforms: ${{ steps.id.outputs.platform }}
          tags: ${{ steps.id.outputs.ref }}
          # Both OFF on purpose: either one makes buildx push an index with an
          # attestation manifest, and then the digest names the index rather than
          # the platform child this record is about. SBOM generation belongs with
          # the RC manifest.
          sbom: false
          provenance: false
          # DETERMINISTIC LAYER TIMESTAMPS (#101).
          #
          # `push: true` is GONE from this step on purpose — it is not missing.
          # `outputs:` REPLACES that shorthand rather than adding to it, so
          # `push=true` here IS the push, and leaving both would be the
          # contradiction. Getting this wrong stops the workflow pushing while it
          # still reports success, which is why it was left unwired until it
          # could be driven against a real registry.
          #
          # SOURCE_DATE_EPOCH alone only fixes the config `created` field;
          # rewrite-timestamp is what rewrites layer mtimes, and without it two
          # builds of one commit differ in every layer for no reason in the
          # source.
          #
          # Proven by scripts/verify-staging-export.sh against a disposable
          # registry, driving this exact exporter string: the tag resolves, the
          # resolved object is an image manifest and not an index, it is pullable
          # by digest, the config architecture matches, `created` is
          # epoch-derived, and two isolated --no-cache builds are byte-identical.
          # tests/release/test_staging_exporter.sh fails CI if rewrite-timestamp
          # is ever set without push semantics.
          outputs: type=image,push=true,rewrite-timestamp=true
          build-args: |
            BUILD_DATE=${{ needs.guard.outputs.created }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.source_date_epoch }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ needs.guard.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.id.outputs.version_label }}
            org.opencontainers.image.ref.name=${{ steps.id.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: phase end build_and_push
        run: bash scripts/ci/phase-timer.sh end build_and_push
      - name: phase start digest_resolve
        run: bash scripts/ci/phase-timer.sh start digest_resolve
      - name: Resolve the staged digest independently
        id: resolve
        env:
          REF: ${{ steps.id.outputs.ref }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          is_digest "$BUILD_DIGEST" || die "build digest '$BUILD_DIGEST' is not sha256:<64-hex>"
          # The builder's own output is not registry evidence. Ask the registry
          # what it serves for this tag.
          resolved="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null | tr -d '[:space:]')"
          is_digest "$resolved" || die "the registry did not resolve '$REF' to a digest"
          [ "$resolved" = "$BUILD_DIGEST" ] \
            || die "staging tag resolves to '$resolved' but the build produced '$BUILD_DIGEST'"

          # Equal digests do not prove the object is a platform CHILD. An index
          # can be pulled with --platform, inspected and scanned, so every check
          # downstream would pass while the record described the index. sbom and
          # provenance are off, which makes an index unlikely — not impossible.
          # Read the media type from the registry object itself.
          mtype="$(docker buildx imagetools inspect "$REF" --raw 2>/dev/null | jq -r '.mediaType // ""')"
          case "$mtype" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json) : ;;
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              die "staged object is an INDEX ($mtype); the record must describe a platform child" ;;
            *) die "could not read a usable manifest media type from the registry (got '${mtype:-<empty>}')" ;;
          esac
          {
            echo "digest=${resolved}"
            echo "digest_ref=${STAGING_PACKAGE}@${resolved}"
            echo "media_type=${mtype}"
          } >> "$GITHUB_OUTPUT"
          echo "staged and resolved: ${STAGING_PACKAGE}@${resolved}"

      - name: Read staging visibility
        id: vis
        env:
          # The repository token cannot read organization package metadata; the
          # read-only audit credential can. An unreadable visibility is recorded
          # as 'unreadable' and refused downstream — never assumed private.
          AUDIT_TOKEN: ${{ secrets.PACKAGES_AUDIT_TOKEN }}
        run: |
          set -uo pipefail
          v="$(GH_TOKEN="${AUDIT_TOKEN:-}" gh api \
                 "orgs/${NAMESPACE}/packages/container/foundry-staging" \
                 --jq '.visibility' 2>/dev/null)" || v=""
          echo "visibility=${v:-unreadable}" >> "$GITHUB_OUTPUT"

      - name: phase end digest_resolve
        run: bash scripts/ci/phase-timer.sh end digest_resolve
      - name: phase start pull_by_digest
        run: bash scripts/ci/phase-timer.sh start pull_by_digest
      - name: Pull the staged child by digest
        env:
          DIGEST_REF: ${{ steps.resolve.outputs.digest_ref }}
        run: |
          set -euo pipefail
          # Everything below evaluates THIS object, not a local rebuild.
          docker pull --platform "${{ steps.id.outputs.platform }}" "$DIGEST_REF"

      - name: phase end pull_by_digest
        run: bash scripts/ci/phase-timer.sh end pull_by_digest

      # -------------------------------------------------------------------
      # THE CANDIDATE BILL OF MATERIALS, PRODUCED AGAINST THE STAGED DIGEST.
      #
      # This is the input the image half of the licence gate had never had. That
      # gate shipped fail-closed and ci.yml ran it as `--self-test` only, so it
      # gated no image: nothing in this repository ever produced an SBOM of a
      # release candidate for it to read. The gate is named where it is INVOKED,
      # in the licence-authorization job, and deliberately not here — a name in
      # a comment is not an invocation, and the pinned predicate that looks for
      # one must not be satisfiable by prose.
      # tests/integration/test_evidence_path_e2e.sh pinned that as
      # "no workflow invokes the IMAGE-SBOM licence gate against a real
      # inventory".
      #
      # It runs against $DIGEST_REF — the digest the REGISTRY resolved and the
      # media-type check proved is a platform child — never against the tag and
      # never against a local rebuild. An SBOM of something other than the
      # staged object licenses something other than the candidate.
      #
      # It is written INSIDE evidence/child, before the Evaluate step computes
      # evidence_sha256 over that directory. The SBOM bytes are therefore
      # covered by the same checksum the aggregator RECOMPUTES and the
      # authorization record binds — an SBOM outside that coverage would be a
      # document anyone could replace after the decision.
      # -------------------------------------------------------------------
      - name: Install syft (pinned)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Produce the candidate SBOM and bind it to the staged digest
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          PLATFORM: ${{ steps.id.outputs.platform }}
          CHILD_KEY: ${{ steps.id.outputs.child_key }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          DIGEST_REF: ${{ steps.resolve.outputs.digest_ref }}
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          mkdir -p evidence/child/sbom evidence/child/sbom-bindings
          # The identity is the PRODUCER's, from the one function the consumer
          # also calls. Never a name spelled here.
          IMAGE="$DIGEST_REF" FAMILY="$FAM" VERSION="$VER" PLATFORM="$PLATFORM" \
            OUT=evidence/child/sbom \
            bash scripts/generate-sbom.sh
          slug="$(child_slug "$FAM" "$VER" "$PLATFORM")"
          docs="$(cd evidence/child/sbom && for f in "$slug".*.json; do
                    printf '%s\t%s\n' "$f" "$(shasum -a 256 "$f" | cut -d' ' -f1)"
                  done)"
          jq -n --arg ck "$CHILD_KEY" --arg fam "$FAM" --arg ver "$VER" \
                --arg plat "$PLATFORM" --arg d "$DIGEST" --arg dr "$DIGEST_REF" \
                --arg rev "$GITHUB_SHA" --argjson rid "$GITHUB_RUN_ID" \
                --argjson ratt "$GITHUB_RUN_ATTEMPT" \
                --arg gen "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg docs "$docs" '{
              record_type: "candidate-sbom-binding",
              child_key: $ck, image_family: $fam, image_version: $ver,
              platform: $plat, manifest_digest: $d, digest_reference: $dr,
              source_revision: $rev, workflow_run_id: $rid,
              workflow_run_attempt: $ratt, generated_at: $gen,
              producer: "scripts/generate-sbom.sh",
              documents: ($docs | split("\n") | map(select(length > 0))
                          | map(split("\t")) | map({(.[0]): .[1]}) | add)
            }' > "evidence/child/sbom-bindings/${slug}.binding.json"
          jq . "evidence/child/sbom-bindings/${slug}.binding.json"

      - name: Evaluate the staged child
        id: eval
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          ARCH: ${{ steps.id.outputs.arch }}
          LABEL: ${{ steps.id.outputs.label }}
          TAG: ${{ steps.id.outputs.tag }}
          BUILD_CREATED: ${{ needs.guard.outputs.created }}
          DIGEST_REF: ${{ steps.resolve.outputs.digest_ref }}
        run: |
          set -uo pipefail   # each check records PASS/FAIL rather than aborting
          set +e             # GitHub runs this as `bash -e`; a FAIL is expected here
          mkdir -p evidence/child
          smoke=FAIL scan=FAIL recon=FAIL meta=FAIL carch=""

          # architecture actually baked into the config
          carch="$(docker image inspect "$DIGEST_REF" --format '{{.Architecture}}' 2>/dev/null || echo "")"

          bash scripts/ci/phase-timer.sh start smoke
          echo "::group::smoke"
          if bash "scripts/smoke/smoke-${FAM}.sh" "$DIGEST_REF" > evidence/child/smoke.log 2>&1; then smoke=PASS; fi
          tail -20 evidence/child/smoke.log; echo "smoke=$smoke"
          bash scripts/ci/phase-timer.sh end smoke
          echo "::endgroup::"

          bash scripts/ci/phase-timer.sh start metadata_contract
          echo "::group::metadata contract (#126)"
          contract="contracts/images/${FAM}-${VER}.yaml"
          # Runtime posture AND the full OCI label map. verify-image-contract.sh
          # checks user/ports/healthcheck and exactly one label; on its own it
          # would report PASS while licence, source, base image, support status
          # and created timestamp went unchecked.
          runtime_ok=0; oci_ok=0; nojava_ok=0
          bash scripts/verify-image-contract.sh "$DIGEST_REF" "$contract" > evidence/child/contract.log 2>&1 && runtime_ok=1
          EXPECT_REVISION="$GITHUB_SHA" EXPECT_CREATED="$BUILD_CREATED" EXPECT_REF_NAME="$TAG" \
            bash scripts/release/verify-oci-metadata.sh "$DIGEST_REF" "$contract" \
              evidence/child/oci-labels.json > evidence/child/oci-metadata.log 2>&1 && oci_ok=1
          # The precondition the scan's --skip-dirs depends on, asserted for
          # EVERY child rather than only for nginx. Checked from OUTSIDE the
          # image (docker export | tar -t), so it needs no shell or find inside
          # and cannot be fooled by a broken interpreter; an image that cannot be
          # inspected is REFUSED, not skipped.
          #
          # It belongs to the metadata contract because a jar here means the scan
          # skipped a path that mattered — the finding would be about the
          # evaluation being unsound, not about the image being vulnerable.
          bash scripts/assert-no-java-artifacts.sh "$DIGEST_REF" > evidence/child/no-java.log 2>&1 && nojava_ok=1
          [ "$runtime_ok" = 1 ] && [ "$oci_ok" = 1 ] && [ "$nojava_ok" = 1 ] && meta=PASS
          tail -20 evidence/child/contract.log; tail -20 evidence/child/oci-metadata.log
          cat evidence/child/no-java.log
          echo "metadata_contract=$meta (runtime=$runtime_ok oci=$oci_ok nojava=$nojava_ok)"
          bash scripts/ci/phase-timer.sh end metadata_contract
          echo "::endgroup::"

          bash scripts/ci/phase-timer.sh start vulnerability_scan
          echo "::group::scan against the frozen database"
          # --skip-db-update: the snapshot is fixed for the whole run. Without it
          # a long matrix would silently roll onto a newer database mid-record.
          #
          # --skip-dirs: /usr/share/java and /usr/share/maven-repo hold four
          # gettext-base libintl jars that arrive in the nginx BASE layer. This
          # image deletes them and REFUSEs to build if any survive, so they are
          # not in the shipped filesystem — but Trivy analyses layers, so it
          # still finds them in the base layer and initialises its Java database
          # to look them up. That database is 905 MiB compressed / 1.5 GB on
          # disk, and fetching it is what broke run 31701249058 (scan FATAL, no
          # report) and run 31749810234 (mirror 404 on the layer fetch, three
          # times; the built-in ghcr fallback did not engage).
          #
          # Skipping those two directories loses NO coverage. Verified by
          # scanning the same image both ways: 22 CRITICAL/HIGH with the full
          # java-db, 22 with none and these dirs skipped, and the two ID sets are
          # identical. The jars never contributed a finding — they only
          # contributed a 1.5 GB dependency.
          #
          # This is scoped to two directories, not a disabled analyzer: a jar
          # anywhere else still triggers analysis.
          #
          # The invariant the skip depends on — no Java artifact in the final
          # filesystem — is asserted for EVERY child by
          # scripts/assert-no-java-artifacts.sh below, not just for nginx. The
          # skip is matrix-wide, so the guarantee has to be matrix-wide too;
          # until run 31792482449 it was enforced only in images/nginx/Dockerfile
          # and a php image could have acquired a jar under a skipped path with
          # nothing to catch it.
          if docker run --rm \
               -v "$PWD/trivy-cache:/root/.cache/trivy" \
               -v /var/run/docker.sock:/var/run/docker.sock \
               -v "$PWD:/work" -w /work \
               "${TRIVY_IMAGE}" image "$DIGEST_REF" \
               --skip-db-update --skip-java-db-update \
               --skip-dirs /usr/share/java,/usr/share/maven-repo \
               --list-all-pkgs \
               --severity CRITICAL,HIGH --format json \
               --output evidence/child/trivy.json > evidence/child/scan.log 2>&1; then
            [ -s evidence/child/trivy.json ] && scan=PASS
          fi
          tail -10 evidence/child/scan.log; echo "scan=$scan"
          bash scripts/ci/phase-timer.sh end vulnerability_scan
          echo "::endgroup::"

          bash scripts/ci/phase-timer.sh start package_inventory
          echo "::group::package inventory"
          # --list-all-pkgs above makes the scan report EVERY installed package,
          # not only the vulnerable ones, and this derives a stable sorted
          # inventory from it (#139).
          #
          # Needed because reconciling a second architecture is a comparison
          # problem: deciding whether an amd64 exception transfers to arm64
          # requires the arm64 INSTALLED VERSION of that package, and a finding
          # that simply does not exist on arm64 must not be granted an approval.
          # The vulnerability list alone cannot answer either question — it says
          # nothing about packages that are present and not vulnerable.
          #
          # Derived from the scan rather than by running dpkg/apk inside the
          # image: under emulation that would execute foreign-architecture
          # binaries, and an inventory that depends on the image being runnable
          # is one more thing that can fail for reasons unrelated to content.
          if [ "$scan" = PASS ]; then
            jq -r '[.Results[]? | .Target as $t | (.Packages // [])[]
                    | "\(.Name)\t\(.Version)\t\($t)"] | sort | .[]' \
               evidence/child/trivy.json > evidence/child/packages.tsv 2>/dev/null || true
          fi
          : > evidence/child/packages.tsv.missing
          if [ -s evidence/child/packages.tsv ]; then
            rm -f evidence/child/packages.tsv.missing
            printf 'packages inventoried: %s\n' "$(wc -l < evidence/child/packages.tsv | tr -d ' ')"
            head -5 evidence/child/packages.tsv
          else
            # Do not silently ship an empty inventory: an absent package list
            # would make an arm64 comparison look like "no differences".
            echo "WARNING: no package inventory derived; arm64 reconciliation cannot use this child"
          fi
          echo "::endgroup::"


          bash scripts/ci/phase-timer.sh end package_inventory
          bash scripts/ci/phase-timer.sh start reconciliation
          echo "::group::reconcile against the exception ledger"
          if [ "$scan" = PASS ]; then
            args=(evidence/child/trivy.json "$FAM")
            [ "$VER" != prod ] && args+=("$VER")
            # --arch takes the FULL platform (linux/amd64), not the bare machine
            # name. An exception authorises only the architectures it was
            # reconciled on, so a bare "amd64" matches no ledger entry and every
            # finding reads as ungoverned. In run 31701249058 that turned 1 real
            # ungoverned finding into 37 across every image, and 0 governed:
            #
            #   --arch amd64        -> 37 ungoverned, matched_exception_ids: []
            #   --arch linux/amd64  ->  1 ungoverned
            #
            # It failed CLOSED, so nothing was wrongly authorised — but it made
            # the gate unusable and buried the one finding that was real.
            # scan-images.yml always passed the full platform; only this
            # workflow, which nothing but a dispatch executes, did not.
            if bash scripts/reconcile-vulnerabilities.sh "${args[@]}" \
                 --arch "linux/${ARCH}" --json evidence/child/reconcile.json \
                 > evidence/child/reconcile.log 2>&1; then recon=PASS; fi
            tail -20 evidence/child/reconcile.log
          else
            echo "scan did not produce a report; reconciliation cannot run" > evidence/child/reconcile.log
          fi
          echo "reconciliation=$recon"
          bash scripts/ci/phase-timer.sh end reconciliation
          echo "::endgroup::"

          {
            echo "smoke=$smoke"; echo "scan=$scan"; echo "recon=$recon"
            echo "meta=$meta"; echo "carch=${carch:-unknown}"
          } >> "$GITHUB_OUTPUT"

      # evidence_emit is deliberately NOT an instrumented phase. The step that
      # would close it is the same step that serializes phases.json, so the end
      # could never be observed by the record it produces: every child reported
      # timing_complete:false, a metric that could not succeed. Closing it early
      # would close a phase before its work happened. Its cost is accounted for
      # in uninstrumented_overhead_seconds instead. Re-adding a start/end pair
      # around the emit step is a regression — see
      # tests/release/test_child_clock_and_timing_contract.sh.
      - name: Emit child evidence
        env:
          LABEL: ${{ steps.id.outputs.label }}
          CHILD_SLUG: ${{ steps.id.outputs.slug }}
          CHILD_KEY: ${{ steps.id.outputs.child_key }}
          PLATFORM: ${{ steps.id.outputs.platform }}
          TAG: ${{ steps.id.outputs.tag }}
          DIGEST_REF: ${{ steps.resolve.outputs.digest_ref }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          RESOLVED: ${{ steps.resolve.outputs.digest }}
          MTYPE: ${{ steps.resolve.outputs.media_type }}
          VIS: ${{ steps.vis.outputs.visibility }}
          CARCH: ${{ steps.eval.outputs.carch }}
          EXEC_MODE: ${{ steps.id.outputs.exec_mode }}
          HOST_ARCH: ${{ steps.id.outputs.host_arch }}
          RUNNER_NAME_OBSERVED: ${{ runner.name }}
          DB: ${{ needs.freeze-db.outputs.identity }}
          SMOKE: ${{ steps.eval.outputs.smoke }}
          SCAN: ${{ steps.eval.outputs.scan }}
          RECON: ${{ steps.eval.outputs.recon }}
          META: ${{ steps.eval.outputs.meta }}
        run: |
          set -euo pipefail
          # Checksum over the evidence bundle this record summarizes, so the
          # claim and the artifacts it is derived from cannot drift apart.
          #
          # The SHARED script, not an inline copy. The authorizer recomputes this
          # AFTER the directory has been collected under a different prefix, and
          # a path-dependent hash would differ every time for no real reason.
          # The PLATFORM-BOUND slug, from the identity step. Recomputing it from
          # LABEL here is what produced the collision: LABEL has no platform, so
          # amd64 and arm64 wrote the same filename.
          slug="${CHILD_SLUG:?child slug missing}"
          mkdir -p evidence/out
          # Package count is recorded, not just the file: a child whose inventory
          # failed to derive must be visibly unusable for cross-architecture
          # reconciliation rather than looking like an image with no packages.
          pkgs=0
          [ -s evidence/child/packages.tsv ] && pkgs="$(wc -l < evidence/child/packages.tsv | tr -d ' ')"
          # Wall time for THIS child, from its own clock (CI-COST-01). Recorded
          # in the evidence so the cost baseline is derived from the run itself
          # rather than reconstructed from API timestamps that do not survive
          # artifact retention.
          # CHILD_STARTED_AT arrives from the JOB environment, written by the
          # first step of this job ("Start the child wall clock") via $GITHUB_ENV.
          # It is deliberately NOT a step output: a step-level env: mapping
          # shadows the job environment, and binding it to a step output that no
          # step emits is what zeroed the clock for all twenty children in run
          # 32150666171. Do not reintroduce such a mapping.
          if [ -z "${CHILD_STARTED_AT:-}" ]; then
            echo "::error::CHILD_STARTED_AT is empty at the evidence step — the child wall clock never reached it. Phase telemetry will be recorded as unavailable, not as zero."
            child_seconds=0
          else
            child_seconds=$(( $(date -u +%s) - CHILD_STARTED_AT ))
            [ "$child_seconds" -ge 0 ] || child_seconds=0
          fi
          # PHASE TELEMETRY (CI-COST-01). Written into evidence/child BEFORE the
          # checksum is computed, so the timing is covered by evidence_sha256
          # exactly like every other artifact — a cost claim that is not bound to
          # the evidence it describes is a number anyone can edit.
          #
          # A timing failure is NOT fatal to the child: the vulnerability and
          # runtime verdicts are the release-relevant facts, and losing a
          # stopwatch must not refuse an otherwise sound image. It is recorded as
          # unavailable rather than fabricated as zero.
          # The timer's stderr used to be sent to /dev/null, which turned its
          # deliberate refusal into a silent timing_available:false. The refusal
          # IS the diagnostic — it names which invariant failed (a phase total
          # exceeding wall time, an end before its start, a missing log) — so it
          # is captured and surfaced. Timing stays non-fatal, but never silent.
          timing='{"timing_available": false, "reason": "phase log missing or inconsistent"}'
          timer_err="$(mktemp)"
          if timer_out="$(bash scripts/ci/phase-timer.sh emit "$child_seconds" 2>"$timer_err")"; then
            printf '%s' "$timer_out" > evidence/child/phases.json
            timing="$(jq -c '. + {timing_available: true}' evidence/child/phases.json)"
          else
            # Written from the captured value, not from a partially-redirected
            # stream: a half-written phases.json would be hashed into the
            # evidence checksum as if it were a real measurement.
            printf '%s' "$timing" > evidence/child/phases.json
            echo "::warning::phase timing unavailable for this child: $(tr '\n' ' ' < "$timer_err")"
            cat "$timer_err" >&2
          fi
          rm -f "$timer_err"
          # CHECKSUM LAST. It was computed before phases.json existed, which
          # would have left the timing outside the very binding this comment
          # claims covers it. Everything written into evidence/child must exist
          # before the directory is hashed.
          esum="$(bash scripts/release/evidence-checksum.sh evidence/child)"
          jq -n --arg l "$LABEL" --arg ck "$CHILD_KEY" --arg p "$PLATFORM" --arg t "$TAG" \
                --arg dr "$DIGEST_REF" --arg d "$DIGEST" --arg rd "$RESOLVED" \
                --arg v "$VIS" --arg ca "$CARCH" --arg db "$DB" --arg mtype "$MTYPE" \
                --arg rev "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
                --argjson rid "$GITHUB_RUN_ID" --argjson ratt "$GITHUB_RUN_ATTEMPT" \
                --arg sm "$SMOKE" --arg sc "$SCAN" --arg rc "$RECON" --arg meta "$META" \
                --arg em "$EXEC_MODE" --arg ha "$HOST_ARCH" --argjson pk "$pkgs" \
                --argjson cs "$child_seconds" --arg rn "${RUNNER_NAME_OBSERVED:-unknown}" \
                --argjson tm "$timing" \
                --arg es "$esum" '{
            image_label:$l, child_key:$ck, platform:$p, staging_tag:$t,
            digest_reference:$dr, manifest_digest:$d, manifest_media_type:$mtype,
            tag_resolved_digest:$rd,
            visibility:$v, config_architecture:$ca, trivy_db_identity:$db,
            source_revision:$rev, workflow_run_id:$rid, workflow_run_attempt:$ratt,
            repository:$repo, smoke_test:$sm, scan:$sc, reconciliation:$rc,
            metadata_contract:$meta,
            execution_mode:$em, host_architecture:$ha, packages_inventoried:$pk,
            child_wall_seconds:$cs, runner_name:$rn, phase_timing:$tm,
            evidence_sha256:$es}' > "evidence/out/${slug}.json"
          cp -r evidence/child "evidence/out/${slug}-evidence"
          jq . "evidence/out/${slug}.json"

      - name: Upload child evidence
        # Uploaded even on failure: a refused child is exactly what the operator
        # needs to see.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # PLATFORM-BOUND artifact name. Without it, php-fpm/8.3 on amd64 and on
          # arm64 both uploaded `child-php-fpm-8.3-<run>-<attempt>`, and the
          # authorizer's `merge-multiple: true` download flattened them onto one
          # another — 20 planned children, at most 10 distinct records.
          name: child-${{ steps.id.outputs.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/out/
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The authorization decision. Read-only: it publishes nothing and must not be
  # able to.
  # -------------------------------------------------------------------------
  authorize:
    name: post-build authorization
    # `always()` is LOAD-BEARING for the STAGE results: GitHub skips a dependent
    # job when a needed job fails, so one child failing to build, push, resolve
    # or emit evidence would have skipped authorization entirely — producing
    # neither the PASS nor the promised machine-readable FAIL. The one case where
    # the record matters most is the case that produced none.
    #
    # But `always()` overrides EVERY needs result, including the guard's. On its
    # own it let a dispatch from a non-master ref fail the GitHub-hosted guard
    # and still start this job on the SELF-HOSTED runner, check out that branch,
    # and execute its copy of the authorizer — exactly what the guard exists to
    # prevent. The two results are therefore required explicitly:
    #
    #   guard      MUST have succeeded — nothing self-hosted runs otherwise;
    #   freeze-db  MUST have succeeded — without a frozen snapshot identity there
    #              is no expectation to judge the children against, and this job
    #              would abort on the missing expectation rather than write the
    #              record (see the note in the Authorize step);
    #   stage      deliberately unconstrained — its failures are the findings.
    #
    # `!cancelled()` so a deliberate cancellation stays a cancellation rather
    # than manufacturing a FAIL verdict nobody asked for.
    if: >-
      ${{ always()
          && !cancelled()
          && needs.guard.result == 'success'
          && needs.freeze-db.result == 'success' }}
    needs: [guard, freeze-db, stage]
    runs-on: [self-hosted, linux, x64, zenchron]
    # Collect, judge, checksum, upload. No builds, no scans.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read         # deliberately NOT write, and no id-token
      actions: read          # to fetch the native arm64 evidence artifact (#111)
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare the collection directory
        # Created unconditionally so a run where NO child uploaded anything still
        # reaches the aggregator, which reports every missing matrix entry. An
        # absent directory would abort before the record was written.
        run: mkdir -p collected

      - name: Collect child evidence
        # continue-on-error: with a failed child there may be fewer artifacts
        # than the pattern expects, or none. That is not an infrastructure
        # problem to abort on — it is the finding, and the aggregate states it.
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: child-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected
          merge-multiple: true

      # NATIVE ARM64 EVIDENCE (#111), FETCHED BEFORE THE DECISION.
      #
      # continue-on-error is deliberately NOT set: a download that silently
      # produced nothing would leave an empty directory, and an empty directory
      # is exactly what the gate must not be handed. Either the evidence arrives
      # or this step fails; either way the authorizer never sees a directory it
      # can mistake for coverage. When no run was named, no directory is created
      # and the authorizer refuses by name.
      - name: Fetch the native arm64 runtime evidence
        id: native
        if: ${{ inputs.native_arm64_evidence_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.native_arm64_evidence_run }}
        run: |
          set -euo pipefail
          rm -rf native-evidence && mkdir -p native-evidence
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'native-arm64-evidence-*' --dir native-evidence
          # The artifact unpacks into a per-artifact subdirectory; the gate reads
          # a flat directory, so the records are collected to the top level.
          find native-evidence -mindepth 2 -name '*.json' -exec mv {} native-evidence/ \;
          n="$(find native-evidence -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          echo "native evidence records: $n"
          [ "$n" -gt 0 ] || {
            echo "REFUSE: run $RUN_ID produced no native evidence records."; exit 1; }
          echo "dir=native-evidence" >> "$GITHUB_OUTPUT"

      - name: Authorize
        env:
          # Empty when no run was named. The authorizer treats an empty value as
          # "no native evidence presented" and REFUSES whenever the policy makes
          # it mandatory — it does not treat it as "not applicable".
          NATIVE_EVIDENCE_DIR: ${{ steps.native.outputs.dir }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_PLATFORMS: ${{ inputs.platforms }}
          EXPECTED_STAGING_PACKAGE: ${{ env.STAGING_PACKAGE }}
          # Never empty: this job only runs when freeze-db succeeded.
          #
          # The earlier note here claimed the aggregator would "refuse an empty
          # expectation", implying a FAIL record. It would not: a missing
          # mandatory expectation calls die(), which exits BEFORE the record is
          # written. The contract is now explicit instead — an infrastructure
          # failure before authorization produces NO authorization record, and
          # the absence of a record is not a refusal to be interpreted. Only a
          # completed evaluation yields PASS or FAIL.
          EXPECTED_TRIVY_DB: ${{ needs.freeze-db.outputs.identity }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BUILD_CREATED: ${{ needs.guard.outputs.created }}
        run: |
          set -uo pipefail
          # `set +e` is LOAD-BEARING. GitHub runs this block as `bash -e {0}`, so
          # errexit is already on. A REFUSED authorization is an expected outcome
          # here — the aggregator writes its FAIL record and exits non-zero — and
          # under errexit that exit would abort the step before the record was
          # checksummed, losing the reasons exactly when they are needed. The
          # step's own exit status is set explicitly at the end.
          set +e
          mkdir -p authorization/child-evidence authorization/records
          # Only the top-level per-child records go to the aggregator; the raw
          # logs travel alongside as the bundle the checksums cover.
          find collected -maxdepth 1 -name '*.json' -exec cp {} authorization/child-evidence/ \;
          find collected -maxdepth 1 -type d -name '*-evidence' -exec cp -r {} authorization/child-evidence/ \;
          find authorization/child-evidence -maxdepth 1 -name '*.json' -exec cp {} authorization/records/ \;

          # EVIDENCE_ROOT is the directory the aggregator RECOMPUTES each child's
          # evidence checksum against. Without it the checksum was only
          # shape-checked, so any invented 64-hex value passed.
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          EVIDENCE_ROOT=authorization/child-evidence \
            bash scripts/release/authorize-staged-candidates.sh \
              authorization/records authorization/post-build-authorization.json
          rc=$?
          echo "$rc" > authorization/aggregate.rc

          echo "::group::authorization record"
          jq . authorization/post-build-authorization.json
          echo "::endgroup::"

      # =====================================================================
      # LICENCE AUTHORIZATION — the image half and the repository half, on one
      # run, with BOTH required, and the composed verdict fed INTO the canonical
      # authorization decision below.
      #
      # THE GAP THIS CLOSES. assert-license-policy.sh has shipped as a
      # fail-closed licence gate since #120 and NO workflow ever ran it against
      # a candidate image. ci.yml carried exactly one licence-policy line and it
      # was `--self-test`: the gate testing itself. An earlier assertion that
      # grepped the workflow directory matched that one line and reported the
      # gate as wired — literally true, substantively false, and pinned in
      # tests/integration/test_evidence_path_e2e.sh as
      #
      #     GAP - no workflow invokes the IMAGE-SBOM licence gate against a real
      #           inventory
      #
      # It is HERE, in the authorize job, and not in a job of its own on purpose.
      # A downstream job that files a verdict in an artifact repeats the original
      # defect one layer out: a step whose output nothing reads is
      # indistinguishable from a step that did not run. Here the verdict is bound
      # to this record's sha256, consumed by validate-authorization-record.sh
      # --require-licence-authorization, covered by the same SHA256SUMS, and the
      # job's exit status is a function of it.
      #
      # WHY BOTH HALVES. An image SBOM enumerates what is INSIDE the image and
      # cannot see repository material — 832 lines copied verbatim from Moby sat
      # unattributed under a first-party filename exactly there. The
      # repository-material inventory cannot see what a base image ships.
      # Neither is a superset of the other:
      #
      #   image evidence, empty repository verdict -> RM-REPOSITORY-EVIDENCE-ABSENT
      #   repository evidence, no image evidence   -> RM-IMAGE-EVIDENCE-ABSENT
      #   either half refused                      -> AR-LICENCE-REFUSED
      #   no licence evidence at all               -> AR-LICENCE-EVIDENCE-ABSENT
      #
      # ABSENT IS A REFUSAL, NEVER A SKIP. None of these steps carries a
      # condition that can turn missing evidence into a green run.
      #
      # PUBLICATION STAYS REFUSED. This authorizes nothing for exposure and the
      # validator refuses a licence record that claims otherwise. If publication
      # is ever re-enabled, it cannot proceed without both evidence classes.
      # =====================================================================
      - name: Ensure the licence validators, refusing to run degraded
        # The repository-material half reads YAML and the record validator reads
        # JSON Schema. A missing library must NOT turn into a skipped gate: that
        # is the fail-open shape this whole change exists to remove, so the
        # install is attempted once and its absence afterwards is a refusal.
        run: |
          set -uo pipefail
          if ! python3 -c 'import yaml, jsonschema' 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check --user \
              'PyYAML==6.0.2' 'jsonschema==4.23.0' || true
          fi
          python3 -c 'import yaml, jsonschema' || {
            echo "REFUSE: PyYAML/jsonschema unavailable; the licence gates would silently weaken" >&2
            exit 1; }

      - name: Flatten the candidate SBOM set
        # The SBOMs travel INSIDE each child's evidence directory, so they are
        # covered by that child's evidence_sha256 — the checksum the aggregator
        # RECOMPUTES against EVIDENCE_ROOT. They are flattened here because the
        # gate reads one directory, and the flattening REFUSES a collision rather
        # than letting one child's document overwrite another's.
        run: |
          set -euo pipefail
          rm -rf authorization/sbom authorization/sbom-bindings
          mkdir -p authorization/sbom authorization/sbom-bindings
          n=0
          while IFS= read -r f; do
            b="$(basename "$f")"
            if [ -e "authorization/sbom/$b" ]; then
              echo "REFUSE: two children claim the SBOM document $b" >&2; exit 1
            fi
            cp "$f" "authorization/sbom/$b"; n=$((n + 1))
          done < <(find authorization/child-evidence -path '*/sbom/*.json' -type f | sort)
          while IFS= read -r f; do
            b="$(basename "$f")"
            if [ -e "authorization/sbom-bindings/$b" ]; then
              echo "REFUSE: two children claim the binding record $b" >&2; exit 1
            fi
            cp "$f" "authorization/sbom-bindings/$b"
          done < <(find authorization/child-evidence -path '*/sbom-bindings/*.json' -type f | sort)
          echo "candidate SBOM documents: $n"
          echo "binding records: $(find authorization/sbom-bindings -name '*.json' | wc -l | tr -d ' ')"

      - name: Gate — bind the candidate SBOMs to the staged digests
        id: lic_bind
        # `always()` so a failure upstream cannot turn missing licence evidence
        # into a SKIPPED step and a green run. Absent evidence must reach the
        # refusal, not bypass it.
        if: always()
        env:
          AUTH_RECORD: authorization/post-build-authorization.json
          SBOM_DIR: authorization/sbom
          BINDING_DIR: authorization/sbom-bindings
          IMAGE_INVENTORY: authorization/licence/image-inventory.json
        run: |
          # `set +e` is LOAD-BEARING: GitHub runs this as `bash -e {0}`, and a
          # REFUSED licence verdict is an expected outcome. Under errexit the
          # refusal would abort before the result was recorded, losing the
          # diagnostic exactly when it is needed.
          set -uo pipefail; set +e
          mkdir -p authorization/licence
          bash scripts/license/assert-image-sbom-licences.sh \
            --authorization "$AUTH_RECORD" \
            --sbom-dir "$SBOM_DIR" \
            --binding-dir "$BINDING_DIR" \
            --out "$IMAGE_INVENTORY"
          rc=$?
          echo "$rc" > authorization/licence/bind.rc
          exit "$rc"

      - name: Gate — image-SBOM licence policy over the candidate inventory
        id: lic_policy
        if: always()
        env:
          IMAGE_INVENTORY: authorization/licence/image-inventory.json
          EXPECT_REVISION: ${{ github.sha }}
        run: |
          set -uo pipefail; set +e   # see the note on the binding gate above
          mkdir -p authorization/licence
          bash scripts/license/assert-license-policy.sh \
            --inventory "$IMAGE_INVENTORY" \
            --require-image-binding \
            --expect-source-revision "$EXPECT_REVISION"
          rc=$?
          echo "$rc" > authorization/licence/image-policy.rc
          exit "$rc"

      - name: Gate — repository material composed with the image evidence
        id: lic_composed
        if: always()
        env:
          IMAGE_INVENTORY: authorization/licence/image-inventory.json
          MATERIAL_INVENTORY: policies/repository-material.yaml
        run: |
          set -uo pipefail; set +e   # see the note on the binding gate above
          mkdir -p authorization/licence
          bash scripts/license/assert-repository-material.sh \
            --inventory "$MATERIAL_INVENTORY" \
            --image-inventory "$IMAGE_INVENTORY" \
            --require-image-evidence
          rc=$?
          echo "$rc" > authorization/licence/composed.rc
          exit "$rc"

      - name: Record the composed licence authorization
        id: lic_decide
        if: always()
        env:
          BIND: ${{ steps.lic_bind.outcome }}
          IMAGE_POLICY: ${{ steps.lic_policy.outcome }}
          COMPOSED: ${{ steps.lic_composed.outcome }}
          AUTH_RECORD: authorization/post-build-authorization.json
          IMAGE_INVENTORY: authorization/licence/image-inventory.json
          MATERIAL_INVENTORY: policies/repository-material.yaml
          LICENCE_RECORD: authorization/licence/licence-authorization.json
        run: |
          set -uo pipefail; set +e   # see the note on the binding gate above
          mkdir -p authorization/licence
          verdict=REFUSED
          if [ "$BIND" = success ] && [ "$IMAGE_POLICY" = success ] \
             && [ "$COMPOSED" = success ]; then verdict=PASS; fi
          rev="$(jq -r '.source_revision // ""' "$AUTH_RECORD" 2>/dev/null)"
          rsha="$(shasum -a 256 "$AUTH_RECORD" | cut -d' ' -f1)"
          bound="$(jq -r '.image_binding.children_bound // 0' "$IMAGE_INVENTORY" 2>/dev/null || echo 0)"
          expected="$(jq -r '.image_binding.children_expected // 0' "$IMAGE_INVENTORY" 2>/dev/null || echo 0)"
          modes="$(jq -c '.image_binding.execution_modes // []' "$IMAGE_INVENTORY" 2>/dev/null || echo '[]')"
          jq -n --arg v "$verdict" --arg b "$BIND" --arg p "$IMAGE_POLICY" \
                --arg c "$COMPOSED" --arg rev "$rev" --arg rsha "$rsha" \
                --argjson bound "${bound:-0}" --argjson expected "${expected:-0}" \
                --argjson modes "${modes:-[]}" \
                --arg mi "$MATERIAL_INVENTORY" '{
              record_type: "licence-authorization",
              schema_version: 1,
              verdict: $v,
              source_revision: $rev,
              authorization_record_sha256: $rsha,
              image_half: {
                gate: "scripts/license/assert-license-policy.sh",
                binding: $b, policy: $p,
                children_bound: $bound, children_expected: $expected,
                execution_modes: $modes
              },
              repository_half: {
                gate: "scripts/license/assert-repository-material.sh",
                inventory: $mi, composed: $c
              },
              both_halves_required: true,
              public_exposure_authorized: false
            }' > "$LICENCE_RECORD"
          jq . "$LICENCE_RECORD"
          # The record is written for PASS and for REFUSED alike. A refusal that
          # produces no record is a refusal nobody can read afterwards, which is
          # the retention failure the evidence bundle exists for. The refusal is
          # ENFORCED one step below, by the validator that consumes it.
          echo "licence authorization: $verdict (bind=$BIND image-policy=$IMAGE_POLICY composed=$COMPOSED)"

      # =====================================================================
      # THE DISTRIBUTION-NOTICE AND SOURCE-OBLIGATION BUNDLE.
      #
      # A LICENCE VERDICT IS NOT A NOTICE. The gates above answer "is every
      # component accounted for". #120 also asks for "third-party notices and
      # ... corresponding license texts/source-offer obligations", and a
      # candidate can satisfy the first while owing every one of the second:
      # nothing above carries a licence TEXT, retains an upstream NOTICE, or
      # knows that 162 components in this cohort carry a reciprocal obligation
      # whose corresponding source nobody has arranged to deliver.
      #
      # The bundle is written under authorization/notice/ and NEVER as a root
      # NOTICE file. A root NOTICE beside a LICENSE that declares itself a
      # placeholder would read as Foundry's own outbound terms, which are
      # undetermined (#98). This says what the CANDIDATE IMAGES carry.
      #
      # Its verdict is consumed one step below by
      # validate-authorization-record.sh --require-notice-bundle, it is inside
      # the same SHA256SUMS coverage, and the job's exit status is a function
      # of it. A step whose output nothing reads is indistinguishable from a
      # step that did not run.
      # =====================================================================
      - name: Gate — produce the distribution-notice and source-obligation bundle
        id: notice
        if: always()
        env:
          AUTH_RECORD: authorization/post-build-authorization.json
          IMAGE_INVENTORY: authorization/licence/image-inventory.json
          MATERIAL_INVENTORY: policies/repository-material.yaml
          LICENCE_POLICY: policies/license-policy.yaml
          LICENCE_TEXTS: third-party/licence-texts/PROVENANCE.yaml
          ATTESTATIONS: policies/upstream-licence-attestations.yaml
          SOURCE_OBLIGATIONS: policies/source-obligations.yaml
          NOTICE_DIR: authorization/notice
        run: |
          # `set +e` is LOAD-BEARING, exactly as on the licence gates above: a
          # REFUSED notice bundle is an expected outcome and the draft must be
          # WRITTEN before the refusal is acted on. A refusal that produces
          # nothing is a refusal nobody can read afterwards.
          set -uo pipefail; set +e
          mkdir -p "$NOTICE_DIR"
          python3 scripts/license/generate-notice-bundle.py \
            --inventory "$IMAGE_INVENTORY" \
            --authorization "$AUTH_RECORD" \
            --material "$MATERIAL_INVENTORY" \
            --policy "$LICENCE_POLICY" \
            --licence-texts "$LICENCE_TEXTS" \
            --attestations "$ATTESTATIONS" \
            --source-obligations "$SOURCE_OBLIGATIONS" \
            --out-dir "$NOTICE_DIR"
          rc=$?
          echo "$rc" > authorization/notice.rc
          exit "$rc"

      - name: Validate the authorization record, CONSUMING the licence verdict
        id: schema
        if: always()
        env:
          AUTH_RECORD: authorization/post-build-authorization.json
          LICENCE_RECORD: authorization/licence/licence-authorization.json
          NOTICE_BUNDLE: authorization/notice/notice-manifest.json
        run: |
          set -uo pipefail; set +e
          # The schema is enforced HERE, in the producer, not only in tests and
          # not only by some future consumer. The aggregator decides the verdict
          # from the evidence; the schema constrains the shape, including fields
          # the aggregator never inspects. Both must hold, for PASS and for FAIL
          # alike — a malformed FAIL record is as useless as a malformed PASS.
          #
          # --require-licence-authorization is what makes the licence verdict an
          # INPUT to this decision rather than a report filed beside it: the
          # canonical record does not validate unless a composed licence
          # authorization is present, PASSING, and bound to this record's sha256
          # and source revision. An absent one REFUSES; it never skips.
          #
          # --require-notice-bundle is the same shape one control further out:
          # a licence PASS is insufficient without a COMPLETE notice and
          # source-obligation bundle, a notice PASS cannot override a refused
          # licence verdict, and publication authority refuses INDEPENDENTLY of
          # both. That last one is why this step refuses today and will keep
          # refusing until an owner records a distribution decision in
          # policies/license-policy.yaml (#98). It is the fail-closed behaviour,
          # not a defect in it.
          bash scripts/release/validate-authorization-record.sh \
            "$AUTH_RECORD" \
            --require-licence-authorization "$LICENCE_RECORD" \
            --require-notice-bundle "$NOTICE_BUNDLE"
          schema_rc=$?
          echo "$schema_rc" > authorization/schema.rc
          [ "$schema_rc" -eq 0 ] \
            || echo "::error::the authorization record is not schema-valid, or its licence authorization or notice bundle is absent, incomplete or refused"
          exit 0

      - name: Seal and gate the authorization evidence
        id: seal
        if: always()
        run: |
          set -uo pipefail; set +e
          # Written to a temporary file first: reading and writing SHA256SUMS in
          # one pipeline would race with its own output. The licence records are
          # inside authorization/, so the same checksum covers them — a verdict
          # outside that coverage is a document anyone could replace afterwards.
          ( cd authorization \
            && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > .sums.tmp \
            && mv .sums.tmp SHA256SUMS )
          rc="$(cat authorization/aggregate.rc 2>/dev/null || echo 1)"
          schema_rc="$(cat authorization/schema.rc 2>/dev/null || echo 1)"
          echo "aggregate rc=$rc, schema+licence rc=$schema_rc"
          # Either failure fails the job, and the evidence bundle uploads either
          # way (the upload step is if: always()).
          [ "$rc" -eq 0 ] && [ "$schema_rc" -eq 0 ]

      - name: Upload the authorization record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-build-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: authorization/
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          f=authorization/post-build-authorization.json
          [ -s "$f" ] || { echo "no authorization record was produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Post-build authorization"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| verdict | \`$(jq -r .verdict "$f")\` |"
            echo "| scope | \`$(jq -r .authorization_scope "$f")\` |"
            echo "| public exposure authorized | \`$(jq -r .public_exposure_authorized "$f")\` |"
            echo "| children | $(jq -r '.children|length' "$f") / $(jq -r .expected_matrix.expected_children "$f") |"
            echo "| native-arch gate (#111) | \`$(jq -r .native_arch_gate.verdict "$f")\` ($(jq -r .native_arch_gate.covered_images "$f")/$(jq -r .native_arch_gate.expected_images "$f") images) |"
            echo "| database snapshot | \`$(jq -r .trivy_db_snapshot.identity "$f")\` |"
            # The licence verdict is reported from the RECORD, not from a step
            # outcome: what a reader needs is the fact the validator consumed.
            l=authorization/licence/licence-authorization.json
            if [ -s "$l" ]; then
              echo "| licence authorization | \`$(jq -r .verdict "$l")\` (image $(jq -r .image_half.children_bound "$l")/$(jq -r .image_half.children_expected "$l") bound, repository $(jq -r .repository_half.composed "$l")) |"
            else
              echo "| licence authorization | \`NO RECORD\` |"
            fi
            # Reported from the BUNDLE, not from a step outcome: what a reader
            # needs is the fact the validator consumed.
            n=authorization/notice/notice-manifest.json
            if [ -s "$n" ]; then
              echo "| notice bundle (#120) | \`$(jq -r .verdict "$n")\` / \`$(jq -r .status "$n")\` ($(jq -r .finding_count "$n") finding(s)) |"
              echo "| publication authority (#98) | \`$(jq -r .publication_authority_present "$n")\` |"
            else
              echo "| notice bundle (#120) | \`NO BUNDLE\` |"
            fi
            echo
            echo "Staged only to \`$(jq -r .staging_package "$f")\`. No production package, no public tag, no index, no signature."
            # --- COST BASELINE (CI-COST-01) --------------------------------
            # Derived from the children's own recorded wall time, so it survives
            # artifact retention and does not depend on scraping the API later.
            # Split by execution mode because emulation is the critical path and
            # a single average would hide it.
            echo
            echo "### Cost baseline"
            echo
            echo "| metric | value |"
            echo "|---|---|"
            jq -r '
              [.children[] | select((.child_wall_seconds // 0) > 0)] as $c
              | ($c | map(.child_wall_seconds) | add // 0) as $tot
              | [$c[] | select(.execution_mode=="native")] as $nat
              | [$c[] | select(.execution_mode=="qemu")]   as $emu
              | "| children with timing | \($c|length) / \(.children|length) |",
                "| total child wall time | \(($tot/60)|floor) min |",
                "| native children | \($nat|length), \((( ($nat|map(.child_wall_seconds)|add // 0) / (if ($nat|length)>0 then ($nat|length) else 1 end))/60)|floor) min avg |",
                "| emulated children | \($emu|length), \((( ($emu|map(.child_wall_seconds)|add // 0) / (if ($emu|length)>0 then ($emu|length) else 1 end))/60)|floor) min avg |",
                "| slowest child | \(($c|max_by(.child_wall_seconds)|.image_label) // "n/a") (\((($c|map(.child_wall_seconds)|max // 0)/60)|floor) min) |",
                "| runners used | \([$c[].runner_name]|unique|join(", ")) |"
            ' "$f"
            # PHASE BREAKDOWN (CI-COST-01). Derived from the children's own
            # recorded phases, so it survives artifact retention. Children whose
            # timing is unavailable are counted separately rather than folded in
            # as zero-duration work.
            echo
            echo "### Phase breakdown"
            echo
            jq -r '
              [.children[] | select(.phase_timing.timing_available == true)] as $t
              | if ($t|length) == 0 then
                  "No child reported phase timing (records predate CI-COST-01)."
                else
                  "| phase | total s | share of measured |",
                  "|---|---|---|",
                  ( [$t[].phase_timing.phases | to_entries[]]
                    | group_by(.key)
                    | map({k: .[0].key, v: (map(.value) | add)})
                    | (map(.v) | add) as $sum
                    | sort_by(-.v)[]
                    | "| \(.k) | \(.v) | \(((.v * 100) / (if $sum > 0 then $sum else 1 end)) | floor)% |"
                  ),
                  "",
                  "children with timing: \($t|length) / \(.children|length)",
                  "uninstrumented overhead: \([$t[].phase_timing.uninstrumented_overhead_seconds] | add) s",
                  "queue time: unavailable (not observable from inside a job)"
                end
            ' "$f"
            echo
            echo "Emulated children dominate the critical path; \`max-parallel: 1\` is preserved deliberately (2 vCPU / 4 GB host). See \`docs/ci-cost-baseline.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
