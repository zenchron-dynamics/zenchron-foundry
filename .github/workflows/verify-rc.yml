name: verify-rc

# Ten-image runtime + multi-architecture certification. Cold-builds every image
# from a clean builder, runs its runtime smoke test AND its machine-readable
# contract check, and (when an RC is published) verifies each RC digest is a
# manifest list carrying linux/amd64 + linux/arm64. Acceptance is strict 10/10 —
# no representative subset satisfies the gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC version to also verify published digests for (optional), vYYYY.MM.DD[.N]"
        required: false
      rc:
        description: "RC identifier (optional), rc<N>"
        required: false
      expected_revision:
        description: "40-hex revision the published RC digests must carry (optional)"
        required: false
  workflow_call:
    inputs:
      version: { type: string, required: false }
      rc: { type: string, required: false }
      expected_revision: { type: string, required: false }

permissions:
  contents: read

concurrency:
  group: verify-rc-${{ github.ref }}-${{ inputs.version || github.event.inputs.version || 'adhoc' }}
  cancel-in-progress: true

jobs:
  # Cold build + runtime smoke + contract check, one job per image (10/10).
  certify:
    runs-on: [self-hosted, linux, x64, zenchron]
    strategy:
      fail-fast: false          # every image is reported; no early abort
      max-parallel: 1           # serial matrix on the single self-hosted runner
      matrix:
        include:
          - { fam: php-cli,        ver: "8.3", ctx: images/php-cli/8.3,        smoke: smoke-php-cli.sh }
          - { fam: php-cli,        ver: "8.4", ctx: images/php-cli/8.4,        smoke: smoke-php-cli.sh }
          - { fam: php-fpm,        ver: "8.3", ctx: images/php-fpm/8.3,        smoke: smoke-php-fpm.sh }
          - { fam: php-fpm,        ver: "8.4", ctx: images/php-fpm/8.4,        smoke: smoke-php-fpm.sh }
          - { fam: php-worker,     ver: "8.3", ctx: images/php-worker/8.3,     smoke: smoke-php-worker.sh }
          - { fam: php-worker,     ver: "8.4", ctx: images/php-worker/8.4,     smoke: smoke-php-worker.sh }
          - { fam: php-frankenphp, ver: "8.3", ctx: images/php-frankenphp/8.3, smoke: smoke-php-frankenphp.sh }
          - { fam: php-frankenphp, ver: "8.4", ctx: images/php-frankenphp/8.4, smoke: smoke-php-frankenphp.sh }
          - { fam: nginx,          ver: prod,   ctx: images/nginx,             smoke: smoke-nginx.sh }
          - { fam: caddy,          ver: prod,   ctx: images/caddy,             smoke: smoke-caddy.sh }
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cold build (clean builder, load locally, no push)
        id: build
        env:
          MATRIX_KEY: ${{ matrix.fam }}-${{ matrix.ver }}
        run: |
          set -euo pipefail
          builder="$(GITHUB_WORKFLOW='${{ github.workflow }}' GITHUB_RUN_ID='${{ github.run_id }}' \
                     GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' MATRIX_KEY="$MATRIX_KEY" \
                     bash scripts/ci/cleanup-docker-job.sh name)"
          docker buildx create --name "$builder" --use
          docker buildx build --builder "$builder" --load \
            -t "zf-verify/${{ matrix.fam }}:${{ matrix.ver }}" "${{ matrix.ctx }}"

      - name: Runtime smoke test
        id: smoke
        run: bash "scripts/smoke/${{ matrix.smoke }}" "zf-verify/${{ matrix.fam }}:${{ matrix.ver }}"

      - name: Contract check (config metadata vs contracts/images)
        id: contract
        env:
          SKIP_OCI_LABEL: "1"   # revision label is stamped at publish, not on local cold build
        run: |
          set -euo pipefail
          c="contracts/images/${{ matrix.fam }}-${{ matrix.ver }}.yaml"
          bash scripts/verify-image-contract.sh "zf-verify/${{ matrix.fam }}:${{ matrix.ver }}" "$c"

      # WF-03/RA-06: per-image result line with REAL step outcomes (recorded on
      # failure too), assembled into verify-rc-results.json by `certified`.
      - name: Record certification result (real outcomes)
        if: always()
        env:
          FAM: ${{ matrix.fam }}
          VER: ${{ matrix.ver }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail
          # Cold builds are local-only, so the digest recorded here is the local
          # image ID; published RC digests are certified by the platforms leg.
          id="$(docker image inspect -f '{{.Id}}' "zf-verify/${FAM}:${VER}" 2>/dev/null || echo unavailable)"
          mkdir -p verify-rc-results
          jq -n --arg image "${FAM}-${VER}" --arg digest "$id" \
            --arg build "$BUILD_OUTCOME" --arg smoke "$SMOKE_OUTCOME" --arg contract "$CONTRACT_OUTCOME" \
            '{image: $image, digest: $digest, build: $build, smoke: $smoke, contract: $contract}' \
            > "verify-rc-results/${FAM}-${VER}.json"
          cat "verify-rc-results/${FAM}-${VER}.json"

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-rc-result-${{ matrix.fam }}-${{ matrix.ver }}
          path: verify-rc-results/
          if-no-files-found: error

      - name: Cleanup Docker (job-scoped)
        if: always()
        env:
          MATRIX_KEY: ${{ matrix.fam }}-${{ matrix.ver }}
        run: bash scripts/ci/cleanup-docker-job.sh

  # Multi-arch certification of PUBLISHED RC digests (only when an RC is given).
  platforms:
    if: ${{ (inputs.version || github.event.inputs.version) != '' && (inputs.rc || github.event.inputs.rc) != '' }}
    runs-on: [self-hosted, linux, x64, zenchron]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify amd64 + arm64 on every published RC digest (10/10)
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          RC: ${{ inputs.rc || github.event.inputs.rc }}
          EXPECTED_REVISION: ${{ inputs.expected_revision || github.event.inputs.expected_revision }}
        run: |
          set -euo pipefail
          . scripts/lib/registry-aliases.sh
          n=0
          for t in $MATRIX_IMAGES; do
            fam="${t%:*}"; sel="${t#*:}"
            imm="$(immutable_rc_suffix "$sel" "$VERSION" "$RC" "$EXPECTED_REVISION")"
            bash scripts/verify-platforms.sh "$NS/$fam:$imm"
            n=$((n+1))
          done
          test "$n" -eq 10 || { echo "REFUSE: expected 10 images, checked $n"; exit 1; }
          echo "MULTI-ARCH OK: 10/10 RC digests carry amd64 + arm64"

  # Aggregate gate — always runs, fails unless both legs fully succeeded.
  # Named so it can become a required check later. The 10-image matrix COUNT is
  # enforced by scripts/assert-image-matrix.sh in ci (the matrix above derives
  # from the same source); this job gates on the RESULTS of both legs.
  certified:
    needs: [certify, platforms]
    if: always()
    runs-on: [self-hosted, linux, x64, zenchron]
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-download)
        # Canonical source: scripts/ci/reset-workspace-ownership.sh (_safe_workspace
        # guards). Inline because it must run BEFORE checkout puts that script on
        # disk. Do NOT edit this copy alone: every workflow carries the same block,
        # and scripts/ci/assert-canonical-reset-block.sh fails CI on any drift.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          # Guards from the canonical script: canonicalize via realpath so a
          # symlinked workspace cannot escape the runner root; refuse root paths.
          ws="$(realpath "$ws")"; root="$(realpath "$root")"
          case "$ws" in ""|"/"|"//") echo "REFUSE: workspace resolves to a root path: '$ws'" >&2; exit 1 ;; esac
          case "$root" in ""|"/"|"//") echo "REFUSE: runner root resolves to a root path: '$root'" >&2; exit 1 ;; esac
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      # No checkout in this job -> no `git clean` — scrub stale results left on
      # the persistent self-hosted workspace by earlier runs before downloading.
      - name: Scrub stale results (persistent workspace, no checkout here)
        run: rm -rf verify-rc-results verify-rc-results.json
      # Assembly runs BEFORE the gate step so the structured results exist even
      # when a leg failed — the gate below is unchanged and still fails loud.
      - name: Download per-image certification results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: verify-rc-results
          pattern: verify-rc-result-*
          merge-multiple: true
      - name: Assemble verify-rc-results.json (real per-image + platforms results)
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          RC: ${{ inputs.rc || github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # Per-image entries are the REAL step outcomes each certify leg
          # recorded (incl. failures); the leg results come from the needs
          # context, not hand-written literals.
          jq -s --arg certify "$CERTIFY_RESULT" --arg platforms "$PLATFORMS_RESULT" \
                --arg version "$VERSION" --arg rc "$RC" \
            '{version: $version, rc: $rc,
              certify_result: $certify, platforms_result: $platforms,
              image_count: length, images: sort_by(.image)}' \
            verify-rc-results/*.json > verify-rc-results.json
          cat verify-rc-results.json
      - name: Upload verify-rc-results.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-rc-results
          path: verify-rc-results.json
          if-no-files-found: error
      - name: Both certification legs must have succeeded
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          RC: ${{ inputs.rc || github.event.inputs.rc }}
        run: |
          set -euo pipefail
          echo "certify=$CERTIFY_RESULT platforms=$PLATFORMS_RESULT"
          [ "$CERTIFY_RESULT" = "success" ] \
            || { echo "REFUSE: certify matrix result is '$CERTIFY_RESULT', not success"; exit 1; }
          case "$PLATFORMS_RESULT" in
            success) : ;;
            # platforms only runs when an RC is named; ad-hoc (input-less) runs
            # legitimately skip it — but an RC run may NEVER skip it.
            skipped) [ -z "${VERSION}${RC}" ] \
                       || { echo "REFUSE: platforms leg skipped although an RC was named"; exit 1; }
                     echo "platforms leg skipped (no RC inputs) — cold-build certification only" ;;
            *) echo "REFUSE: platforms leg result is '$PLATFORMS_RESULT', not success"; exit 1 ;;
          esac
          echo "CERTIFIED: all verification legs green"
