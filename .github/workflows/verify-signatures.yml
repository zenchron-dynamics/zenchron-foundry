name: verify-signatures

# Manual, post-release supply-chain verification. Invokes the SINGLE strict
# verifier (scripts/verify-image-release-identity.sh) so this workflow does not
# drift into a weaker parallel implementation: it checks signature + issuer +
# identity, SBOM, SLSA provenance, provenance source repo + revision, the OCI
# revision label, and multi-arch — and binds every image to an expected commit.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Expected 40-hex source commit the images must be built from"
        required: true
      repo:
        description: "Expected source repo owner/name"
        default: "zenchron-dynamics/zenchron-foundry"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  NAMESPACE: zenchron-dynamics
  IDENTITY_RE: "https://github.com/zenchron-dynamics/zenchron-foundry/.*"
  ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, zenchron]
    timeout-minutes: 12          # never hang on Rekor backoff
    strategy:
      fail-fast: false
      # Sigstore's public-good Rekor rate-limits bursts; verify a few at a time.
      max-parallel: 4
      matrix:
        ref:
          - php-fpm:8.3-prod
          - php-fpm:8.4-prod
          - php-cli:8.3-prod
          - php-cli:8.4-prod
          - php-worker:8.3-prod
          - php-worker:8.4-prod
          - php-frankenphp:8.3-prod
          - php-frankenphp:8.4-prod
          - caddy:prod
          - nginx:prod
    steps:
      - name: Reset workspace ownership (self-hosted hygiene, pre-checkout)
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"; root="${RUNNER_WORKSPACE:?}"
          case "$ws" in "$root"|"$root"/*) : ;; *) echo "REFUSE: workspace '$ws' outside runner root '$root'" >&2; exit 1 ;; esac
          # Unconditionally reclaim the WHOLE tree: a nested root-owned .git/ left by a
          # prior container step blocks checkout even when $ws itself looks ours.
          if [ "$(id -u)" -eq 0 ]; then chown -R "$(id -u):$(id -g)" "$ws"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then sudo -n chown -R "$(id -u):$(id -g)" "$ws"
          else echo "ERROR: '$ws' not owned by $(id -u) and cannot elevate" >&2; exit 1; fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release identity
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_REPO: ${{ inputs.repo }}
          IDENTITY_RE: ${{ env.IDENTITY_RE }}
          ISSUER: ${{ env.ISSUER }}
        run: bash scripts/verify-image-release-identity.sh "${REGISTRY}/${NAMESPACE}/${{ matrix.ref }}"
