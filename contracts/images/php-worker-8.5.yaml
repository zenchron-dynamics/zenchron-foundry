# Runtime contract — php-worker 8.5. Machine-read by verify-image-contract.sh.
image: php-worker
selector: "8.5"
php_version: "8.5"
user: "10001:10001"
non_root: true
read_only_rootfs: true
tmpfs: [/tmp]
ports: []
healthcheck: true
pid1: tini
heartbeat_file: /tmp/worker-heartbeat
graceful_sigterm_seconds: 9
forbidden_tools: [apk, gcc, make, phpize]
oci_revision_label: required

# --- hardened runtime contract (#110) ---------------------------------------
# Only the facts the harness cannot DERIVE. Identity (`user`), the writable set
# (`tmpfs`) and the expected listeners (`ports`) are declared above and are read
# from there — restating them here would create a second place to drift.
#   mode                  server  = long-running; the probe runs via docker exec
#                                   and reads /proc/1, the REAL entrypoint process
#                         oneshot = the probe itself runs as PID 1
#   run_args              command needed to keep the image running, when its own
#                         default CMD exits
#   stop_signal           the signal PID 1 must handle gracefully
#   graceful_stop_seconds how long it may take to exit after that signal
runtime:
  mode: server
  run_args: ["sh", "-c", "while :; do sleep 1; done"]
  stop_signal: SIGTERM
  graceful_stop_seconds: 15

# Expected STATIC OCI metadata (#126). Checked against the label map read
# from the staged image. Dynamic values (version, created, revision,
# ref.name) are supplied by the run and compared against the run itself,
# so they are deliberately absent here.
#
# Seeded from the Dockerfile, but this is the REVIEWED EXPECTATION, not a
# mirror of it: changing a licence, source or base image in the Dockerfile
# without changing this file is exactly the drift the gate exists to catch.
oci_static:
  "org.opencontainers.image.title": "zenchron-php-worker"
  "org.opencontainers.image.description": "Hardened PHP 8.5 worker runtime (queue/messenger), Debian-based"
  "org.opencontainers.image.vendor": "Zenchron Dynamics"
  "org.opencontainers.image.source": "https://github.com/zenchron-dynamics/zenchron-foundry"
  "org.opencontainers.image.base.name": "docker.io/library/php:8.5-cli-bookworm"
  "org.opencontainers.image.licenses": "LicenseRef-Zenchron-Internal"
  "com.zenchron.base": "debian-bookworm"
  "com.zenchron.php": "8.5"
  "com.zenchron.runtime": "php-worker"
  "com.zenchron.support": "supported"
  "com.zenchron.support_state": "active"

# The version label this image must carry. `prod` stays `prod` — hardcoding
# "<selector>-prod" is what produced "prod-prod" for the edge images.
oci_version_label: "8.5-prod"
