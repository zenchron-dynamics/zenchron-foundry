; Zenchron Dynamics — LEGACY production PHP settings (php-fpm 7.4, EOL).
; No JIT (7.4 lacks it). Otherwise mirrors supported-line hardening.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 16M
post_max_size = 16M

date.timezone = UTC
allow_url_fopen = On
allow_url_include = Off
disable_functions = pcntl_exec,exec,passthru,shell_exec,system,proc_open,popen,dl
cgi.fix_pathinfo = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.save_path = "/tmp/php-sessions"

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
