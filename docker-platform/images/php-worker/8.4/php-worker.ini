; Zenchron Dynamics — production PHP worker settings (8.3)
; Long-running CLI process. Bound memory; rely on --max-time/--memory-limit in
; the worker command for periodic recycling (prevents leak accumulation).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Hard ceiling. The worker should self-restart BELOW this via --memory-limit.
memory_limit = 256M
max_execution_time = 0          ; long-running; control lifetime via worker flags

date.timezone = UTC
allow_url_fopen = On
allow_url_include = Off

; pcntl signals required for graceful shutdown — do NOT disable these here.
; (php-fpm disables pcntl_* ; worker MUST keep them.)
