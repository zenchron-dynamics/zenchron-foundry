services:
  app:
    build:
      context: .
    image: example-frankenphp:local
    ports: ["8080:8080", "8443:8443"]
    environment:
      SERVER_NAME: ":8080"
      APP_ENV: production
    # Debian FrankenPHP keeps all writable state under /tmp
    # (XDG_DATA_HOME=/tmp/caddy-data, XDG_CONFIG_HOME=/tmp/caddy-config), so a
    # single tmpfs satisfies a read-only rootfs. If you enable Caddy ACME
    # (internet-facing + NET_BIND_SERVICE), mount a named volume at
    # /tmp/caddy-data instead so issued certs persist across restarts.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    networks: [frontend]

networks:
  frontend:
