# Production overrides for the Symfony example. Pin images by verified digest.
services:
  php-fpm:
    image: ghcr.io/zenchron-dynamics/php-fpm@sha256:REPLACE_WITH_DIGEST
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m

  nginx:
    image: ghcr.io/zenchron-dynamics/nginx@sha256:REPLACE_WITH_DIGEST
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev

  worker:
    image: ghcr.io/zenchron-dynamics/php-worker@sha256:REPLACE_WITH_DIGEST
    deploy:
      replicas: 3
    restart: unless-stopped
    stop_grace_period: 35s
    # Liveness heartbeat (see docs/worker-runtime.md). For true work-liveness,
    # set WORKER_HEARTBEAT_AUTO=0 and emit a heartbeat from a Messenger listener.
    environment:
      WORKER_HEARTBEAT_AUTO: "1"
      WORKER_HEARTBEAT_MAX_AGE: "120"
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
