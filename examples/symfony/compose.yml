# Example Symfony stack. Layer security/readonly/symfony profiles for hardening.
services:
  php-fpm:
    build:
      context: .
    image: example-symfony:local
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - app-var:/app/var
    networks: [backend]

  nginx:
    image: ghcr.io/zenchron-dynamics/nginx:prod
    depends_on:
      php-fpm:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./public:/app/public:ro
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
    networks: [frontend, backend]

  worker:
    image: ghcr.io/zenchron-dynamics/php-worker:8.3-prod
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=200M", "--limit=1000"]
    stop_grace_period: 35s
    volumes:
      - app-var:/app/var
    depends_on: [php-fpm]
    networks: [backend]

volumes:
  app-var:

networks:
  frontend:
  backend:
    internal: true
