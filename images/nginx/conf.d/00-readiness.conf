# =============================================================================
# Zenchron Dynamics — always-on readiness/liveness listener (#127).
#
# WHY THIS EXISTS. The container healthcheck used to be `nginx -t -q`, which
# parses the configuration files and exits. It proves the config is syntactically
# valid. It does NOT prove that a master process is running, that any worker was
# forked, that the listening socket was bound, or that a request gets a response.
# A deadlocked or wedged nginx passed that check indefinitely.
#
# This server block is shipped BY THE IMAGE, on a port of its own, so the probe
# does not depend on a consumer-supplied site config and cannot be broken by one.
# It is separate from the `/healthz` in conf.d/app.conf.example: that one is on
# the public site for load balancers, this one is internal.
#
# Deliberately NOT a proxy to php-fpm: this is LIVENESS of the edge process.
# Application readiness stays the orchestrator's business — see the readiness
# section of docs/runtime-hardening.md.
#
# 8081 is the platform's internal readiness port; caddy and php-frankenphp use
# the same number for the same purpose.
# =============================================================================
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log off;

    # Answering this requires a live worker process, a bound socket and a
    # completed request cycle — everything `nginx -t` could not tell us.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The readiness listener answers exactly one path. Anything else is a
    # misdirected request, not a health signal.
    location / {
        return 404;
    }
}
