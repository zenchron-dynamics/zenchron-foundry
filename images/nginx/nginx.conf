# =============================================================================
# Zenchron Dynamics — nginx main config (production, unprivileged).
# Temp paths under /tmp so a read-only root filesystem works (mount tmpfs /tmp).
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

# Logs to stdout/stderr -> container runtime.
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for read-only rootfs (mount tmpfs at /tmp).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Hardening / hygiene ---
    server_tokens off;                 # do not leak nginx version
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    reset_timedout_connection on;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 20;

    # Request body / upload limits (override per site).
    client_max_body_size 16m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # --- Access log to stdout, JSON for ingestion ---
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"rt":$request_time'
    '}';
    access_log /dev/stdout json;

    include /etc/nginx/conf.d/*.conf;
}
