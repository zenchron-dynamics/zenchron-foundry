# =============================================================================
# Zenchron Dynamics — nginx main config (production, unprivileged).
# Temp paths under /tmp so a read-only root filesystem works (mount tmpfs /tmp).
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

# Logs to stdout/stderr -> container runtime.
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for read-only rootfs (mount tmpfs at /tmp).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Hardening / hygiene ---
    server_tokens off;                 # do not leak nginx version
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    reset_timedout_connection on;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 20;

    # Request body / upload limits (override per site).
    client_max_body_size 16m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # --- Access log to stdout, JSON for ingestion -------------------------
    # #107. The previous single format logged $remote_addr in full and
    # $request_uri INCLUDING THE QUERY STRING, plus Referer and User-Agent. A
    # request to /reset?token=... put the token in the log, in the log shipper,
    # in the SIEM and in every backup of them — an access log is not a place a
    # credential can be retracted from.
    #
    # Two formats. `privacy-eu` is the DEFAULT: a field that is only redacted
    # when someone remembers to select a profile is a field that gets logged.

    # Client IP minimisation. nginx's own map, no hand-rolled hashing and no
    # invented cryptography: IPv4 keeps the /24, IPv6 keeps the /48. Enough to
    # see traffic shape and rate-limit patterns, not enough to single out a
    # subscriber. $remote_addr is still available to the `full` format for
    # operators with a lawful basis and a retention policy.
    map $remote_addr $client_net {
        default                                    "unknown";
        "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"          "$v4.0/24";
        "~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*)[:0-9a-fA-F]*$"  "$v6::/48";
    }

    # $uri is the path AFTER nginx has decoded and normalised it, and it
    # deliberately EXCLUDES $args. $request_uri and $request both carry the raw
    # query string and must never appear in this format.
    log_format privacy_eu escape=json '{'
        '"time":"$time_iso8601",'
        '"client_net":"$client_net",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time'
    '}';

    # Opt-in, for operators who have a lawful basis, a stated purpose and a
    # retention period for personal data. Still no Authorization, no Cookie and
    # no Set-Cookie: those are credentials, not diagnostics, and there is no
    # operational case for writing them to disk.
    log_format full escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"rt":$request_time'
    '}';

    # `json` is kept as an alias of the privacy format so an existing
    # `access_log /dev/stdout json;` in a consumer's site config keeps working
    # and silently becomes minimised, rather than breaking or staying verbose.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"client_net":"$client_net",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time'
    '}';

    access_log /dev/stdout privacy_eu;

    include /etc/nginx/conf.d/*.conf;
}
