; Zenchron Dynamics — production PHP CLI settings (8.5)
; CLI has no web-request assumptions: higher memory, no execution timeout.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; CLI jobs (migrations, imports) often need more headroom. Override per job.
memory_limit = 512M
max_execution_time = 0          ; no limit for CLI

date.timezone = UTC
allow_url_fopen = On
allow_url_include = Off

; OPcache for CLI is generally off; enable only for long-lived CLI daemons.
opcache.enable_cli = 0
