; Zenchron Dynamics — LEGACY PHP-FPM pool (8.0, EOL). Non-root, TCP 9000.
[www]
user = app
group = app
listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

ping.path = /-/fpm-ping
ping.response = pong
pm.status_path = /-/fpm-status

catch_workers_output = yes
decorate_workers_output = no
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 30s

security.limit_extensions = .php
clear_env = no
