; =============================================================================
; Zenchron Dynamics — PHP-FPM master config (8.3, production)
; One master process; pool defined in php-fpm.d/www.conf.
; =============================================================================
[global]
; No PID file: FPM runs in the foreground as PID 1 (daemonize = no), so a pid
; file is unnecessary — and writing one under a read-only rootfs requires an
; extra writable, correctly-owned tmpfs, which broke startup as uid 10001.
; Omitting it keeps the read-only profile working with only tmpfs /tmp.

; Log to stderr so the container runtime captures it.
error_log = /proc/self/fd/2
log_level = warning

; Do NOT daemonize: FPM must be PID 1 to receive SIGTERM/SIGQUIT for graceful stop.
daemonize = no

; Restart the master if too many children die unexpectedly.
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

; Load pools.
include = /usr/local/etc/php-fpm.d/*.conf
