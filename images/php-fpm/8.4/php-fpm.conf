; =============================================================================
; Zenchron Dynamics — PHP-FPM master config (8.3, production)
; One master process; pool defined in php-fpm.d/www.conf.
; =============================================================================
[global]
; PID file in a writable tmpfs path (read-only rootfs friendly).
pid = /var/run/php/php-fpm.pid

; Log to stderr so the container runtime captures it.
error_log = /proc/self/fd/2
log_level = warning

; Do NOT daemonize: FPM must be PID 1 to receive SIGTERM/SIGQUIT for graceful stop.
daemonize = no

; Restart the master if too many children die unexpectedly.
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

; Load pools.
include = /etc/php/8.4/php-fpm.d/*.conf
