; =============================================================================
; Zenchron Dynamics — production PHP settings (php-fpm 8.4)
; Loaded as zz-* so it overrides distro defaults. No app-specific values here.
; Tune memory/upload limits per app via env-substituted overrides or a mounted
; supplemental .ini — do NOT bake project values into the base image.
; =============================================================================

[PHP]
; --- Information disclosure ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2          ; stderr -> container logs
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Resource limits (override per workload) ---
memory_limit = 256M
max_execution_time = 30
max_input_time = 30
max_input_vars = 2000

; --- Uploads / request body (override per workload) ---
upload_max_filesize = 16M
post_max_size = 16M
file_uploads = On
max_file_uploads = 20

; --- Hardening ---
allow_url_fopen = On                 ; Composer/HTTP clients need this; url_include stays off
allow_url_include = Off
; Disable rarely-needed, high-risk functions. Laravel/Symfony do NOT need these.
; (proc_* / exec are intentionally allowed in php-worker, NOT here.)
disable_functions = pcntl_exec,exec,passthru,shell_exec,system,proc_open,popen,dl
cgi.fix_pathinfo = 0
default_charset = "UTF-8"

; --- Date ---
date.timezone = UTC

; --- Realpath cache (perf) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
; Session security. Apps using Redis/DB sessions can ignore file path.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.sid_length = 48
session.sid_bits_per_character = 6
; Writable session path must be externalized (tmpfs/volume) under read-only rootfs.
session.save_path = "/tmp/php-sessions"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Production: code is immutable in the image layer, so do not re-stat files.
; Set OPCACHE_VALIDATE_TIMESTAMPS=1 only for dev/bind-mounted code.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1            ; required by Doctrine/annotations/attributes readers
opcache.fast_shutdown = 1
opcache.huge_code_pages = 0
; JIT is DISABLED by default — it widens the attack surface (RCE-class CVEs)
; and rarely benefits typical Laravel/Symfony web workloads. Opt in per project
; after benchmarking; see docs/php-runtime-hardening.md.
opcache.jit = disable
opcache.jit_buffer_size = 0
