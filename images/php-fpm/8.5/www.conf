; =============================================================================
; Zenchron Dynamics — PHP-FPM pool "www" (8.5, production)
; Listens on TCP 9000 for nginx/Caddy upstream. Runs as non-root app user.
; =============================================================================
[www]
user = app
group = app

; TCP listener (container networking). Use a unix socket only when web server
; shares the same container/volume — TCP is the portable default.
listen = 0.0.0.0:9000
; Restrict who may connect at the FPM layer (defense in depth; network policy
; should also restrict this). 9000 should never be published to the internet.
listen.backlog = 511

; --- Process manager ---
; `dynamic` suits variable web load. Tune to container CPU/memory budget.
; Override via env at deploy time where your tooling supports it.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500            ; recycle workers to bound memory leaks
pm.process_idle_timeout = 10s

; --- Status & health ---
; The container HEALTHCHECK is a plain TCP probe of :9000 (docker-healthcheck.sh
; via php fsockopen) — it does NOT query ping.path. ping.path/pm.status_path are
; exposed for external FastCGI-level monitoring (e.g. LB checks, metrics scrapers).
ping.path = /-/fpm-ping
ping.response = pong
; status.path is for internal metrics scraping ONLY — keep it off the public path.
pm.status_path = /-/fpm-status

; --- Logging ---
catch_workers_output = yes
decorate_workers_output = no
; Slow request log to stderr for triage.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 30s

; --- Hardening ---
; Only allow .php to be executed by FPM; nginx/Caddy must also enforce this.
security.limit_extensions = .php
clear_env = no                   ; allow container env (app reads config from env)

; Per-pool php overrides may be appended here, but prefer the zz-*.ini file.
