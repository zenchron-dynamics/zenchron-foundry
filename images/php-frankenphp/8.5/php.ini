; Zenchron Dynamics — FrankenPHP production PHP settings (8.5)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 16M
post_max_size = 16M

date.timezone = UTC
allow_url_fopen = On
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,dl,pcntl_exec

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
; JIT disabled by default (attack surface); opt in per project — docs/php-runtime-hardening.md
opcache.jit = disable
opcache.jit_buffer_size = 0

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
