# =============================================================================
# ADVISORY ONLY — NOT PART OF THE CI GATE.
#
# The enforcing gate is scan-images.yml's EXPLICIT Trivy flags:
#   --severity CRITICAL,HIGH  --exit-code 1  --ignore-unfixed
#   --ignorefile policies/.trivyignore
# In CI, Grype runs REPORT-ONLY (anchore/scan-action `fail-build: false`,
# severity-cutoff high) and does NOT read this file. This config is consumed
# only by the manual helper scripts/scan-all.sh (`grype --config`); editing it
# changes nothing in scan-images.yml.
# =============================================================================
# Grype scan policy — https://github.com/anchore/grype
# Second-opinion scanner alongside Trivy (different DBs catch different CVEs).
fail-on-severity: "high"

output:
  - "table"
  - "sarif"

# Match tuning.
ignore:
  # Negligible / unknown severity is noisy on minimal images — report, don't fail.
  - vulnerability: "*"
    severity: "negligible"

# Accepted-risk entries go below WITH justification (mirror .trivyignore policy).
# ignore:
#   - vulnerability: CVE-XXXX-YYYYY   # owner, reason, review-by YYYY-MM-DD

db:
  auto-update: true
  validate-by-hash-on-start: true

external-sources:
  enable: false        # deterministic CI; no live network enrichment
