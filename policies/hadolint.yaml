# Hadolint config — Dockerfile linting policy (Debian-first; see ADR-0001).
failure-threshold: warning

# Trusted base-image registries. Debian-first: official Docker Hub library
# images (php, nginx, caddy) + GitHub Container Registry for our own images.
trustedRegistries:
  - docker.io
  - ghcr.io
  - registry.k8s.io

# Rules we intentionally relax (with reason):
ignored:
  # DL3008: pin apt package versions — we pin the BASE IMAGE by digest instead,
  #         so every package comes from one immutable Debian snapshot. Per-apt
  #         version pinning would fight Debian point releases and Dependabot
  #         base bumps. CVE remediation is "bump the base digest", not in-image
  #         package drift (see docs/security/base-image-patching.md).
  - DL3008
  # DL3006: tag the base image explicitly — false positive here. Every base is
  #         digest-pinned in an `ARG <NAME>_BASE="ref@sha256:..."` and the stage
  #         does `FROM ${<NAME>_BASE}`; hadolint sees only the ARG variable, not
  #         the pinned digest behind it. Pin enforcement lives in
  #         scripts/check-structure.sh + scripts/verify-base-images.sh instead.
  - DL3006

override:
  error:
    - DL3002   # do not switch back to root at the end
    - DL3025   # use JSON notation for CMD/ENTRYPOINT (signal handling)
    - DL3020   # use COPY instead of ADD
    - DL4006   # set -o pipefail before pipes
  warning:
    - DL3009   # delete the apt-get lists (rm -rf /var/lib/apt/lists/*)
    - DL3015   # apt-get install --no-install-recommends
