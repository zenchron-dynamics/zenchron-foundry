# =============================================================================
# policies/php-lifecycle.yaml — supported PHP versions, their support state, and
# the deadlines that force a decision.
# -----------------------------------------------------------------------------
# WHY THIS EXISTS. Adding a PHP version used to be an edit to MATRIX_IMAGES and
# nothing else. That is how a moving selector (`php-all`) could silently extend
# historical risk decisions to a version whose evidence never existed. Entry and
# retirement are now explicit, dated, and machine-checked.
#
# Enforced by: tests/matrix/test_php_lifecycle_and_selectors.sh
# Matrix source of truth: scripts/lib/common.sh MATRIX_IMAGES
# =============================================================================
schema_version: 1

policy:
  owner: Zenchron Dynamics / Platform Security
  last_reviewed: 2026-08-21
  upstream_source: https://www.php.net/supported-versions.php
  upstream_checked: 2026-08-21

# support_state:
#   supported          — built, scanned, reconciled, shipped
#   governance-pending  — built and scanned, but NOT yet governed by evidence;
#                         must not be released until its findings are decided
#   deprecated          — still built; migration advised; retirement date set
#   retired             — removed from MATRIX_IMAGES
versions:
  - version: "8.3"
    support_state: deprecated
    families: [php-cli, php-fpm, php-worker, php-frankenphp]
    entered_matrix: 2026-05-30
    security_support_until: 2027-12-31
    deprecation_note: >-
      PHP 8.3 receives security fixes only. Consumers should plan migration to
      8.4 or 8.5. It remains built and governed until retirement.
    migration_target: "8.4"
    retire_after: 2027-12-31

  - version: "8.4"
    support_state: supported
    families: [php-cli, php-fpm, php-worker, php-frankenphp]
    entered_matrix: 2026-05-30
    security_support_until: 2028-12-31

  - version: "8.5"
    support_state: governance-pending
    families: [php-cli, php-fpm, php-worker, php-frankenphp]
    entered_matrix: 2026-08-21
    security_support_until: 2029-12-31
    governance_note: >-
      PHP 8.5 IS BUILT AND SCANNED BUT BEGINS UNGOVERNED, deliberately. No
      existing exception covers it: every PHP selector in the ledger is bound to
      the immutable `php-8.3-8.4` cohort, so adding 8.5 to the matrix cannot
      widen a historical decision. Its findings must be triaged from ITS OWN
      evidence before release.
    release_blocked_until: >-
      8.5 findings are reconciled from 8.5 evidence and either governed by
      explicit 8.5-scoped entries or absent.

# A selector naming a PHP family MUST be version-bounded. `php-all` and bare
# family selectors are refused by scripts/reconcile-vulnerabilities.sh.
selectors:
  cohorts:
    php-8.3-8.4: {families: [php-cli, php-fpm, php-worker, php-frankenphp], versions: ["8.3", "8.4"]}
    php-cli-8.3-8.4: {families: [php-cli], versions: ["8.3", "8.4"]}
    php-fpm-8.3-8.4: {families: [php-fpm], versions: ["8.3", "8.4"]}
    php-worker-8.3-8.4: {families: [php-worker], versions: ["8.3", "8.4"]}
    php-frankenphp-8.3-8.4: {families: [php-frankenphp], versions: ["8.3", "8.4"]}
  refused:
    - selector: php-all
      why: moving selector; would silently govern any newly added PHP version
    - selector: php-cli
      why: bare PHP family selector; not version-bounded
    - selector: php-fpm
      why: bare PHP family selector; not version-bounded
    - selector: php-worker
      why: bare PHP family selector; not version-bounded
    - selector: php-frankenphp
      why: bare PHP family selector; not version-bounded
