# =============================================================================
# policies/repository-governance.yaml
# -----------------------------------------------------------------------------
# The DECLARED governance configuration of this repository, in the form a
# machine can check. scripts/verify-repo-governance.sh compares this file against
# the live GitHub API and fails closed on ANY divergence — in BOTH directions:
#
#   * a control declared here but missing live  -> FAIL (claim without control)
#   * a control live but not declared here      -> FAIL (undocumented drift)
#
# That two-way check is the point. Before this file existed, every governance
# statement in docs/ was an *aspiration* written as if it were a control, and the
# repository ran with zero protections while four documents asserted the opposite
# (issue #97).
#
# This file records what IS enforced. Nothing here is a plan. Items that are not
# yet enforced are declared `pending` and the verifier then requires them to be
# ABSENT live, so a pending item can never be quietly read as a control.
#
# Required status-check NAMES are deliberately NOT duplicated here: they live in
# policies/required-release-checks.yaml, which scripts/assert-required-checks.sh
# already keeps in lockstep with the real workflow job names. The merge gate and
# the release gate therefore require the identical set by construction.
# =============================================================================
schema_version: 1

# Dated review of this file. scripts/verify-repo-governance.sh warns when the
# review is older than review_interval_days and fails past the grace period.
review:
  decision_date: "2026-07-28"
  review_date: "2026-10-28"
  review_interval_days: 92
  owner: "Bogdan Olteanu / Zenchron Dynamics"
  approver: "Bogdan Olteanu (repo + org admin)"

# The release environments checked BY NAME. "any environment has reviewers"
# proved nothing about whether these two specific environments are protected.
release_environments:
  - foundry-rc
  - foundry-production

repository:
  # Verified 2026-07-28: `gh repo view --json visibility` -> PUBLIC.
  #
  # Rationale (maintainer decision, 2026-07-28): the repository is public so that
  # external review tooling can read it. This is an ACCESS decision, NOT a grant
  # of public distribution rights — the LICENSE remains proprietary and
  # confidential, which is a live conflict tracked in issue #98 and NOT resolved
  # by this policy. Read: world-readable source under a confidential licence.
  visibility: public
  default_branch: master

  # Verified applied 2026-07-28 (GET /actions/permissions/workflow).
  actions:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false

# --- Organization runner group ----------------------------------------------
# The self-hosted runners live in the org-level group below. GitHub disables
# `allows_public_repositories` by default, and this repository is PUBLIC, so the
# flag decides whether CI can run at all: with it false, jobs are created and
# then never dispatched — they queue until the 24h timeout and are cancelled with
# no runner ever assigned. That is exactly what happened between 2026-07-27T07:40
# and 2026-07-29, and it cost hours to diagnose from the outside because the
# endpoint needs admin:org.
#
# SAFETY: allowing self-hosted runners on a public repository is only acceptable
# because the fork-PR trust boundary (#96) exists — fork pull requests run on
# ephemeral GitHub-hosted runners and the privileged pool only ever sees push and
# same-repo events, enforced by scripts/assert-runner-trust.sh. The verifier
# therefore checks BOTH: the flag, and that the boundary gate is present and
# wired. Turning this flag on WITHOUT that gate would expose the runner host to
# arbitrary fork code.
org_runner_group:
  name: Default
  id: 1
  allows_public_repositories: true
  # The code control that makes the above safe. Verified to exist and be wired.
  requires_fork_pr_boundary: scripts/assert-runner-trust.sh

# --- Branch ruleset ---------------------------------------------------------
branch_ruleset:
  name: master-protection
  enforcement: active
  include_refs: ["refs/heads/master"]
  # EMPTY BY DESIGN. docs/repository-security.md targets "include administrators
  # — no direct pushes; everything via PR", so no actor may bypass, not even the
  # owner (live: `current_user_can_bypass: never`). An emergency therefore means
  # disabling the ruleset via the API, which is an auditable admin action, rather
  # than a silent local hook bypass. Log any such use in
  # docs/audits/free-tier-governance-accepted-risk.md.
  bypass_actors: []
  required_rules:
    - deletion              # branch cannot be deleted
    - non_fast_forward      # no force-push
    - required_linear_history
    - pull_request
    - required_status_checks

  pull_request:
    # 0, NOT 1 — deliberate and load-bearing. This is a single-maintainer
    # repository: GitHub forbids self-approval, so requiring 1 approval with no
    # bypass actor would make EVERY merge impossible, and adding a bypass actor
    # to compensate would turn the whole ruleset into theatre. A PR is still
    # mandatory; what is missing is a second pair of eyes, which is a people
    # problem tracked in issue #112, not a settings problem. Raise this to 1 in
    # the same change that onboards a second maintainer.
    required_approving_review_count: 0
    dismiss_stale_reviews_on_push: true
    required_review_thread_resolution: true
    # Requires a CODEOWNERS review. Same self-approval wedge as above — the sole
    # code owner cannot satisfy it. Enable with the second maintainer (#112).
    require_code_owner_review: false
    require_last_push_approval: false

  required_status_checks:
    # Names come from policies/required-release-checks.yaml (26 checks).
    source: policies/required-release-checks.yaml
    # "Require branches to be up to date before merging" = false, deliberately.
    # A full CI pass is measured in hours (docs/runner-capacity.md: the 10-image
    # matrix is serial; verify-rc is ~12 h), so strict mode would force a rebase
    # and a full re-run on every master update and could livelock a merge.
    # Compensating control: the release gate re-verifies every required check
    # against the EXACT tagged commit (scripts/check-exact-commit-ci.sh), so a
    # merge made on a slightly stale base can never produce an unverified
    # release. Merge-time staleness is a correctness risk; release-time
    # staleness is the security risk, and that one is closed.
    strict: false

# --- Tag ruleset ------------------------------------------------------------
tag_ruleset:
  name: release-tags-immutable
  enforcement: active
  include_refs: ["refs/tags/v*"]
  # Empty by design: release tags are immutable for EVERYONE. Repairing a
  # mis-tagged release requires disabling this ruleset — deliberately visible.
  bypass_actors: []
  required_rules:
    - deletion              # a published release tag cannot be deleted
    - non_fast_forward      # cannot be force-moved
    - update                # cannot be repointed
  # NOTE: `creation` is intentionally NOT restricted. scripts/prepare-release.sh
  # pushes new v* tags as the normal release path; blocking creation would break
  # it and buy nothing, since a NEW tag mutates no existing release.

# --- Declared-but-not-yet-enforced -----------------------------------------
# The verifier requires each of these to be ABSENT live while it is `pending`.
# Flip to `required` and apply in the SAME change, so docs and reality move
# together.
pending:
  # Verified 2026-07-28: both environments exist with `branch_policy` only, no
  # required_reviewers. This was previously documented as impossible on the
  # plan; that was true for Free + PRIVATE. The repository is public now, so
  # environment reviewers ARE available and this is a real, closable gap.
  # Blocked on the same single-maintainer question as the approval count (#112).
  environment_required_reviewers: pending
  # Restricting release creation to maintainers is a role/settings action with
  # no ruleset equivalent; it is not API-verifiable from repository code.
  restrict_release_creation: pending

# --- Not verifiable from repository code ------------------------------------
# Listed so their absence from the verifier's output is explicit rather than an
# unnoticed gap. Each needs a human to check the UI and date the finding.
not_api_verifiable:
  - "Settings -> Actions -> General -> fork pull request workflow approval
     (GET /actions/permissions/fork-pr-workflows -> 404 on this repo/token).
     Defense in depth only: the CI trust boundary (issue #96) does not depend
     on it — see docs/repository-security.md#ci-trust-boundary."
  - "Organization-level RULESETS (GET /orgs/{org}/rulesets). Still unverified —
     distinct from the runner group above, which IS now checked."
  - "GitHub plan/billing tier."
