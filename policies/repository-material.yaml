# =============================================================================
# policies/repository-material.yaml
#   THE canonical inventory of third-party material that lives in the
#   REPOSITORY. Issue #120. Schema: schemas/repository-material-v1.schema.json.
# -----------------------------------------------------------------------------
# WHY THIS FILE EXISTS, stated as the defect it closes.
#
# The licence gate consumes IMAGE SBOMs. Material that lives in the repository
# but in no image is invisible to it BY CONSTRUCTION — not by oversight, not by
# a missing rule, but because an SBOM of a built image enumerates what is in
# that image and nothing else. Copied configuration, seccomp profiles, scripts,
# workflow fragments, documentation excerpts, fixtures, vendored schemas,
# patches and generated third-party files all fall in that hole.
#
# security/seccomp/zenchron-default.json is the proof: 832 lines copied verbatim
# from Moby v27.3.1, sitting unattributed under a first-party filename, and NO
# control in this repository could see it.
#
# The previous attempt at a fix was a hardcoded two-element array inside one
# test (tests/governance/test_copied_material_attribution.sh). That does not
# scale, cannot be composed with anything, and had already gone stale: it named
# two files while five carry an obligation today.
#
# WHAT THIS FILE IS NOT.
#   * It is NOT an exception list. Nothing here excuses a file from a control.
#     `dispositions` records files that TRIP a discovery signal and are not
#     material — each with a reason and a reviewer, so the judgement is visible.
#   * It does NOT choose a licence for Foundry. That is #98, it is undetermined,
#     and every obligation recorded here attaches TODAY regardless of it.
#   * It does NOT assert ownership or copyright subsistence in anything.
#
# THE HONEST LIMIT, stated up front because it is the whole point.
#   Deciding that an arbitrary file was copied from somewhere is undecidable in
#   general. Discovery here is HEURISTIC and its recall is unknown. Two of the
#   five entries below (ipe-installer-gd-branch, ipe-installer-gd-configure)
#   carry no marker of any kind and NO signal fires on them — they were found by
#   a human reading the directory. `baseline` below is the non-heuristic half:
#   an explicit reviewed scope, so material outside it is a REFUSAL rather than
#   a silent pass. See docs/licensing/repository-material.md.
#
# Gate: scripts/license/assert-repository-material.sh
# =============================================================================
schema: foundry.repository-material/v1
version: 1
tracked_issue: 120

# --- the reviewed baseline ---------------------------------------------------
# `path_list` is the exact set of tracked paths a human reviewed. It is the
# answer to "what about material that trips no signal?": everything inside the
# baseline was looked at; anything outside it is unreviewed, and unreviewed is
# refused (RM-BASELINE-STALE) rather than assumed clean.
#
# Regenerate ONLY after actually reviewing the delta:
#   git ls-files | LC_ALL=C sort > policies/repository-material-baseline.txt
#   shasum -a 256 policies/repository-material-baseline.txt
baseline:
  path_list: policies/repository-material-baseline.txt
  path_list_sha256: BASELINE_SHA_PLACEHOLDER
  path_count: BASELINE_COUNT_PLACEHOLDER
  reviewed_at_revision: BASELINE_REV_PLACEHOLDER
  reviewed_by: lane-R-repository-material-review
  reviewed_on: '2026-08-27'
  review_method: >-
    File-by-file read of every tracked path outside the deterministic
    machine-output classes (SBOM JSON, scanner findings JSON, dpkg/apt captures,
    GitHub API response captures), plus a full read of every tracked file that
    is large, structured and first-party-named — the shape the seccomp profile
    had. The machine-output classes were sampled, not read in full; that is a
    stated limit of this review, not a claim about them.

