# --- dispositions ------------------------------------------------------------
# Tracked files that TRIP a discovery signal and are NOT incorporated
# third-party material. Every one needs a named reason and a reviewer, because
# "the scanner is wrong here" is a judgement and judgements must be attributable.
#
# The gate reads this array as DATA. It contains no path-specific logic of its
# own — a scanner that hardcodes which of its own hits to ignore is a scanner
# whose findings nobody can audit.
dispositions:
  - path: scripts/license/assert-repository-material.sh
    classification: scanner-self-reference
    reason: >-
      This is the discovery scanner itself. It necessarily contains the literal
      licence-grant and copyright patterns it searches for, so it matches its
      own signals. Disposing of it here rather than hardcoding an exclusion
      keeps the exclusion visible and reviewable.
    reviewed_by: lane-R-repository-material-review
    reviewed_on: '2026-08-27'
  - path: tests/license/test_repository_material_gate.sh
    classification: scanner-self-reference
    reason: >-
      The scanner's test suite builds fixtures containing licence-grant text and
      foreign copyright lines in order to prove the signals fire at all. A test
      that could not contain those strings could not prove non-vacuity.
    reviewed_by: lane-R-repository-material-review
    reviewed_on: '2026-08-27'
  - path: docs/licensing/repository-material.md
    classification: scanner-self-reference
    reason: >-
      Documents the discovery signals by quoting the patterns verbatim, which is
      the only way a reader can check whether a given file would be caught.
    reviewed_by: lane-R-repository-material-review
    reviewed_on: '2026-08-27'
  - path: policies/repository-material.yaml
    classification: scanner-self-reference
    reason: >-
      This inventory records the copyright attribution line required by each
      entry's licence, so it contains foreign copyright strings by design.
    reviewed_by: lane-R-repository-material-review
    reviewed_on: '2026-08-27'
