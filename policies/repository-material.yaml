# --- the carried licence-text store ------------------------------------------
# Canonical SPDX licence TEXTS, carried to DISCHARGE the "retain-license-text"
# obligation of components inside the IMAGES. They are declared here once, by
# naming their provenance record; scripts/license/assert-repository-material.sh
# reads that record and refuses if any listed text is untracked, absent, or not
# the bytes the record hashes.
#
# They are deliberately NOT `materials`: nothing in this repository incorporates
# the text of GPL-2.0 into a first-party file. They are deliberately NOT
# `dispositions` either: a disposition asserts "this is not copied material",
# and a licence text plainly is. Forcing them into either array would have made
# one of those two sentences false.
carried_licence_texts:
  - provenance: third-party/licence-texts/PROVENANCE.yaml
    reason: >-
      Canonical licence texts for every identifier the licence policy classifies
      and every identifier the 20-child production cohort resolved, carried
      verbatim from spdx/license-list-data v3.28.0 so that "retain-license-text"
      is mechanically dischargeable rather than asserted. Carrying a text
      discharges that obligation and nothing else; it selects no outbound licence
      and answers no question in #98.
    reviewed_by: lane-notice-source-obligations
    reviewed_on: '2026-08-28'
  # THE OTHER KIND, and it is not interchangeable with the first. The canonical
  # text of GPL-2.0 is not busybox's copyright statement, and
  # retain-copyright-notice is an obligation about the second.
  - provenance: third-party/image-licence-materials/PROVENANCE.yaml
    reason: >-
      The licence and copyright material PHYSICALLY PRESENT in the 20 accepted
      production images, extracted buildlessly from their immutable digests
      (#120 action N1): Debian per-binary-package copyright files, the shared
      /usr/share/common-licenses texts those files defer to, and the licence
      files PEAR components ship. Content-addressed, so a file shared by many
      packages and children is stored once and every consumer is bound to its
      hash. Carrying it discharges retain-copyright-notice for those components
      and nothing else.
    reviewed_by: lane-n1-in-image-licence-materials
    reviewed_on: '2026-08-29'

