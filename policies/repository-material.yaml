# --- dispositions ------------------------------------------------------------
# Tracked files that TRIP a discovery signal and are NOT incorporated
# third-party material. Every one needs a named reason and a reviewer, because
# "the scanner is wrong here" is a judgement and judgements must be attributable.
#
# The gate reads this array as DATA. It contains no path-specific logic of its
# own — a scanner that hardcodes which of its own hits to ignore is a scanner
# whose findings nobody can audit.
dispositions:
  - path: third-party/moby-v27.3.1/PROVENANCE.yaml
    classification: first-party
    reason: >-
      Foundry's own record of how the adjacent upstream texts were retrieved and
      what they discharge. It sits under third-party/ — which is a discovery
      signal on its own — but no upstream byte is in it. The two texts beside it
