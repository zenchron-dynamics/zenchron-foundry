# =============================================================================
# policies/required-release-checks.yaml
# -----------------------------------------------------------------------------
# The exact set of CI checks that must be GREEN on the TAGGED COMMIT before a
# stable GitHub release may be sealed. scripts/check-exact-commit-ci.sh queries
# the GitHub Checks/Statuses API for the tag's commit and requires every name
# below to have concluded `success` — skipped / neutral / cancelled / stale /
# timed-out / missing / failed all reject.
#
# "Latest successful master run" is NOT accepted as evidence for another commit.
# =============================================================================
schema_version: 1

# Bounded polling for checks still running on the tagged commit.
poll:
  timeout_seconds: 1800
  interval_seconds: 30

# Conclusions that count as a pass. Anything else (or absent) fails the gate.
accept_conclusions: [success]

required_checks:
  # EXACT check-run names, as GitHub renders them. scripts/assert-required-checks.sh
  # keeps this list in sync with the workflow job names (matrices expanded) — the
  # exact-commit gate matches names verbatim, so any drift here silently rejects
  # every release commit with "missing: <name>".
  #
  # ci.yml — runs on every push to master.
  - repo structure
  - lint (shell / yaml / md / dockerfile)
  - secret scan (gitleaks)
  - semgrep docker security
  - validate compose profiles
  - build+smoke php-cli 8.3
  - build+smoke php-cli 8.4
  - build+smoke php-fpm 8.3
  - build+smoke php-fpm 8.4
  - build+smoke php-worker 8.3
  - build+smoke php-worker 8.4
  - build+smoke php-frankenphp 8.3
  - build+smoke php-frankenphp 8.4
  - build+smoke nginx
  - build+smoke caddy
  # WF-04: structured build/smoke evidence aggregation — gates on the full
  # build-test matrix result, so it can never green a red matrix.
  - aggregate build+smoke results
  # scan-images.yml — the vulnerability gate. It does NOT run on push to master
  # (dispatch / schedule / image-touching PRs only), so the release operator must
  # dispatch it on the release revision; a workflow_dispatch attaches its
  # check-runs to that commit, which is what this gate then reads.
  - scan php-cli 8.3
  - scan php-cli 8.4
  - scan php-fpm 8.3
  - scan php-fpm 8.4
  - scan php-worker 8.3
  - scan php-worker 8.4
  - scan php-frankenphp 8.3
  - scan php-frankenphp 8.4
  - scan nginx prod
  - scan caddy prod
