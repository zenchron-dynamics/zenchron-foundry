# =============================================================================
# policies/source-obligations.yaml
#   MECHANICALLY SUPPORTABLE FACTS about the reciprocal / source-offer
#   obligations the shipped image cohort carries. Issue #120.
# -----------------------------------------------------------------------------
# THIS FILE DECIDES NOTHING AND SATISFIES NOTHING.
#
# It does not conclude that any obligation is met, does not approve a source
# delivery mechanism, does not state that a URL is a sufficient written offer,
# and does not interpret LGPL relinking. Every one of those is a legal decision,
# there is no appointed legal owner (#98), and an engineer recording a fact is
# not an engineer discharging an obligation.
#
# What it does is remove the excuse that the facts were unknown. For every
# component in the accepted 20-child cohort that carries a reciprocal identifier,
# it records the exact binary package and version, the exact SOURCE package and
# version resolved from an immutable archive, which licence texts are carried,
# and what is still unresolved. A lawyer can act on this. Nobody has to re-derive
# it, and nobody can quietly narrow it.
#
# HOW THE SET WAS DERIVED, so it can be checked rather than trusted.
#   Input: the committed gate refusal
#     docs/audits/real-image-inventories-2026-08-28/licence/image-licence-policy-diagnostic.log
#   Every finding line in the "sources disagree" (196) and "licence needs legal
#   review" (19) sections was scanned for an SPDX identifier matching
#   ^(GPL|LGPL|AGPL|MPL|EPL|CDDL). 162 components carry at least one.
#   Debian binary -> source came from snapshot.debian.org /mr/binary/<name>/,
#   matched on the EXACT binary_version, 143 of 143 resolved.
#   Alpine binary -> source came from the aports git tag below, matched on
#   pkgver-pkgrel, 19 of 19 resolved across 10 origins.
#
# THE COUNT CORRECTION. An earlier audit note said LGPL-2.0 sat on "25 distinct
# core Debian packages". The measurement here is 28 (binary package, version)
# pairs over 27 distinct binary package names — liblzma5 appears at two versions.
# The 28 are the ones flagged `lgpl_2_0: true` below. The earlier figure was
# prose and is corrected here, not carried forward.
# =============================================================================
schema: foundry.source-obligations/v1
version: 1
tracked_issue: 120

measurement:
  cohort: the 20 accepted production children
  source_revision: 7061caafb3ea09bd5b2342a1daf022151b33f822
  evidence: docs/audits/real-image-inventories-2026-08-28/licence/image-licence-policy-diagnostic.log
  components_with_a_reciprocal_identifier: 162
  debian_components: 143
  alpine_components: 19
  lgpl_2_0_bearing_components: 28
  collected_at: '2026-08-28T10:16:19Z'

source_authorities:
  debian:
    name: snapshot.debian.org
    api: https://snapshot.debian.org/mr/binary/<binary>/
    immutability: >-
      snapshot.debian.org retains every version ever published in the Debian
      archive and serves it by exact version. A (binary, binary_version) pair
      resolves to one (source, source_version) permanently.
    source_url_template: https://snapshot.debian.org/package/<source>/<source_version>/
  alpine:
    name: alpine/aports
    repository: https://gitlab.alpinelinux.org/alpine/aports
    revision_tag: v3.23.5
    revision_commit: 1fa9ca1a79c5fd52c46a70b2199059c41ead572a
    immutability: >-
      The release tag is immutable. main/<origin>/APKBUILD at that tag declares
      pkgver and pkgrel, which reconstruct the exact -rN binary version. The
      dl-cdn APKINDEX was used only to discover candidate origins and is NOT
      cited as an authority: it is mutable and had already moved past two of
      these versions when this was collected.
    source_url_template: https://gitlab.alpinelinux.org/alpine/aports/-/tree/v3.23.5/main/<origin>

# --- facts that are uniform across every entry, stated once ------------------
uniform_facts:
  modified_by_foundry:
    value: false
    basis: >-
      No image definition under images/ patches, rebuilds, relinks or otherwise
      modifies any of these packages. Every one is installed unmodified from its
      distribution archive by apt-get or apk in the Dockerfile, and
      policies/supply-chain-inputs.yaml records the only externally fetched
      inputs Foundry does build (phpredis, and the extensions compiled by
      docker-php-ext-install from php-src). A redistributor who does not modify
      still owes the corresponding source; "we did not change it" narrows the
      state-changes obligation and narrows nothing else.
  linkage:
    determined: false
    hypothesis: >-
      The Debian shared-library packages (lib*.so.N) are dynamically linked by
      the construction of the Debian package split, and the Alpine ones the same
      way. That is a convention, not a measurement.
    why_not_determined: >-
      Proving linkage requires reading the shipped binaries. The 40 SBOM
      documents for this cohort are 86 MB and are not committed, and this batch
      was required to rebuild nothing. Recording a convention as a measurement
      is exactly the substitution this repository keeps removing.
    determination_method: >-
      For each child, by immutable digest and without rebuilding:
        syft/crane the layer, then for each candidate library
        `readelf -d <consumer> | grep NEEDED` and `ldd <consumer>`
      inside a container run from the pinned digest. The result belongs in an
      audit record beside this file, not in prose here.
  upstream_notice_files:
    carried: false
    detail: >-
      No upstream NOTICE file is carried for any entry below. Debian records
      per-package copyright and licence in /usr/share/doc/<pkg>/copyright inside
      the image; that file is the per-package attribution and it is NOT currently
      extracted, carried or hashed. Doing so is engineering work, it is named as
      an unresolved obligation below, and its absence is why the notice producer
      REFUSES rather than emitting a bundle that looks complete.
  licence_texts:
    carried: true
    where: third-party/licence-texts/
    provenance: third-party/licence-texts/PROVENANCE.yaml
    detail: >-
      The canonical SPDX text for every reciprocal identifier appearing below is
      carried verbatim from spdx/license-list-data v3.28.0. Carrying the text of
      a licence discharges "retain-license-text" and discharges NOTHING ELSE —
      in particular it does not discharge the corresponding-source obligation
      that GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1 and LGPL-3.0 each impose.

# --- what a source offer COULD be, enumerated and NONE approved --------------
# Listing an option is not choosing it. Each carries a duration or availability
# commitment that only a rights holder can make.
delivery_mechanisms_considered:
  - id: accompany-with-source
    description: >-
      Ship the corresponding source alongside the binary — for images, a source
      artifact pushed to the same registry repository and referenced from the
      image manifest.
    foundry_can_execute_today: false
    blocked_on: >-
      No source artifact is built, published or retained. Building one is
      engineering work of a size that needs its own change; it is not blocked on
      a legal decision.
  - id: written-offer
    description: >-
      A written offer, valid for the period the licence requires, to provide the
      corresponding source to any third party.
    foundry_can_execute_today: false
    blocked_on: >-
      A duration and availability COMMITMENT. Only a rights holder can make one.
      GPL-2.0 s.3(b) attaches a three-year term; GPL-3.0 s.6(b) ties it to the
      support period. Nothing in this repository may promise either.
  - id: upstream-url-pass-through
    description: >-
      Point recipients at snapshot.debian.org and the aports tag.
    foundry_can_execute_today: false
    blocked_on: >-
      Sufficiency. A URL to somebody else's archive is NOT on its face a
      conforming source offer, and this file does not claim it is. It is recorded
      because the identifiers below make it CHECKABLE, not because it is enough.
  - id: no-distribution
    description: >-
      If #98 resolves to internal-only distribution, the analysis changes
      entirely and some of these obligations may not attach at all.
    foundry_can_execute_today: false
    blocked_on: '#98'

# --- the questions engineering must NOT answer -------------------------------
unresolved_legal_questions:
  - id: SO-Q1
    question: >-
      Under the distribution model #98 settles, does distributing these container
      images constitute "distribution" or "conveying" for GPL-2.0 s.3, GPL-3.0
      s.6, and the LGPL corresponding-source obligations at all?
    owner: '#98 — rights holder and counsel'
  - id: SO-Q2
    question: >-
      Which of the enumerated delivery mechanisms is sufficient, and for what
      duration and availability?
    owner: '#98 — rights holder and counsel'
  - id: SO-Q3
    question: >-
      For the LGPL components, does shipping the unmodified shared library in a
      container image satisfy the relinking condition, and does the image form
      change the answer?
    owner: '#98 — counsel'
  - id: SO-Q4
    question: >-
      Do the "OR" expressions (libcap "BSD-3-Clause OR GPL-2.0-only", libidn2 and
      libunistring "GPL-2.0-or-later OR LGPL-3.0-or-later", zstd "BSD-3-Clause OR
      GPL-2.0-or-later") let Foundry elect the permissive branch, and who records
      the election?
    owner: '#98 — counsel. An election is a legal act and no tool here makes one.'
  - id: SO-Q5
    question: >-
      Is the PHP-3.01 naming clause compatible with the outbound terms #98
      selects? The identifier is now established by
      policies/upstream-licence-attestations.yaml; the compatibility question is
      not.
    owner: '#98 — counsel'

