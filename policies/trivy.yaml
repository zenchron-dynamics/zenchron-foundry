# =============================================================================
# ADVISORY ONLY — THIS FILE IS NOT LOADED BY ANY GATE OR SCRIPT.
#
# The enforcing gate is scan-images.yml's EXPLICIT Trivy flags:
#   --severity CRITICAL,HIGH  --exit-code 1  --ignore-unfixed
#   --ignorefile policies/.trivyignore
# (scripts/scan-all.sh, the manual helper, also hard-codes its flags.)
# Grype runs report-only in CI (anchore/scan-action `fail-build: false`).
#
# This file documents the intended Trivy policy for humans and for anyone
# running Trivy by hand with `--config policies/trivy.yaml`; editing it changes
# NOTHING in CI. Keep it aligned with the scan-images.yml flags so it never
# contradicts the real gate.
# =============================================================================
# Trivy scan policy — https://aquasecurity.github.io/trivy
severity:
  - CRITICAL
  - HIGH

scan:
  scanners:
    - vuln
    - secret
    - misconfig

vulnerability:
  type:
    - os
    - library

# Matches the enforcing gate (--ignore-unfixed): unfixed distro CVEs never gate
# (there is no actionable fix short of forking the distro). Every known-ignored
# CVE is still recorded as an explicit, expiring entry in
# policies/vulnerability-exceptions.yaml (validated in CI).
ignore-unfixed: true

misconfiguration:
  include-non-failures: false

# Accepted-risk CVEs live in policies/.trivyignore (with justification + expiry).
# Keep this list EMPTY by default; every entry needs a documented exception.
secret:
  config: policies/gitleaks.toml
