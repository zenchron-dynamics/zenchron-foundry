# Buildless upstream watch configuration — OBSERVATION ONLY.
#
# WHAT THIS FILE IS NOT. It is not governance. Nothing here accepts, widens,
# narrows, renews, re-dates or removes a record in
# policies/vulnerability-exceptions.yaml, and no tool that reads this file may
# write that one. The monitor built on it (scripts/upstream-monitor.sh,
# scripts/upstream-monitor.py) never rebuilds an image, never moves a pin,
# never dispatches acceptance, never renews an exception and never removes one.
# It resolves upstream artifacts, records what they contain, and reports.
#
# WHAT IT IS FOR. Every record in the ledger's 2026-09-30 fail-closed cohort has
# an EXIT CONDITION written in prose. Prose cannot be evaluated on a schedule.
# This file restates those exit conditions in a form a program can check against
# a live observation, and binds each one to the exact ledger records it would
# clear. The restatement is derived from, and subordinate to, the ledger text:
# where they disagree the ledger is authoritative and the disagreement is itself
# reported (`ledger-contradicted`).
#
# THE PROPERTY THIS FILE EXISTS TO PRESERVE.
#   A MOVED TAG IS NOT REMEDIATION.
# Three distinct observations are kept apart and never conflated:
#   1. index movement    — the tag's manifest-list digest changed. Can happen
#                          because a Windows manifest was rebuilt. Means nothing
#                          about Linux content.
#   2. platform movement — a linux/amd64 or linux/arm64 manifest digest changed.
#                          The artifact really is a different object.
#   3. content change    — a watched component's version inside the artifact
#                          changed. Only this can bear on an exit condition.
# Measured precedent for why: on 2026-08-25 the FrankenPHP 8.3 INDEX digest
# moved while both platform manifests stayed byte-identical, and when 8.4 later
# moved on BOTH platforms the embedded modules were unchanged at
# kin-openapi v0.140.0 / grpc v1.81.1. Either would have produced a false
# "remediation available" on a monitor that watched digests.
# Only (3), reaching the declared `clearing_version` on EVERY required platform,
# can raise an alert.
#
# ALERT DISCIPLINE. Silence is the normal output. See docs/upstream-monitor.md.
schema_version: 1

# --- watched official image artifacts ---------------------------------------
# `baseline` is the artifact state the ledger's records were written against.
# It is evidence, not a pin: the monitor compares an observation to it and the
# Dockerfiles are unaffected either way.
artifacts:
  - id: caddy-2-alpine
    tag: caddy:2-alpine
    ref: caddy:2-alpine
    # Both are REQUIRED. A component fixed on one platform and not the other
    # does not satisfy an exit condition, because the cohort is 2 children.
    required_platforms: [linux/amd64, linux/arm64]
    baseline:
      # The index digest currently pinned in config/base-images.env and
      # images/caddy/Dockerfile. Unmoved since 2026-06-24.
      index_digest: "sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648"
      observed_at: "2026-08-27T13:56:20Z"
