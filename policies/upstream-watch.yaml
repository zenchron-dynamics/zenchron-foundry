  G20:
    title: "FrankenPHP project — google.golang.org/grpc vendored into the FrankenPHP binary"
    selector: php-frankenphp-8.3-8.4
    exit_condition: >-
      an official FrankenPHP image is published vendoring grpc 1.82.1 or later
      on both required platforms, and the maintainer moves the pin to it.
    records:
      - GHSA-hrxh-6v49-42gf|php-frankenphp-8.3-8.4|google.golang.org/grpc|v1.81.1
