# --- Debian bookworm / bookworm-security remediation state -------------------
# Observed from the Debian security tracker, per source package. This is a
# REMEDIATION-STATE observation about the distribution, NOT an artifact
# observation: a fixed Debian source package existing does not put it in any
# image. It can therefore never satisfy an image exit condition on its own. It
# is watched because the ledger asserts `fix_available: false` for these, and a
# published fix would CONTRADICT that assertion.
debian_watch:
  suites: [bookworm, bookworm-security]
  source_packages:
    - source: openssl
      advisories: [CVE-2026-14456]
      binary_packages: [openssl, libssl3]
      ledger_fix_available: false
      groups: [G12]
    - source: sqlite3
      advisories: [CVE-2026-11822, CVE-2026-11824]
      binary_packages: [libsqlite3-0]
      ledger_fix_available: false
      groups: [G13]
    - source: aom
      advisories: [CVE-2023-6879, CVE-2023-39616, CVE-2026-56208, CVE-2026-56209, CVE-2026-56210, CVE-2026-56211]
      binary_packages: [libaom3]
      ledger_fix_available: false
      groups: [G03]

# --- Alpine package availability ---------------------------------------------
# Same rule: an available aport is NOT remediation. The caddy image is built
# with no package-manager invocation (ADR-0001), so a fixed aport only matters
# once an official caddy artifact ships it — which is what `artifacts` above
# watches. Availability is recorded so the "a fix exists upstream, the exposure
# is pinning lag" claim in the ledger stays checkable.
alpine_watch:
  branch: v3.23
  repositories: [main, community]
  packages:
    - package: openssl
      binary_packages: [libssl3, libcrypto3]
      fixed_version: 3.5.8-r0
      groups: [G22]
    - package: curl
      binary_packages: [curl, libcurl]
      fixed_version: 8.20.0-r0
      groups: [G06]
    - package: c-ares
      binary_packages: [c-ares]
      fixed_version: 1.34.8-r0
      groups: [G16]

# --- root-cause groups in the 2026-09-30 fail-closed cohort -------------------
# Group ids G01-G21 are the ones assigned in
# docs/audits/expiry-refresh-2026-08-25/README.md section 6 and are reused
# unchanged. G22 is assigned HERE for the Alpine `openssl` record created
# 2026-08-27, which postdates that table; assigning a monitor-side label to it
# changes nothing about the record.
#
# `records` are canonical ledger identities, `cve|image|package|installed_version`
# as computed by scripts/lib/exception_id.py. Every id below MUST resolve to a
# live ledger record and every ledger record expiring at `expiry_controls.
# fail_closed` MUST appear in exactly one group — both are asserted, so ledger
# drift is caught rather than silently un-monitored.
groups:
  G02:
    title: "Caddy project — Go toolchain (stdlib) statically linked into the Caddy binary"
    selector: caddy
    exit_condition: >-
      caddy:2-alpine publishes an image built with a fixed Go toolchain on both
      required platforms, and the maintainer moves the pin to it.
    records:
      - CVE-2026-27145|caddy|stdlib|v1.26.3
      - CVE-2026-42504|caddy|stdlib|v1.26.3
      - CVE-2026-39822|caddy|stdlib|v1.26.3
      - CVE-2026-46600|caddy|stdlib|v1.26.3
      - CVE-2026-39821|caddy|stdlib|v1.26.3
      - CVE-2026-33818|caddy|stdlib|v1.26.3
      - CVE-2026-56853|caddy|stdlib|v1.26.3
      - CVE-2026-56858|caddy|stdlib|v1.26.3
      - CVE-2026-56859|caddy|stdlib|v1.26.3
      - CVE-2026-56860|caddy|stdlib|v1.26.3
      - CVE-2026-56862|caddy|stdlib|v1.26.3
  G03:
    title: "Foundry gd/AVIF layer — libaom3 (Debian owns the patch)"
    selector: php-frankenphp-8.3-8.4
    exit_condition: >-
      either the gd build stops pulling AVIF support, or a fixed libaom reaches
      the packages the Foundry layer installs. No contract-preserving Foundry
      remediation exists today.
    records:
      - CVE-2023-6879|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
      - CVE-2026-56211|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
      - CVE-2026-56208|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
      - CVE-2026-56209|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
      - CVE-2026-56210|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
      - CVE-2023-39616|php-frankenphp-8.3-8.4|libaom3|3.6.0-1+deb12u2
  G06:
    title: "Alpine aports — curl"
    selector: caddy
    exit_condition: >-
      caddy:2-alpine publishes an image carrying curl 8.20.0-r0 or later on both
      required platforms, and the maintainer moves the pin to it.
    records:
      - CVE-2026-6276|caddy|curl,libcurl|8.19.0-r0
      - CVE-2026-5773|caddy|curl,libcurl|8.19.0-r0
  G12:
    title: "Debian bookworm security — openssl"
    selector: php-8.3-8.4, nginx
    exit_condition: >-
      Debian bookworm publishes a fixed openssl, or a patched official base is
      published on a tracked tag.
    records:
      - CVE-2026-14456|php-8.3-8.4|libssl3,openssl|3.0.20-1~deb12u2
      - CVE-2026-14456|nginx|libssl3,openssl|3.0.20-1~deb12u2
  G13:
    title: "Debian bookworm security — sqlite3"
    selector: php-8.3-8.4
    # The group's third record (CVE-2025-7458, same component at the same
    # version) carries expires_at 2026-10-31 and is therefore NOT in the
    # fail-closed cohort. Listing it here would misstate the checkpoint.
    exit_condition: "Debian bookworm publishes a fixed sqlite3 source package."
    records:
      - CVE-2026-11822|php-8.3-8.4|libsqlite3-0|3.40.1-2+deb12u2
