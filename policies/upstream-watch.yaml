      an official caddy:2-alpine rebuild carrying libssl3 and libcrypto3
      >= 3.5.8-r0 on BOTH linux/amd64 and linux/arm64, and the pin moved to it.
    records:
      - CVE-2026-14456|caddy|libcrypto3,libssl3|3.5.7-r0

# --- expiry operating controls ------------------------------------------------
# Checkpoints are PROMPTS. Reaching one schedules nothing, renews nothing and
# extends nothing; the fail-closed date does not move because a checkpoint
# passed unanswered. `scripts/upstream-monitor.py checkpoints` renders them with
# the exact groups and records at stake, never a bare date.
expiry_controls:
  fail_closed: "2026-09-30"
  fail_closed_effect: >-
    On 2026-09-30 every record listed under `groups` becomes invalid — both
    gates compare `expires_at <= today` — and reconcile-vulnerabilities.sh
    refuses the matching findings as ungoverned. caddy/prod, nginx/prod and the
    php-frankenphp children fail the release gate.
  renewal_is_not_automatic: >-
    NOTHING IN THIS REPOSITORY RENEWS AN EXCEPTION. There is no automatic
    extension, no default roll-forward and no tool that may write
    policies/vulnerability-exceptions.yaml. Continuing a record is a fresh risk
    acceptance the maintainer role records by hand, with its own justification.
  checkpoints:
    - date: "2026-09-15"
      id: first-review
      title: "First review"
      prompt: >-
        Read each group's exit condition against the latest monitor observation
        and decide, per group, which of remove / re-accept / lapse you intend.
        Recording an intention here is not a decision and moves no date.
    - date: "2026-09-23"
      id: final-evidence-refresh
      title: "Final evidence refresh"
      prompt: >-
        Refresh the evidence any continuation would rest on — a buildless rescan
        of the retained cohort and a monitor observation — while there is still
        time to act on what it says. Refreshing evidence is not a renewal.
    - date: "2026-09-27"
      id: maintainer-decision-deadline
      title: "Maintainer decision deadline"
      prompt: >-
        Last date on which a decision can be recorded and reviewed before the
        cohort lapses. If no decision is recorded, the records expire on
        2026-09-30 as written. That is the default, and it is not a failure of
        this process — it is the process working.
