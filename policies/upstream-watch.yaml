    records:
      - GHSA-r277-6w6q-xmqw|php-frankenphp-8.3-8.4|github.com/getkin/kin-openapi|v0.140.0
      - CVE-2026-76905|php-frankenphp-8.3-8.4|github.com/getkin/kin-openapi|v0.140.0
      - CVE-2026-77354|php-frankenphp-8.3-8.4|github.com/getkin/kin-openapi|v0.140.0
  G22:
    title: "Alpine aports — openssl (libssl3 / libcrypto3 in the caddy children)"
    selector: caddy
