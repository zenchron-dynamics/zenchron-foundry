        clearing_version: 3.5.8-r0
        groups: [G22]
      - component: libcrypto3
        ecosystem: apk
        baseline_version: 3.5.7-r0
        clearing_version: 3.5.8-r0
        groups: [G22]
      - component: curl
        ecosystem: apk
        baseline_version: 8.19.0-r0
        clearing_version: 8.20.0-r0
        groups: [G06]
      - component: libcurl
        ecosystem: apk
        baseline_version: 8.19.0-r0
        clearing_version: 8.20.0-r0
        groups: [G06]
