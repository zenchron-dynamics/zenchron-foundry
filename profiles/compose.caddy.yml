# Zenchron Dynamics — Caddy edge profile (reverse proxy / static / php_fastcgi).
# Listens on :8080/:8443 unprivileged and runs with ZERO Linux capabilities
# (the cap_net_bind_service file cap is stripped from the binary so it execs
# under cap_drop: ALL). Binding :80/:443 directly is intentionally NOT supported
# by this hardened image — terminate TLS at an upstream LB/ingress and forward to
# the high ports (the platform's documented topology).
services:
  caddy:
    image: ghcr.io/zenchron-dynamics/caddy:prod
    depends_on:
      php-fpm:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./public:/app/public:ro
      - ./deploy/caddy/app.caddy:/etc/caddy/conf.d/app.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend

volumes:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
