# =============================================================================
# Zenchron Dynamics — shared SECURITY profile (compose override).
# Apply on top of an app compose file with `-f compose.yml -f compose.security.yml`.
# Uses YAML anchors so each service opts in via `<<: *zenchron-hardening`.
# This file defines defaults under x-* AND applies them to common service names.
# Copy/extend per project — it is intentionally explicit, not magic.
# =============================================================================

# Reusable hardening block. Reference with: <<: *zenchron-hardening
x-zenchron-hardening: &zenchron-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  restart: unless-stopped
  # NO `user:` here, deliberately (#118).
  #
  # This block used to force user: "10001:10001" on every service it was spread
  # into, including nginx — which runs as UID 101 in the image, because it is
  # built on the upstream nginx-unprivileged base and every path it owns
  # (/etc/nginx, its temp dirs) is chowned 101:101. Overriding it globally meant
  # the image and the recommended Compose overlay disagreed about who the process
  # is, so mounted configs and assets behaved differently depending on which one
  # a consumer followed, and the platform's audit claim of a deterministic UID
  # 10001 was not true of all ten images.
  #
  # The identity per image is declared in contracts/images/<image>.yaml (`user:`)
  # and asserted against the built image by scripts/verify-image-contract.sh.
  # That file is the source of truth; each service below states its identity
  # explicitly to match, and tests/runtime/test_uid_contract.sh fails if the two
  # ever drift apart.
  # Writable scratch only; noexec/nosuid/nodev.
  tmpfs:
    - /tmp:size=64m,noexec,nosuid,nodev
    - /run:size=8m,noexec,nosuid,nodev
  # Bound resources (tune per service/host).
  mem_limit: 512m
  memswap_limit: 512m
  ulimits:
    nofile:
      soft: 4096
      hard: 8192
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Example application of the block to typical service names. Projects should
# spread the anchor into their own services rather than rely on these names.
#
# Each service states its own identity. The value must equal the `user:` in that
# image's runtime contract — see the note on the hardening block above.
services:
  php-fpm:
    <<: *zenchron-hardening
    user: "10001:10001"
  php-cli:
    <<: *zenchron-hardening
    user: "10001:10001"
    restart: "no"          # one-off jobs should not auto-restart
  worker:
    <<: *zenchron-hardening
    user: "10001:10001"
  frankenphp:
    <<: *zenchron-hardening
    user: "10001:10001"
  nginx:
    <<: *zenchron-hardening
    # NOT 10001. The upstream nginx-unprivileged base owns its files as 101:101;
    # see contracts/images/nginx-prod.yaml.
    user: "101:101"
  caddy:
    <<: *zenchron-hardening
    user: "10001:10001"
