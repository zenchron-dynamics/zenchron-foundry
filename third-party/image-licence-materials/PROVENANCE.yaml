# =============================================================================
# third-party/image-licence-materials/PROVENANCE.yaml
#   Licence and copyright material extracted from INSIDE the accepted production
#   images. Issue #120, action N1.
# -----------------------------------------------------------------------------
# THESE ARE NOT ZENCHRON FOUNDRY'S LICENCE, and they are not the canonical SPDX
# texts either. third-party/licence-texts/ carries the text of an IDENTIFIER —
# GPL-2.0 as SPDX publishes it. This directory carries what the SHIPPED IMAGES
# actually contain: Debian's per-binary-package `copyright` files, the shared
# texts under /usr/share/common-licenses that those files defer to, and the
# licence files PEAR components leave under /usr/local/lib/php/doc. They are the
# artifacts `retain-copyright-notice` is an obligation about, and until N1 no
# control in this repository had read a byte of one.
#
# PROVENANCE IS THE IMAGE, NOT AN UPSTREAM REPOSITORY. Every file below was read
# out of a specific child of the accepted multi-architecture run, addressed by
# its immutable manifest digest, with the manifest bytes re-hashed and the config
# blob's own os/architecture checked against the platform that run recorded. No
# image was built, no Dockerfile ran, no package manager ran, no mutable tag was
# read and no SBOM was regenerated.
#
# CONTENT-ADDRESSED, STORED ONCE. Debian shares one copyright file between the
# binary packages of a source package, and the same file appears in eighteen
# children. It is stored ONCE under its sha256 and every consumer is bound to
# that hash, so a shared file cannot drift for one consumer and not another. The
# full component-to-hash binding, including every symlink chain that had to be
# followed to reach a file, is in the accounting record named below.
#
# VERBATIM. Raw bytes as they shipped, never rewritten. Where Debian ships a
# copyright file gzip-compressed, the compressed bytes are what is stored and
# hashed, and the decompression is recorded as a separate DERIVED artifact with
# its own checksum in the accounting record.
#
# WHAT IS DELIBERATELY NOT CARRIED. The installed-package databases
# (var/lib/dpkg/status, lib/apk/db/installed) and the distro identity files are
# evidence for the MAPPING, not material an obligation requires preserving, and
# they are two thirds of the extracted bytes. Their sha256 values are recorded in
# the extraction manifest so the mapping stays checkable by re-extraction.
#
# Re-derive this directory, buildlessly, from the immutable digests:
#   python3 scripts/license/extract-image-licence-materials.py \
#     --acceptance docs/audits/acceptance-multiarch-2026-08-20/acceptance-evidence.json \
#     --repo zenchron-dynamics/foundry-staging --out-dir <scratch> --token-file <tok>
#   python3 scripts/license/account-image-licence-materials.py \
#     --materials <scratch>/image-licence-materials.json \
#     --diagnostic docs/audits/real-image-inventories-2026-08-28/licence/image-licence-policy-diagnostic.log \
#     --acceptance docs/audits/acceptance-multiarch-2026-08-20/acceptance-evidence.json \
#     --objects <scratch>/objects --publish-dir third-party/image-licence-materials \
#     --out <accounting.json>
# =============================================================================
