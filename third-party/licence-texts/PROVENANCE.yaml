# =============================================================================
# third-party/licence-texts/PROVENANCE.yaml
#   Provenance for the canonical licence TEXTS carried in this directory.
# -----------------------------------------------------------------------------
# THESE ARE NOT ZENCHRON FOUNDRY'S LICENCE. The project's outbound licence is the
# root LICENSE file, which declares itself a placeholder, and
# policies/license-policy.yaml records `publication.decision: undetermined`
# (#98). Nothing in this directory selects, replaces or implies outbound terms.
#
# WHAT THEY ARE. A redistributor of a component licensed under `X` owes the
# recipient the text of `X`. The image cohort measured in
# docs/audits/real-image-inventories-2026-08-28/ resolves 53 distinct licence
# identifiers; the licence policy classifies 26. This directory carries the
# canonical text for every identifier in either set, so that the obligation
# "retain-license-text" is mechanically dischargeable for each of them rather
# than asserted.
#
# CARRYING A TEXT DISCHARGES NOTHING ON ITS OWN. It makes the artifact exist.
# Whether a given licence's obligations are SATISFIED by the shipped form is a
# legal question, it is #98's, and no file in this directory answers it.
#
# WHY THE SPDX LIST AND NOT EACH PROJECT'S OWN COPY. The SPDX License List is
# the authority that DEFINES the identifiers the SBOMs assert. A text fetched
# from an arbitrary project repository would be that project's rendering of the
# licence, which is what a per-component NOTICE is for. The identifier's text is
# fetched from the identifier's authority, pinned to one immutable revision.
#
# Re-derive every hash below with:
#   curl -sSf https://raw.githubusercontent.com/spdx/license-list-data/v3.28.0/text/<ID>.txt \
#     | shasum -a 256
# =============================================================================
schema_version: 1
record_type: carried-licence-texts
