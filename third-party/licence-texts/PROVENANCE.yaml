  retrieved_at: '2026-08-28T10:16:19Z'
  retrieval_method: >-
    One HTTPS GET per identifier against raw.githubusercontent.com at the pinned
    tag: https://raw.githubusercontent.com/spdx/license-list-data/v3.28.0/text/<ID>.txt
    Each response body was written to disk unmodified and hashed. No text was
    reformatted, re-wrapped, truncated or templated.
  list_publication_terms: >-
    The SPDX License List itself is published by the Linux Foundation under
    CC-BY-3.0. Attribution to SPDX is retained by this record, which names the
    project, the pinned revision and the exact upstream path of every file. The
    individual licence texts are the licences themselves and are reproduced
    verbatim as those licences require.
  scope_note: >-
    The set is the union of (a) every identifier the licence policy classifies,
    (b) every identifier the 20-child production cohort resolved, measured in
    docs/audits/real-image-inventories-2026-08-28/licence/identifier-reconciliation.json,
    and (c) PHP-3.01, which the cohort does NOT resolve because the binary
    cataloguer emits no licence field for the PHP components - it is established
    instead by policies/upstream-licence-attestations.yaml, and an attestation
    without its text discharges nothing.
